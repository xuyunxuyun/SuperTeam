            function applyCharTransform(img, name, scene) {
        let charDef = null;
        // 优先用当前场景的角色定义
        if (scene && Array.isArray(scene.characters)) {
          charDef = scene.characters.find(c => c.name === name) || null;
        }
        // 找不到再全剧本兜底
        if (!charDef) {
          const scenes = state.currentScript && state.currentScript.scenes;
          if (scenes) {
            for (const sid in scenes) {
              const sc = scenes[sid];
              if (!sc || !Array.isArray(sc.characters)) continue;
              const f = sc.characters.find(c => c.name === name);
              if (f) { charDef = f; break; }
            }
          }
        }
        const pos = img.classList.contains('center') ? 'center' :
                    img.classList.contains('midLeft') ? 'midLeft' :
                    img.classList.contains('midRight') ? 'midRight' :
                    img.classList.contains('left') ? 'left' :
                    img.classList.contains('right') ? 'right' : 'center';
        const off = charDef && charDef.offsetX ? Number(charDef.offsetX) : 0;
        if (pos === 'center') {
          img.style.transform = off ? `translateX(calc(-50% + ${off}px))` : 'translateX(-50%)';
        } else {
          img.style.transform = off ? `translateX(${off}px)` : '';
        }
      }

      function createCharImg(name, url, position, scene) {
        const img = document.createElement('img');
        img.className = 'char-sprite ' + (position || 'center');
        img.src = url;
        img.alt = name;
        applyCharTransform(img, name, scene);
        return img;
      }

      function showCharSprite(name, url, scene) {
        if (!url) return;
        let img = findCharImg(name);
        if (img) {
          delete img.dataset.removing;
          img.src = url;
          // 重新校准 position（关键修复）
          const charDef = ((scene && scene.characters) || []).find(c => c.name === name);
          const pos = charDef ? (charDef.position || 'center') : 'center';
          img.classList.remove('left', 'midLeft', 'center', 'midRight', 'right');
          img.classList.add(pos);
          applyCharTransform(img, name, scene);
          if (!img.classList.contains('show')) {
            requestAnimationFrame(() => img.classList.add('show'));
          }
        } else {
          const charDef = ((scene && scene.characters) || []).find(c => c.name === name);
          const pos = charDef ? charDef.position : 'center';
          img = createCharImg(name, url, pos, scene);
          charLayer.appendChild(img);
          requestAnimationFrame(() => img.classList.add('show'));
        }
        state._charVisible[name] = true;
      }

      function hideCharSprite(name) {
        const img = findCharImg(name);
        if (img) {
          img.classList.remove('show');
          img.dataset.removing = '1';
          setTimeout(() => {
            if (img.dataset.removing === '1' && img.parentNode) {
              img.parentNode.removeChild(img);
            }
          }, 520);
        }
        state._charVisible[name] = false;
      }

      function clearAllCharSprites() {
        const imgs = charLayer.querySelectorAll('.char-sprite');
        if (imgs.length > 0) {
          imgs.forEach(img => {
            img.classList.remove('show');
            img.dataset.removing = '1';
          });
          setTimeout(() => {
            charLayer.querySelectorAll('.char-sprite').forEach(img => {
              if (img.dataset.removing === '1' && img.parentNode) {
                img.parentNode.removeChild(img);
              }
            });
          }, 520);
        }
        state._charVisible = {};
        state._dialogStageEntered = false;
      }

      function initSceneCharacters(scene) {
        clearAllCharSprites();
        (scene.characters || []).forEach(c => {
          if (c.appearAt === 'scene') {
            const url = assetUrl(c.defaultSprite);
            if (url) showCharSprite(c.name, url, scene);
          }
        });
      }

      function handleDescAppear(scene) {
        state._descCount++;
        (scene.characters || []).forEach(c => {
          if (typeof c.appearAt === 'number' && c.appearAt <= state._descCount) {
            if (!state._charVisible[c.name]) {
              const url = assetUrl(c.defaultSprite);
              if (url) showCharSprite(c.name, url, scene);
            }
          }
        });
      }

      function enterDialogueStage(scene) {
        if (state._dialogStageEntered) return;
        state._dialogStageEntered = true;
        (scene.characters || []).forEach(c => {
          if (c.appearAt === 'dialogue' || c.appearAt === undefined) {
            const url = assetUrl(c.defaultSprite);
            if (url) showCharSprite(c.name, url, scene);
          }
        });
      }

      function applyDialogueSprite(scene, d) {
        if (!d) return;
        // autoHidePrev：先把上一个说话人隐藏
        if (d.autoHidePrev && state._lastSpeaker && state._lastSpeaker !== d.speaker) {
          hideCharSprite(state._lastSpeaker);
        }
        if (d.hide) {
          hideCharSprite(d.speaker);
          if (state._lastSpeaker === d.speaker) state._lastSpeaker = null;
          return;
        }
        if (d.sprite) {
          let url = '';
          // 短名（不含路径分隔符）：优先从当前 speaker 的 sprites 里解析
          if (d.sprite.indexOf('/') < 0 && scene && Array.isArray(scene.characters)) {
            const speakerDef = scene.characters.find(c => c.name === d.speaker);
            if (speakerDef && speakerDef.sprites && speakerDef.sprites[d.sprite]) {
              url = assetUrl(speakerDef.sprites[d.sprite]);
            }
          }
          // 没找到或不是短名，走原逻辑
          if (!url) url = assetUrl(d.sprite);
          if (url) showCharSprite(d.speaker, url, scene);
        }
        state._lastSpeaker = d.speaker;
      }

      // ============================================================
      // 快照与回退
      // ============================================================
      function takeSnapshot() {
        const charSprites = {};
        charLayer.querySelectorAll('.char-sprite').forEach(img => {
          charSprites[img.alt] = img.src;
        });
        return {
          sceneId: state.currentSceneId,
          phase: state.phase,
          stepIndex: state._stepIndex,
          steps: deepClone(state._steps),
          stepWait: state._stepWait,
          descCount: state._descCount,
          choices: deepClone(state.choices),
          timeline: deepClone(state._timeline),
          items: deepClone(state._items),
          vars: deepClone(state.vars),
          inputConfig: deepClone(state._inputConfig),
          pendingInputNext: state._pendingInputNext,
          inputValue: (state.phase === 'input' && inputField) ? inputField.value : null,
          charVisible: deepClone(state._charVisible),
          charSprites: charSprites,
          dialogStageEntered: state._dialogStageEntered,
          hideUI: state._hideUI
        };
      }

      function pushStepHistory() {
        if (!state._allowRewind) return;
        state._stepStack.push(takeSnapshot());
      }

      function updateRewindBtn() {
        if (!state._allowRewind) {
          rewindBtn.style.display = 'none';
          return;
        }
        rewindBtn.style.display = 'inline-block';
        rewindBtn.disabled = state._stepStack.length === 0;
      }

      function displayCurrentStepStatic() {
        const step = state._steps[state._stepIndex];
        if (!step) { resolveNext(state.currentNode.next); return; }
        if (step.type === 'desc') {
          if (step.hideUI) {
            hideUI();
            state.phase = 'step';
            state._stepWait = true;
          } else {
            hideAll();
            state._hideUI = false;
            descBox.style.display = 'block';
            descText.textContent = fill(String(step.text || ''));
            state.phase = 'step';
            state._stepWait = true;
          }
        } else if (step.type === 'dialogue') {
          enterDialogueStage(state.currentNode);
          applyDialogueSprite(state.currentNode, step);
          if (step.hideUI) {
            hideUI();
            state.phase = 'step';
            state._stepWait = true;
          } else {
            hideAll();
            state._hideUI = false;
            dialogBox.style.display = 'block';
            dialogName.textContent = fill(step.speaker || '');
            dialogProgress.textContent = `${state._stepIndex + 1} / ${state._steps.length}`;
            dialogText.textContent = fill(step.text || '');
            state.phase = 'step';
            state._stepWait = true;
          }
        } else if (step.type === 'tree') {
          hideAll();
          state._hideUI = false;
          descBox.style.display = 'block';
          descText.innerHTML = '';
          descText.appendChild(renderTree(step.tree || [], {}));
          state.phase = 'step';
          state._stepWait = true;
        } else if (step.type === 'pause') {
          if (step.hideUI) hideUI();
          else hideAll();
          state.phase = 'step';
          state._stepWait = true;
        }
      }

      function restoreSnapshot(snap) {
        cleanupCurrentScene();
        state.currentSceneId = snap.sceneId;
        state.currentNode = state.currentScript.scenes[snap.sceneId];
        state.phase = snap.phase;
        state._stepIndex = snap.stepIndex;
        state._steps = snap.steps;
        state._stepWait = snap.stepWait;
        state._descCount = snap.descCount;
        state.choices = snap.choices;
        state._timeline = snap.timeline;
        state._items = snap.items;
        state.vars = snap.vars;
        state._inputConfig = snap.inputConfig;
        state._pendingInputNext = snap.pendingInputNext;
        state._charVisible = snap.charVisible || {};
        state._dialogStageEntered = snap.dialogStageEntered || false;
        state._lastSpeaker = null;
        state._hideUI = snap.hideUI || false;

        renderBackground(state.currentNode);
        applySceneBgm(state.currentNode);

        charLayer.innerHTML = '';
        (state.currentNode.characters || []).forEach(c => {
          if (state._charVisible[c.name] && snap.charSprites[c.name]) {
            const img = document.createElement('img');
            img.className = 'char-sprite show ' + (c.position || 'center');
            img.src = snap.charSprites[c.name];
            img.alt = c.name;
            applyCharTransform(img, c.name, state.currentNode);
            charLayer.appendChild(img);
          }
        });
        renderItemIcons();

        if (state.phase === 'input') {
          showInputAt(state._steps[state._stepIndex], snap.inputValue);
        } else if (state.phase === 'choice') {
          showChoices();
        } else {
          displayCurrentStepStatic();
        }
      }

      function rewindOneStep() {
        if (!state._allowRewind) return;
        if (state._stepStack.length === 0) {
          setStatus('⚠️ 已经是最开始了', false);
          return;
        }
        AudioManager.stopVoice();
        const snap = state._stepStack.pop();
        restoreSnapshot(snap);
        updateRewindBtn();
        setStatus('↩ 已退回上一步', true);
      }

      rewindBtn.addEventListener('click', rewindOneStep);

      // ============================================================
      // 背景
      // ============================================================
      function renderBackground(scene) {
        const url = (scene && scene.background) ? assetUrl(scene.background) : '';
        const newBg = url ? `url('${url}')` : 'none';
        const curTop = _bgOnFade ? bgFade : bg;
        const curBottom = _bgOnFade ? bg : bgFade;

        if (curTop.style.backgroundImage === newBg) return;

        curBottom.style.transition = 'none';
        curBottom.style.backgroundImage = newBg;
        curBottom.style.opacity = '0';
        void curBottom.offsetWidth;
        curBottom.style.transition = 'opacity 0.6s ease';
        curBottom.style.opacity = '1';

        curTop.style.transition = 'opacity 0.6s ease';
        curTop.style.opacity = '0';

        _bgOnFade = !_bgOnFade;
      }

      // ============================================================
      // 场景 BGM
      // ============================================================
      function applySceneBgm(scene) {
        const bgm = scene.bgm || '';
        const cont = scene.bgmContinue === true;
        const vol = scene.bgmVolume != null ? scene.bgmVolume : 0.6;
        if (cont) {
          AudioManager.setBgmVolume(vol);
          return;
        }
        if (!bgm) { AudioManager.stopBgm(600); return; }
        AudioManager.playBgm(bgm, { volume: vol });
      }

      // ============================================================
      // next 解析
      // ============================================================
      function resolveNext(next) {
        if (!next) { handleSceneEnding(state.currentNode); return; }
        if (typeof next === 'string') { goToScene(next); return; }
        if (next.switch && Array.isArray(next.switch)) {
          for (const r of next.switch) {
            if (evaluateCondition(r.if)) { goToScene(r.to); return; }
          }
          if (next.default) goToScene(next.default);
          else handleSceneEnding(state.currentNode);
          return;
        }
        if (next.random && Array.isArray(next.random)) {
          const total = next.random.reduce((s, r) => s + (r.weight || 1), 0);
          let r = Math.random() * total;
          for (const it of next.random) {
            r -= (it.weight || 1);
            if (r <= 0) { goToScene(it.to); return; }
          }
          goToScene(next.random[next.random.length - 1].to);
          return;
        }
        if (next.parallel) {
          console.error('parallel 未实现');
          handleSceneEnding(state.currentNode);
          return;
        }
        handleSceneEnding(state.currentNode);
      }

      // ============================================================
      // 场景分流
      // ============================================================
      function goToScene(sceneId) {
        const script = state.currentScript;
        if (!script || !script.scenes) return;
        const scene = script.scenes[sceneId];
        if (!scene) { console.error('场景不存在:', sceneId); return; }

        cleanupCurrentScene();
        AudioManager.stopVoice();

        state.currentSceneId = sceneId;
        state.currentNode = scene;
        state._lastSpeaker = null;

        const afterEnter = () => {
          applySceneBgm(scene);
          const type = scene.type || 'dialogue';
          if (type === 'cg') return renderCgScene(scene);
          if (type === 'video') return renderVideoScene(scene);
          if (type === 'html') return renderHtmlScene(scene);
          if (type === 'showcase') return renderShowcaseScene(scene);
          return renderDialogueScene(scene);
        };

        if (scene.onEnter && scene.onEnter.length) {
          executeActions(scene.onEnter, { scene }).then(afterEnter).catch(afterEnter);
        } else {
          afterEnter();
        }
      }

      // ============================================================
      // dialogue 场景（steps）
      // ============================================================
      function normalizeScene(scene) {
        if (Array.isArray(scene.steps) && scene.steps.length > 0) return scene.steps.slice();
        const steps = [];
        (scene.descriptions || []).forEach(d => {
          if (typeof d === 'string') steps.push({ type: 'desc', text: d });
          else if (d && typeof d === 'object') steps.push(Object.assign({ type: 'desc' }, d));
        });
        (scene.dialogues || []).forEach(d => {
          if (d && typeof d === 'object') steps.push(Object.assign({ type: 'dialogue' }, d));
        });
        if (scene.input && typeof scene.input === 'object') {
          steps.push(Object.assign({ type: 'input' }, scene.input));
        }
        if (Array.isArray(scene.choices) && scene.choices.length > 0) {
          steps.push({ type: 'choice', choices: scene.choices });
        }
        return steps;
      }

      function renderDialogueScene(scene) {
        renderBackground(scene);
        initSceneCharacters(scene);
        if (scene.items && scene.items.length > 0) {
          scene.items.forEach(it => {
            if (!state._items.some(o => o.name === it.name && o.image === it.image)) {
              state._items.push(it);
            }
          });
        }
        renderItemIcons();

        state._steps = normalizeScene(scene);
        state._stepIndex = 0;
        state._descCount = 0;
        state._hideUI = false;
        state.phase = 'step';
        state._stepWait = false;

        if (scene.initialHideUI) hideUI();
        else hideAll();

        runNextStep();
      }

      function runNextStep() {
        if (state._stepIndex >= state._steps.length) {
          resolveNext(state.currentNode.next);
          return;
        }
        executeStep(state._steps[state._stepIndex]);
      }

      function proceedStep() {
        state._stepIndex++;
        runNextStep();
      }

      function executeStep(step) {
        if (!step || !step.type) { proceedStep(); return; }
        const h = STEP_HANDLERS[step.type];
        if (h) h(step);
        else { console.warn('未知 step 类型:', step.type); proceedStep(); }
      }

      const STEP_HANDLERS = {
        desc: showDescStep,
        dialogue: showDialogueStep,
        input: (step) => showInputAt(step),
        choice: () => showChoices(),
        tree: showTreeStep,
        pause: (step) => {
          if (step.hideUI) hideUI();
          else hideAll();
          state.phase = 'step';
          if (step.duration > 0) {
            state._stepWait = false;
            const capturedIndex = state._stepIndex;
            setTimeout(() => {
              if (state.phase === 'step' && !state._stepWait && state._stepIndex === capturedIndex) {
                state._stepWait = false;
                proceedStep();
              }
            }, step.duration);
          } else {
            state._stepWait = true;
          }
        },
        action: (step) => {
          state.phase = 'auto';
          state._stepWait = false;
          executeActions(step.actions || [], {}).then(proceedStep).catch(proceedStep);
        },
        jump: (step) => { goToScene(step.to); },
        if: (step) => {
          const branch = evaluateCondition(step.expr) ? (step.then || []) : (step.else || []);
          state._steps.splice(state._stepIndex + 1, 0, ...branch);
          proceedStep();
        },
        cg: (step) => renderCgStep(step),
        video: (step) => renderVideoStep(step)
      };

      function showDescStep(step) {
        handleDescAppear(state.currentNode);
        const myIndex = state._stepIndex;
        if (step.hideUI) {
          hideUI();
        } else {
          hideAll();
          state._hideUI = false;
          descBox.style.display = 'block';
          descText.textContent = fill(String(step.text || ''));
        }
        setStatus(`📖 ${state._stepIndex + 1}/${state._steps.length}`, true);
        state.phase = 'step';
        state._stepWait = true;
        if (step.audio) {
          const p = AudioManager.playVoice(step.audio, { volume: step.audioVolume });
          if (step.audioWait) {
            p.then(() => {
              if (state._stepIndex === myIndex && state._stepWait && state.phase === 'step') {
                state._stepWait = false;
                proceedStep();
                updateRewindBtn();
              }
            });
          }
        }
      }

      function showDialogueStep(step) {
        enterDialogueStage(state.currentNode);
        applyDialogueSprite(state.currentNode, step);
        const myIndex = state._stepIndex;
        if (step.hideUI) {
          hideUI();
        } else {
          hideAll();
          state._hideUI = false;
          dialogBox.style.display = 'block';
          dialogName.textContent = fill(step.speaker || '');
          dialogProgress.textContent = `${state._stepIndex + 1} / ${state._steps.length}`;
          dialogText.textContent = fill(step.text || '');
        }
        setStatus('💬 对话', true);
        state.phase = 'step';
        state._stepWait = true;
        if (step.audio) {
          const p = AudioManager.playVoice(step.audio, { volume: step.audioVolume });
          if (step.audioWait) {
            p.then(() => {
              if (state._stepIndex === myIndex && state._stepWait && state.phase === 'step') {
                state._stepWait = false;
                proceedStep();
                updateRewindBtn();
              }
            });
          }
        }
      }

      function showTreeStep(step) {
        hideAll();
        state._hideUI = false;
        descBox.style.display = 'block';
        descText.innerHTML = '';
        descText.appendChild(renderTree(step.tree || [], {}));
        state.phase = 'step';
        state._stepWait = true;
        setStatus('📋 展示中', true);
      }

      // ============================================================
      // 输入与选项
      // ============================================================
      function showInputAt(step, savedValue) {
        const cfg = step || (state.currentNode && state.currentNode.input);
        if (!cfg) { proceedStep(); return; }
        hideAll();
        state._hideUI = false;
        inputBox.style.display = 'block';
        inputPrompt.textContent = fill(cfg.prompt || '请作答：');
        inputField.value = savedValue != null ? savedValue : (cfg.default || '');
        inputField.placeholder = fill(cfg.placeholder || '');
        inputField.maxLength = cfg.maxLength || 99999;
        state._inputConfig = cfg;
        state._pendingInputNext = cfg.next || null;
        updateInputCounter();
        state.phase = 'input';
        setStatus('✏️ 输入中', true);
        setTimeout(() => inputField.focus(), 100);
      }

      function updateInputCounter() {
        const len = (inputField.value || '').length;
        const max = state._inputConfig && state._inputConfig.maxLength;
        inputCounter.textContent = max ? `${len} / ${max} 字` : `${len} 字`;
      }

      function showChoices() {
        const step = state._steps[state._stepIndex];
        const choices = (step && step.choices) || (state.currentNode && state.currentNode.choices) || [];
        if (!choices.length) { resolveNext(state.currentNode.next); return; }
        hideAll();
        state._hideUI = false;
        choiceBox.style.display = 'flex';
        choiceBox.innerHTML = '';
        choices.forEach(c => {
          const btn = document.createElement('button');
          btn.className = 'choice-btn';
          const numSpan = document.createElement('span');
          numSpan.className = 'choice-num';
          numSpan.textContent = `【${c.id}】`;
          btn.appendChild(numSpan);
          btn.appendChild(document.createTextNode(fill(c.text)));
          btn.addEventListener('click', () => pickChoice(c));
          choiceBox.appendChild(btn);
        });
        setStatus('🤔 请选择', true);
        state.phase = 'choice';
        state._stepWait = false;
      }

      function pickChoice(c) {
        pushStepHistory();
        AudioManager.stopVoice();
        state.choices.push({
          scene: state.currentSceneId,
          sceneName: state.currentNode.sceneName,
          choiceId: c.id,
          text: c.text,
          pathType: c.pathType,
          next: c.next
        });
        state._timeline.push({
          scene: state.currentSceneId,
          sceneName: state.currentNode.sceneName || state.currentSceneId,
          type: 'choice',
          choiceId: c.id,
          text: c.text,
          pathType: c.pathType || null
        });
        state._stepWait = false;
        const go = () => {
          if (c.next) resolveNext(c.next);
          else proceedStep();
        };
        if (c.actions) executeActions(c.actions, { choice: c }).then(go).catch(go);
        else go();
        updateRewindBtn();
      }

      function advance() {
        AudioManager.stopVoice();
        if (state.phase === 'ending') return;
        if (state.phase === 'input') return;
        if (state.phase === 'choice') return;
        if (state.phase === 'auto') return;
        if (!state._stepWait) return;
        pushStepHistory();
        state._stepWait = false;
        proceedStep();
        updateRewindBtn();
      }

      // ============================================================
      // 输入事件
      // ============================================================
      inputField.addEventListener('input', updateInputCounter);
      inputField.addEventListener('keydown', function (e) {
        if (e.key === 'Enter' && !e.shiftKey) {
          e.preventDefault();
          inputSubmit.click();
        }
      });

      inputSubmit.addEventListener('click', function () {
        const cfg = state._inputConfig;
        if (!cfg) return;
        const value = (inputField.value || '').trim();
        if (cfg.required !== false && !value) {
          inputField.focus();
          setStatus('⚠️ 请先输入内容', false);
          return;
        }
        pushStepHistory();
        AudioManager.stopVoice();
        state._timeline.push({
          scene: state.currentSceneId,
          sceneName: state.currentNode.sceneName || state.currentSceneId,
          type: 'input',
          prompt: cfg.prompt || '',
          value: value
        });
        const varName = cfg.name || ('input_' + state.currentSceneId);
        state.vars[varName] = value;
        state._stepWait = false;
        if (cfg.next) resolveNext(cfg.next);
        else proceedStep();
        updateRewindBtn();
      });

      // ============================================================
      // 场景类型：cg / video / html / showcase
      // ============================================================
      function renderCgScene(scene) {
        renderBackground(scene);
        initSceneCharacters(scene);
        hideAll();
        const cg = scene.cg || {};
        const images = cg.images || [];
        const interval = cg.interval || 1200;
        if (images.length === 0) { resolveNext(scene.next); return; }

        let idx = 0, timer = null, finished = false, lastShown = -1;
        const showFrame = (i) => {
          if (i < 0 || i >= images.length || lastShown === i) return;
          lastShown = i;
          const url = assetUrl(images[i]);
          if (!url) return;
          const top = _bgOnFade ? bgFade : bg;
          const bot = _bgOnFade ? bg : bgFade;
          bot.style.transition = 'none';
          bot.style.backgroundImage = `url('${url}')`;
          bot.style.opacity = '0';
          void bot.offsetWidth;
          bot.style.transition = 'opacity 0.4s ease';
          bot.style.opacity = '1';
          top.style.transition = 'opacity 0.4s ease';
          top.style.opacity = '0';
          _bgOnFade = !_bgOnFade;
        };
        const finish = () => {
          if (finished) return;
          finished = true;
          if (timer) clearTimeout(timer);
          state.phase = 'step';
          state._stepWait = true;
          setStatus('🎬 点击继续', true);
        };
        const step = () => {
          if (finished) return;
          showFrame(idx);
          idx++;
          if (idx >= images.length) finish();
          else timer = setTimeout(step, interval);
        };
        const onClick = (e) => {
          if (e.target.closest('button, input, textarea, select, #formModal, #introModal, #uploadPage, #scriptSelectorModal, #itemPopup, #topBar, #bottomLayer')) return;
          if (!finished) {
            if (timer) clearTimeout(timer);
            showFrame(images.length - 1);
            finish();
          } else {
            cleanupCurrentScene();
            resolveNext(scene.next);
          }
        };
        document.addEventListener('click', onClick);
        state._sceneCleanup = () => { document.removeEventListener('click', onClick); if (timer) clearTimeout(timer); };
        state.phase = 'auto';
        state._stepWait = false;
        step();
      }

      function renderVideoScene(scene) {
        hideAll();
        const v = scene.video || {};
        const src = v.src ? assetUrl(v.src) : '';
        if (!src) { resolveNext(scene.next); return; }
        const holder = document.createElement('div');
        holder.style.cssText = 'position:absolute;inset:0;z-index:3;background:#000;';
        const video = document.createElement('video');
        video.src = src;
        video.loop = !!v.loop;
        video.muted = v.muted !== false;
        video.playsInline = true;
        video.autoplay = true;
        video.style.cssText = 'width:100%;height:100%;object-fit:contain;';
        holder.appendChild(video);
        document.getElementById('app').appendChild(holder);

        let finished = false;
        const finish = () => {
          if (!finished) {
            finished = true;
            state.phase = 'step';
            state._stepWait = true;
            setStatus('🎬 点击继续', true);
          }
        };
        const onClick = (e) => {
          if (e.target.closest('button, input, textarea, select, #formModal, #introModal, #uploadPage, #scriptSelectorModal, #itemPopup, #topBar, #bottomLayer')) return;
          if (!finished) {
            try { video.pause(); } catch (err) {}
            finish();
          } else {
            cleanupCurrentScene();
            resolveNext(scene.next);
          }
        };
        video.addEventListener('ended', () => { if (!video.loop) finish(); });
        document.addEventListener('click', onClick);
        state._sceneCleanup = () => {
          document.removeEventListener('click', onClick);
          try { video.pause(); } catch (e) {}
          video.src = '';
          holder.remove();
        };
        state.phase = 'auto';
        state._stepWait = false;
        video.play().catch(() => { finish(); });
      }

      function renderHtmlScene(scene) {
        hideAll();
        const h = scene.html || {};
        const holder = document.createElement('div');
        holder.style.cssText = 'position:absolute;inset:0;z-index:3;background:#000;';
        const iframe = document.createElement('iframe');
        iframe.style.cssText = 'width:100%;height:100%;border:none;';
        holder.appendChild(iframe);
        if (h.path) iframe.src = assetUrl(h.path);
        else if (h.inline) iframe.srcdoc = h.inline;
        else { resolveNext(scene.next); return; }
        document.getElementById('app').appendChild(holder);
        state.phase = 'step';
        state._stepWait = true;
        setStatus('🖥️ 点击继续', true);
        const onClick = (e) => {
          if (e.target.closest('button, input, textarea, select, iframe, #formModal, #introModal, #uploadPage, #scriptSelectorModal, #itemPopup, #topBar, #bottomLayer')) return;
          cleanupCurrentScene();
          resolveNext(scene.next);
        };
        document.addEventListener('click', onClick);
        state._sceneCleanup = () => { document.removeEventListener('click', onClick); holder.remove(); };
      }

      function renderShowcaseScene(scene) {
        renderBackground(scene);
        initSceneCharacters(scene);
        hideAll();
        state.phase = 'step';
        state._stepWait = true;
        setStatus('🎬 点击继续', true);
        const onClick = (e) => {
          if (e.target.closest('button, input, textarea, select, #formModal, #introModal, #uploadPage, #scriptSelectorModal, #itemPopup, #topBar, #bottomLayer')) return;
          cleanupCurrentScene();
          resolveNext(scene.next);
        };
        document.addEventListener('click', onClick);
        state._sceneCleanup = () => { document.removeEventListener('click', onClick); };
      }

      function renderCgStep(step) {
        const images = step.images || [];
        const interval = step.interval || 1200;
        if (!images.length) { proceedStep(); return; }
        hideAll();
        const myIndex = state._stepIndex;
        let idx = 0, timer = null, finished = false, lastShown = -1;
        const showFrame = (i) => {
          if (i < 0 || i >= images.length || lastShown === i) return;
          lastShown = i;
          const url = assetUrl(images[i]);
          if (!url) return;
          const top = _bgOnFade ? bgFade : bg;
          const bot = _bgOnFade ? bg : bgFade;
          bot.style.transition = 'none';
          bot.style.backgroundImage = `url('${url}')`;
          bot.style.opacity = '0';
          void bot.offsetWidth;
          bot.style.transition = 'opacity 0.4s ease';
          bot.style.opacity = '1';
          top.style.transition = 'opacity 0.4s ease';
          top.style.opacity = '0';
          _bgOnFade = !_bgOnFade;
        };
        const finish = () => {
          if (finished) return;
          finished = true;
          if (timer) clearTimeout(timer);
          if (state._stepIndex === myIndex) {
            state.phase = 'step';
            state._stepWait = true;
            setStatus('🎬 点击继续', true);
          }
        };
        const tick = () => {
          if (finished) return;
          showFrame(idx);
          idx++;
          if (idx >= images.length) finish();
          else timer = setTimeout(tick, interval);
        };
        state._sceneCleanup = () => { if (timer) clearTimeout(timer); };
        state.phase = 'auto';
        state._stepWait = false;
        tick();
      }

      function renderVideoStep(step) {
        const src = step.src ? assetUrl(step.src) : '';
        if (!src) { proceedStep(); return; }
        hideAll();
        const holder = document.createElement('div');
        holder.style.cssText = 'position:absolute;inset:0;z-index:3;background:#000;';
        const video = document.createElement('video');
        video.src = src;
        video.loop = !!step.loop;
        video.muted = step.muted !== false;
        video.playsInline = true;
        video.autoplay = true;
        video.style.cssText = 'width:100%;height:100%;object-fit:contain;';
        holder.appendChild(video);
        document.getElementById('app').appendChild(holder);
        const myIndex = state._stepIndex;
        let finished = false;
        const finish = () => {
          if (finished) return;
          finished = true;
          if (state._stepIndex === myIndex) {
            state.phase = 'step';
            state._stepWait = true;
            setStatus('🎬 点击继续', true);
          }
        };
        video.addEventListener('ended', () => { if (!video.loop) finish(); });
        state._sceneCleanup = () => {
          try { video.pause(); } catch (e) {}
          video.src = '';
          holder.remove();
        };
        state.phase = 'auto';
        state._stepWait = false;
        video.play().catch(finish);
      }

      // ============================================================
      // 结尾
      // ============================================================
      function handleSceneEnding(scene) {
        if (state._endingLock) return;
        state._endingLock = true;
        state.phase = 'ending';
        cleanupCurrentScene();
        AudioManager.stopVoice();
        updateRewindBtn();

        const ending = scene.ending || state.currentScript.ending;
        if (ending && ending.needsResult) {
          state.vars.lastChoices = state.choices;
          state.vars.timeline = state._timeline.slice();
          const p = loadResult({ scene, ending });
          Promise.resolve(p).then(() => { autoAddExportButtons(); });
        } else if (ending && ending.actions) {
          const p = executeActions(ending.actions, { scene, ending });
          Promise.resolve(p).then(() => { autoAddExportButtons(); });
        } else {
          endingInner.innerHTML = '';
          endingPage.style.display = 'block';
          const h = document.createElement('h1');
          h.textContent = '体验结束';
          endingInner.appendChild(h);
          autoAddExportButtons();
        }
      }

      // ============================================================
      // 键盘
      // ============================================================
      document.addEventListener('keydown', function (e) {
        if (endingPage.style.display === 'block') return;
        const isInput = e.target.matches('input, textarea, select');
        if (isInput) return;

        if (e.key === ' ' || e.code === 'Space') {
          if (state.phase === 'step' && state._stepWait) {
            e.preventDefault();
            advance();
          }
          return;
        }
        if ((e.key === 'Backspace' || (e.ctrlKey && e.key === 'z')) && state._allowRewind) {
          e.preventDefault();
          rewindOneStep();
          return;
        }
      });

      descBox.addEventListener('click', advance);
      dialogBox.addEventListener('click', advance);

      window.addEventListener('resize', function () {
        state._charts.forEach(chart => { try { chart.resize(); } catch (e) {} });
      });

      // ============================================================
      // 物品栏
      // ============================================================
      function renderItemIcons() {
        const panel = $('itemPanel');
        if (state._items.length === 0) { panel.style.display = 'none'; return; }
        panel.style.display = 'flex';

        itemLayer.innerHTML = '';
        state._items.forEach((it, idx) => {
          const url = assetUrl(it.image);
          if (!url) return;
          const div = document.createElement('div');
          div.className = 'item-icon';
          div.title = it.name;
          const img = document.createElement('img');
          img.src = url;
          img.alt = it.name || '';
          div.appendChild(img);
          div.addEventListener('click', (e) => { e.stopPropagation(); showItem(idx); });
          itemLayer.appendChild(div);
        });
      }

      function showItem(index) {
        state._currentItemIndex = index;
        const item = state._items[index];
        if (!item) return;

        itemPopupTabs.innerHTML = '';
        state._items.forEach((it, i) => {
          const tab = document.createElement('div');
          tab.className = 'item-popup-tab' + (i === index ? ' active' : '');
          tab.textContent = it.name || ('物品 ' + (i + 1));
          tab.title = it.name || '';
          tab.addEventListener('click', (e) => { e.stopPropagation(); showItem(i); });
          itemPopupTabs.appendChild(tab);
        });

        const url = assetUrl(item.image);
        if (url) itemPopupImg.src = url;
        else itemPopupImg.removeAttribute('src');
        itemPopupImg.alt = item.name || '';
        itemPopupName.textContent = fill(item.name || '');
        itemPopupDesc.textContent = fill(item.description || '');
        itemPopup.style.display = 'flex';
      }

      itemPopup.addEventListener('click', (e) => {
        if (e.target.closest('.item-popup-tab')) return;
        if (e.target.closest('#itemPopupBox')) return;
        itemPopup.style.display = 'none';
      });

      // ============================================================
      // 回到初始
      // ============================================================
      function runInit(ctx) {
        cleanupCurrentScene();
        AudioManager.stopVoice();
        AudioManager.stopBgm(0);
        state._endingLock = false;
        state.choices = [];
        state.currentScript = null;
        state.currentSceneId = null;
        state.currentNode = null;
        state.phase = 'idle';
        state._items = [];
        state._currentItemIndex = 0;
        state._stepStack = [];
        state._allowRewind = false;
        state._timeline = [];
        state._inputConfig = null;
        state._pendingInputNext = null;
        state.vars = {};
        state._formVarNames = [];
        state._charVisible = {};
        state._dialogStageEntered = false;
        state._steps = [];
        state._stepIndex = 0;
        state._stepWait = false;
        state._descCount = 0;
        state._hideUI = false;
        state._parallelPending = null;
        endingPage.style.display = 'none';
        endingInner.innerHTML = '';
        hideAll();

        bg.style.transition = 'none';
        bg.style.backgroundImage = 'none';
        bg.style.opacity = '1';
        bgFade.style.transition = 'none';
        bgFade.style.backgroundImage = 'none';
        bgFade.style.opacity = '0';
        _bgOnFade = false;

        charLayer.innerHTML = '';
        itemLayer.innerHTML = '';
        itemPopup.style.display = 'none';
        itemPopupTabs.innerHTML = '';
        introModal.style.display = 'none';
        formModal.style.display = 'none';
        $('itemPanel').style.display = 'none';
        rewindBtn.style.display = 'none';
        disposeCharts();

        const initFile = Object.keys(state.files).find(k => /^init\.json$/i.test(k));
        if (initFile) {
          return executeActions(state.files[initFile].actions || [], ctx);
        }
        startDefaultFlow();
        return Promise.resolve();
      }

      // ============================================================
      // 音频解锁
      // ============================================================
      document.addEventListener('click', function unlockAudioOnce() {
        if (state._audioUnlocked) return;
        state._audioUnlocked = true;
        try {
          const a = new Audio();
          a.muted = true;
          a.play().catch(() => {});
        } catch (e) {}
      }, { once: true });

      setStatus('🟢 就绪', true);
      console.log('[超级现场] 引擎 v2.3 就绪');
    })();
  </script>
