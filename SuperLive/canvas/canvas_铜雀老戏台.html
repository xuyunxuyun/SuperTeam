  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>超级现场 · 铜雀老戏台</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: 'Segoe UI', 'Inter', 'PingFang SC', 'Microsoft YaHei', system-ui, sans-serif;
      background: #0a0f1c;
      color: #e0e0e0;
      user-select: none;
    }

    :root {
      --bg-deep: #0a0f1c;
      --bg-card: #111827;
      --bg-elevated: #1a1f2e;
      --border-subtle: #2a3452;
      --border-glow: rgba(76, 154, 255, 0.4);
      --primary-blue: #4c9aff;
      --primary-blue-dark: #3b82f6;
      --text-primary: #e0e0e0;
      --text-secondary: #9aa9c1;
      --text-muted: #6b7a8f;
      --accent-danger: #f56565;
      --shadow-glow: 0 0 12px rgba(76, 154, 255, 0.2);
    }

    #app {
      width: 100vw;
      height: 100vh;
      position: relative;
      overflow: hidden;
      background: var(--bg-deep);
    }

    /* 背景双图层：交叉淡入淡出 */
    #bg,
    #bgFade {
      position: absolute;
      inset: 0;
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
    }

    #bg {
      transition: opacity 0.6s ease;
      z-index: 1;
    }

    #bgFade {
      opacity: 0;
      transition: opacity 0.6s ease;
      z-index: 2;
    }

    #charLayer {
      position: absolute;
      inset: 0;
      z-index: 5;
      pointer-events: none;
    }

    /* 立绘：10px 边缘渐变淡出 + 透明度过渡
       5 位置：left / midLeft / center / midRight / right
       z-index 中心最高，向外递减
    */
    .char-sprite {
      position: absolute;
      bottom: 0;
      height: 80vh;
      max-height: 90vh;
      opacity: 0;
      transition: opacity 0.5s ease, transform 0.5s ease;
      -webkit-mask-image: linear-gradient(to bottom, transparent 0, black 10px, black calc(100% - 10px), transparent 100%),
        linear-gradient(to right, transparent 0, black 10px, black calc(100% - 10px), transparent 100%);
      -webkit-mask-composite: source-in;
      mask-image: linear-gradient(to bottom, transparent 0, black 10px, black calc(100% - 10px), transparent 100%),
        linear-gradient(to right, transparent 0, black 10px, black calc(100% - 10px), transparent 100%);
      mask-composite: intersect;
    }

    .char-sprite.show {
      opacity: 1;
    }

    .char-sprite.left {
      left: 0;
      z-index: 6;
    }

    .char-sprite.midLeft {
      left: 20%;
      z-index: 8;
    }

    .char-sprite.center {
      left: 50%;
      transform: translateX(-50%);
      z-index: 10;
    }

    .char-sprite.midRight {
      right: 20%;
      z-index: 8;
    }

    .char-sprite.right {
      right: 0;
      z-index: 6;
    }

    #topBar {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      z-index: 20;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 16px 28px;
      background: linear-gradient(180deg, rgba(10, 15, 28, 0.85) 0%, transparent 100%);
      pointer-events: none;
    }

    #topBar h1 {
      font-size: 18px;
      font-weight: 600;
      background: linear-gradient(135deg, #e0f2fe, #60a5fa);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      letter-spacing: 0.3px;
    }

    #topBarRight {
      display: flex;
      align-items: center;
      gap: 12px;
      pointer-events: auto;
    }

    #statusBadge {
      font-size: 12px;
      color: var(--text-secondary);
      background: rgba(17, 24, 39, 0.8);
      padding: 4px 14px;
      border-radius: 30px;
      border: 1px solid var(--border-subtle);
      backdrop-filter: blur(8px);
    }

    #rewindBtn {
      display: none;
      background: rgba(17, 24, 39, 0.85);
      border: 1px solid var(--border-subtle);
      color: var(--text-secondary);
      padding: 5px 16px;
      border-radius: 30px;
      font-size: 12px;
      cursor: pointer;
      transition: all 0.2s;
      font-family: inherit;
      backdrop-filter: blur(8px);
    }

    #rewindBtn:hover:not(:disabled) {
      border-color: var(--primary-blue);
      color: var(--primary-blue);
      box-shadow: var(--shadow-glow);
    }

    #rewindBtn:disabled {
      opacity: 0.35;
      cursor: not-allowed;
    }

    #bottomLayer {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      z-index: 30;
      padding: 0 28px 24px 28px;
      background: linear-gradient(0deg, rgba(10, 15, 28, 0.92) 0%, transparent 100%);
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    #bottomLayer>* {
      pointer-events: auto;
    }

    #descBox {
      background: rgba(17, 24, 39, 0.9);
      border: 1px solid var(--border-subtle);
      border-radius: 16px;
      padding: 18px 24px 14px;
      backdrop-filter: blur(16px);
      box-shadow: 0 -8px 40px rgba(0, 0, 0, 0.5);
      width: 100%;
      max-width: 900px;
      margin: 0 auto;
      display: none;
      cursor: pointer;
      transition: border-color 0.2s;
    }

    #descBox:hover {
      border-color: var(--border-glow);
    }

    #descText {
      font-size: 17px;
      line-height: 1.7;
      color: var(--text-primary);
      padding: 6px 0 8px;
      min-height: 56px;
      white-space: pre-wrap;
    }

    #descHint {
      text-align: right;
      font-size: 12px;
      color: var(--text-muted);
      border-top: 1px solid rgba(42, 52, 82, 0.6);
      padding-top: 8px;
    }

    #descHint kbd,
    #dialogHint kbd {
      background: rgba(76, 154, 255, 0.12);
      color: var(--primary-blue);
      padding: 2px 8px;
      border-radius: 6px;
      font-family: inherit;
      font-size: 12px;
      border: none;
    }

    #dialogBox {
      background: rgba(17, 24, 39, 0.9);
      border: 1px solid var(--border-subtle);
      border-radius: 16px;
      padding: 18px 24px 14px;
      backdrop-filter: blur(16px);
      box-shadow: 0 -8px 40px rgba(0, 0, 0, 0.5);
      width: 100%;
      max-width: 900px;
      margin: 0 auto;
      display: none;
      cursor: pointer;
      transition: border-color 0.2s;
    }

    #dialogBox:hover {
      border-color: var(--border-glow);
    }

    #dialogMeta {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 4px;
    }

    #dialogName {
      font-weight: 700;
      font-size: 19px;
      background: linear-gradient(135deg, #e0f2fe, #60a5fa);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    #dialogProgress {
      font-size: 12px;
      color: var(--text-muted);
    }

    #dialogText {
      font-size: 17px;
      line-height: 1.7;
      color: var(--text-primary);
      padding: 6px 0 8px;
      min-height: 56px;
      white-space: pre-wrap;
    }

    #dialogHint {
      text-align: right;
      font-size: 12px;
      color: var(--text-muted);
      border-top: 1px solid rgba(42, 52, 82, 0.6);
      padding-top: 8px;
    }

    #inputBox {
      background: rgba(17, 24, 39, 0.9);
      border: 1px solid var(--border-subtle);
      border-radius: 16px;
      padding: 18px 24px 14px;
      backdrop-filter: blur(16px);
      box-shadow: 0 -8px 40px rgba(0, 0, 0, 0.5);
      width: 100%;
      max-width: 900px;
      margin: 0 auto;
      display: none;
      transition: border-color 0.2s;
    }

    #inputBox:hover {
      border-color: var(--border-glow);
    }

    #inputPrompt {
      font-size: 15px;
      line-height: 1.6;
      color: var(--text-secondary);
      padding: 2px 0 10px;
      white-space: pre-wrap;
    }

    #inputField {
      width: 100%;
      padding: 12px 16px;
      font-size: 15px;
      background: var(--bg-elevated);
      border: 1px solid var(--border-subtle);
      border-radius: 12px;
      color: var(--text-primary);
      outline: none;
      font-family: inherit;
      resize: vertical;
      min-height: 80px;
      transition: 0.15s;
    }

    #inputField:focus {
      border-color: var(--primary-blue);
      box-shadow: 0 0 0 3px rgba(76, 154, 255, 0.15);
    }

    #inputFooter {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 12px;
      border-top: 1px solid rgba(42, 52, 82, 0.6);
      padding-top: 10px;
    }

    #inputCounter {
      font-size: 12px;
      color: var(--text-muted);
    }

    #inputSubmit {
      background: linear-gradient(135deg, var(--primary-blue), var(--primary-blue-dark));
      border: none;
      color: #fff;
      font-size: 14px;
      font-weight: 600;
      padding: 10px 28px;
      border-radius: 30px;
      cursor: pointer;
      transition: all 0.2s;
      font-family: inherit;
      box-shadow: 0 4px 16px rgba(59, 130, 246, 0.3);
    }

    #inputSubmit:hover {
      background: linear-gradient(135deg, var(--primary-blue-dark), #2563eb);
      transform: translateY(-1px);
      box-shadow: 0 6px 24px rgba(59, 130, 246, 0.5);
    }

    #choiceBox {
      display: none;
      flex-direction: column;
      gap: 10px;
      width: 100%;
      max-width: 900px;
      margin: 0 auto;
    }

    .choice-btn {
      background: rgba(17, 24, 39, 0.9);
      border: 1px solid var(--border-subtle);
      color: var(--text-primary);
      font-size: 15px;
      line-height: 1.6;
      padding: 14px 20px;
      border-radius: 12px;
      cursor: pointer;
      text-align: left;
      transition: all 0.2s;
      backdrop-filter: blur(8px);
      font-family: inherit;
    }

    .choice-btn:hover {
      background: rgba(76, 154, 255, 0.12);
      border-color: var(--primary-blue);
      transform: translateX(4px);
      box-shadow: var(--shadow-glow);
    }

    .choice-num {
      color: var(--primary-blue);
      font-weight: 700;
      margin-right: 8px;
    }

    #itemPanel {
      position: absolute;
      top: 90px;
      right: 28px;
      z-index: 15;
      display: flex;
      flex-direction: column;
      gap: 10px;
      max-width: 260px;
      pointer-events: auto;
    }

    #itemLayer {
      display: flex;
      flex-direction: column;
      gap: 10px;
      align-items: flex-end;
    }

    .item-icon {
      width: 76px;
      height: 76px;
      border-radius: 12px;
      background: rgba(17, 24, 39, 0.85);
      border: 1px solid var(--border-subtle);
      padding: 6px;
      cursor: pointer;
      transition: all 0.2s;
      backdrop-filter: blur(8px);
    }

    .item-icon:hover {
      transform: scale(1.08);
      border-color: var(--primary-blue);
      box-shadow: var(--shadow-glow);
    }

    .item-icon img {
      width: 100%;
      height: 100%;
      object-fit: contain;
    }

    #itemPopup {
      position: absolute;
      inset: 0;
      z-index: 50;
      background: rgba(10, 15, 28, 0.85);
      backdrop-filter: blur(8px);
      display: none;
      align-items: center;
      justify-content: center;
      cursor: pointer;
    }

    #itemPopupBox {
      background: var(--bg-card);
      border: 1px solid var(--border-glow);
      border-radius: 20px;
      padding: 24px;
      max-width: 640px;
      width: 85%;
      max-height: 85vh;
      overflow-y: auto;
      text-align: center;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.6);
      cursor: default;
    }

    #itemPopupTabs {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      justify-content: center;
      margin-bottom: 20px;
      padding-bottom: 16px;
      border-bottom: 1px solid var(--border-subtle);
      max-height: 120px;
      overflow-y: auto;
    }

    .item-popup-tab {
      background: rgba(17, 24, 39, 0.8);
      border: 1px solid var(--border-subtle);
      color: var(--text-secondary);
      padding: 5px 14px;
      border-radius: 20px;
      font-size: 12px;
      cursor: pointer;
      transition: all 0.2s;
      white-space: nowrap;
      max-width: 140px;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .item-popup-tab:hover {
      border-color: var(--primary-blue);
      color: var(--primary-blue);
    }

    .item-popup-tab.active {
      background: linear-gradient(135deg, var(--primary-blue), var(--primary-blue-dark));
      color: #fff;
      border-color: transparent;
      box-shadow: 0 2px 8px rgba(59, 130, 246, 0.4);
    }

    #itemPopupBox img {
      max-width: 100%;
      max-height: 50vh;
      margin-bottom: 16px;
      border-radius: 12px;
    }

    #itemPopupBox h3 {
      color: var(--primary-blue);
      margin-bottom: 8px;
    }

    #itemPopupBox p {
      color: var(--text-secondary);
      line-height: 1.7;
      white-space: pre-wrap;
    }

    #formModal {
      position: absolute;
      inset: 0;
      z-index: 100;
      background: rgba(10, 15, 28, 0.88);
      backdrop-filter: blur(12px);
      display: none;
      align-items: center;
      justify-content: center;
      overflow-y: auto;
      padding: 20px;
    }

    #formModalBox {
      background: var(--bg-card);
      border: 1px solid var(--border-glow);
      border-radius: 24px;
      padding: 36px 40px;
      text-align: center;
      max-width: 520px;
      width: 100%;
      box-shadow: 0 24px 48px rgba(0, 0, 0, 0.6);
    }

    #formModalBox h2 {
      color: var(--primary-blue);
      margin-bottom: 12px;
      font-size: 22px;
      background: linear-gradient(135deg, #e0f2fe, #60a5fa);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    #formModalBox>p {
      color: var(--text-secondary);
      margin-bottom: 24px;
      line-height: 1.7;
      font-size: 14px;
      white-space: pre-wrap;
    }

    .form-field {
      text-align: left;
      margin-bottom: 16px;
    }

    .form-field label {
      display: block;
      color: var(--text-secondary);
      font-size: 14px;
      margin-bottom: 6px;
    }

    .form-field input[type="text"],
    .form-field input[type="number"],
    .form-field input[type="date"],
    .form-field textarea,
    .form-field select {
      width: 100%;
      padding: 12px 16px;
      font-size: 15px;
      background: var(--bg-elevated);
      border: 1px solid var(--border-subtle);
      border-radius: 12px;
      color: var(--text-primary);
      outline: none;
      font-family: inherit;
      transition: 0.15s;
    }

    .form-field input:focus,
    .form-field textarea:focus,
    .form-field select:focus {
      border-color: var(--primary-blue);
      box-shadow: 0 0 0 3px rgba(76, 154, 255, 0.15);
    }

    .form-field textarea {
      resize: vertical;
      min-height: 80px;
    }

    .form-radio-group,
    .form-checkbox-group {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .form-radio-group label,
    .form-checkbox-group label {
      display: flex;
      align-items: center;
      gap: 8px;
      color: var(--text-primary);
      font-size: 14px;
      cursor: pointer;
      padding: 8px 12px;
      border-radius: 10px;
      transition: 0.15s;
    }

    .form-radio-group label:hover,
    .form-checkbox-group label:hover {
      background: rgba(76, 154, 255, 0.08);
    }

    .form-radio-group input,
    .form-checkbox-group input {
      accent-color: var(--primary-blue);
      cursor: pointer;
    }

    .form-slider-row {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .form-slider-row input[type="range"] {
      flex: 1;
      accent-color: var(--primary-blue);
    }

    .form-slider-value {
      min-width: 40px;
      text-align: center;
      font-family: 'JetBrains Mono', monospace;
      color: var(--primary-blue);
      font-weight: 600;
    }

    .form-error {
      color: var(--accent-danger);
      font-size: 13px;
      margin-bottom: 12px;
      display: none;
    }

    #formConfirmBtn {
      background: linear-gradient(135deg, var(--primary-blue), var(--primary-blue-dark));
      border: none;
      color: #fff;
      font-size: 16px;
      font-weight: 600;
      padding: 14px 40px;
      border-radius: 40px;
      cursor: pointer;
      transition: all 0.2s;
      font-family: inherit;
      margin-top: 8px;
      box-shadow: 0 4px 16px rgba(59, 130, 246, 0.3);
    }

    #formConfirmBtn:hover {
      background: linear-gradient(135deg, var(--primary-blue-dark), #2563eb);
      transform: translateY(-1px);
      box-shadow: 0 6px 24px rgba(59, 130, 246, 0.5);
    }

    #introModal {
      position: absolute;
      inset: 0;
      z-index: 102;
      background: rgba(10, 15, 28, 0.88);
      backdrop-filter: blur(12px);
      display: none;
      align-items: center;
      justify-content: center;
      overflow-y: auto;
      padding: 20px;
    }

    #introModalBox {
      background: var(--bg-card);
      border: 1px solid var(--border-glow);
      border-radius: 24px;
      padding: 36px 40px;
      max-width: 640px;
      width: 100%;
      box-shadow: 0 24px 48px rgba(0, 0, 0, 0.6);
      text-align: left;
    }

    #introModalTag {
      display: inline-block;
      background: rgba(76, 154, 255, 0.12);
      color: var(--primary-blue);
      font-size: 12px;
      padding: 3px 12px;
      border-radius: 20px;
      margin-bottom: 16px;
      letter-spacing: 0.1em;
    }

    #introModalTitle {
      font-size: 22px;
      font-weight: 600;
      margin-bottom: 20px;
      color: var(--primary-blue);
      background: linear-gradient(135deg, #e0f2fe, #60a5fa);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    #introModalContent {
      color: var(--text-secondary);
      font-size: 15px;
      line-height: 1.9;
      margin-bottom: 28px;
      white-space: pre-wrap;
      max-height: 50vh;
      overflow-y: auto;
      padding-right: 8px;
    }

    #introModalBtn {
      display: block;
      background: linear-gradient(135deg, var(--primary-blue), var(--primary-blue-dark));
      border: none;
      color: #fff;
      font-size: 16px;
      font-weight: 600;
      padding: 14px 40px;
      border-radius: 40px;
      cursor: pointer;
      transition: all 0.2s;
      font-family: inherit;
      box-shadow: 0 4px 16px rgba(59, 130, 246, 0.3);
      margin: 0 auto;
    }

    #introModalBtn:hover {
      background: linear-gradient(135deg, var(--primary-blue-dark), #2563eb);
      transform: translateY(-1px);
      box-shadow: 0 6px 24px rgba(59, 130, 246, 0.5);
    }

    #endingPage {
      position: absolute;
      inset: 0;
      z-index: 80;
      background: var(--bg-deep);
      overflow-y: auto;
      display: none;
      padding: 40px 20px;
    }

    #endingInner {
      max-width: 820px;
      margin: 0 auto;
      color: var(--text-primary);
    }

    #endingInner h1 {
      color: var(--primary-blue);
      text-align: center;
      margin-bottom: 32px;
      font-size: 28px;
      background: linear-gradient(135deg, #e0f2fe, #60a5fa);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .e-section {
      margin-bottom: 32px;
    }

    .e-section>h2 {
      color: var(--primary-blue);
      font-size: 20px;
      margin-bottom: 16px;
      border-left: 4px solid var(--primary-blue);
      padding-left: 12px;
    }

    .e-box {
      padding: 16px;
      border-radius: 12px;
      line-height: 1.9;
      font-size: 15px;
    }

    .e-box.red {

<body>

  <div id="app">

    <div id="uploadPage">
      <div id="uploadBox">

    <!-- 双背景层：交叉淡入淡出 -->

    <div id="loading">加载中…</div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
  <script src="https://registry.npmmirror.com/echarts/5.5.0/files/dist/echarts.min.js"></script>
  <script>
    (function () {
      'use strict';

      const state = {
        vars: {},
        files: {},
        assetMap: {},
        currentScript: null,
        currentSceneId: null,
        currentNode: null,
        // steps 状态
        _steps: [],
        _stepIndex: 0,
        _stepWait: false,
        _descCount: 0,
        _hideUI: false,
        // 阶段：idle | step | auto | input | choice | ending
        phase: 'idle',
        choices: [],
        _onFormConfirm: null,
        _formFields: [],
        _formVarNames: [],
        _charts: [],
        _items: [],
        _currentItemIndex: 0,
        _stepStack: [],
        _allowRewind: false,
        _timeline: [],
        _inputConfig: null,
        _pendingInputNext: null,
        _endingLock: false,
        _charVisible: {},
        _lastSpeaker: null,
        _dialogStageEntered: false,
        _parallelPending: null,
        _sceneCleanup: null,
        _audioUnlocked: false
      };

      const $ = id => document.getElementById(id);

      // ============================================================
      // 音频管理器
      // ============================================================
      const AudioManager = {
        _voice: null, _voicePath: '',
        _bgm: null, _bgmPath: '',
        _bgmFadeRaf: null,

        playVoice(path, opts) {
          opts = opts || {};
          if (!path) return Promise.resolve();
          this.stopVoice();
          const url = assetUrl(path);
          if (!url) return Promise.resolve();
          const a = new Audio(url);
          a.volume = opts.volume != null ? opts.volume : 1;
          this._voice = a;
          this._voicePath = path;
          return new Promise(resolve => {
            let settled = false;
            const done = () => {
              if (settled) return;
              settled = true;
              if (this._voice === a) { this._voice = null; this._voicePath = ''; }
              resolve();
            };
            a._resolveVoice = done;
            a.onended = done;
            a.onerror = done;
            a.play().catch(done);
          });
        },

        stopVoice() {
          if (this._voice) {
            const a = this._voice;
            try { a.pause(); a.currentTime = 0; } catch (e) {}
            if (a._resolveVoice) a._resolveVoice();
            this._voice = null;
            this._voicePath = '';
          }
        },

        playBgm(path, opts) {
          opts = opts || {};
          const vol = opts.volume != null ? opts.volume : 0.6;
          if (!path) { this.stopBgm(600); return; }
          const url = assetUrl(path);
          if (!url) return;
          if (this._bgmPath === path && this._bgm && !this._bgm.paused) {
            this._bgm.volume = vol;
            return;
          }
          this._fadeOutBgm(400, () => {
            const a = new Audio(url);
            a.loop = true;
            a.volume = 0;
            this._bgm = a;
            this._bgmPath = path;
            a.play().catch(() => {});
            this._fadeInBgm(vol, 600);
          });
        },

        setBgmVolume(v) {
          if (this._bgm) { try { this._bgm.volume = v; } catch (e) {} }
        },

        stopBgm(fade) {
          if (!this._bgm) { this._bgmPath = ''; return; }
          const doStop = () => {
            if (this._bgm) {
              try { this._bgm.pause(); this._bgm.currentTime = 0; } catch (e) {}
              this._bgm = null;
              this._bgmPath = '';
            }
          };
          if (fade > 0) this._fadeOutBgm(fade, doStop);
          else doStop();
        },

        _fadeOutBgm(ms, cb) {
          if (!this._bgm) { cb && cb(); return; }
          const a = this._bgm;
          const start = a.volume;
          const t0 = performance.now();
          if (this._bgmFadeRaf) cancelAnimationFrame(this._bgmFadeRaf);
          const tick = () => {
            const p = Math.min(1, (performance.now() - t0) / ms);
            try { a.volume = start * (1 - p); } catch (e) {}
            if (p < 1) this._bgmFadeRaf = requestAnimationFrame(tick);
            else { this._bgmFadeRaf = null; cb && cb(); }
          };
          this._bgmFadeRaf = requestAnimationFrame(tick);
        },

        _fadeInBgm(target, ms) {
          const a = this._bgm;
          if (!a) return;
          const t0 = performance.now();
          const tick = () => {
            const p = Math.min(1, (performance.now() - t0) / ms);
            try { a.volume = target * p; } catch (e) {}
            if (p < 1) requestAnimationFrame(tick);
          };
          requestAnimationFrame(tick);
        }
      };

      const uploadPage = $('uploadPage');
      const fileInput = $('fileInput');
      const formModal = $('formModal');
      const formModalTitle = $('formModalTitle');
      const formModalDesc = $('formModalDesc');
      const formModalFields = $('formModalFields');
      const formError = $('formError');
      const formConfirmBtn = $('formConfirmBtn');
      const introModal = $('introModal');
      const introModalTag = $('introModalTag');
      const introModalTitle = $('introModalTitle');
      const introModalContent = $('introModalContent');
      const introModalBtn = $('introModalBtn');
      const bg = $('bg');
      const bgFade = $('bgFade');
      const charLayer = $('charLayer');
      const itemLayer = $('itemLayer');
      const gameTitle = $('gameTitle');
      const statusBadge = $('statusBadge');
      const descBox = $('descBox');
      const descText = $('descText');
      const dialogBox = $('dialogBox');
      const dialogName = $('dialogName');
      const dialogProgress = $('dialogProgress');
      const dialogText = $('dialogText');
      const inputBox = $('inputBox');
      const inputPrompt = $('inputPrompt');
      const inputField = $('inputField');
      const inputCounter = $('inputCounter');
      const inputSubmit = $('inputSubmit');
      const choiceBox = $('choiceBox');
      const itemPopup = $('itemPopup');
      const itemPopupTabs = $('itemPopupTabs');
      const itemPopupImg = $('itemPopupImg');
      const itemPopupName = $('itemPopupName');
      const itemPopupDesc = $('itemPopupDesc');
      const endingPage = $('endingPage');
      const endingInner = $('endingInner');
      const loading = $('loading');
      const rewindBtn = $('rewindBtn');

      let _bgOnFade = false;

      // ============================================================
      // 基础工具
      // ============================================================
      function setStatus(t, ok) {
        statusBadge.textContent = t;
        statusBadge.style.color = ok ? '#8aa4c8' : '#fc5c7d';
      }
      function showLoading(t) { loading.textContent = t || '加载中…'; loading.style.display = 'flex'; }
      function hideLoading() { loading.style.display = 'none'; }
      function hideAll() {
        descBox.style.display = 'none';
        dialogBox.style.display = 'none';
        inputBox.style.display = 'none';
        choiceBox.style.display = 'none';
      }
      function hideUI() { hideAll(); state._hideUI = true; }
      function deepClone(obj) {
        if (obj === null || typeof obj !== 'object') return obj;
        try { return JSON.parse(JSON.stringify(obj)); } catch (e) { return obj; }
      }
      function disposeCharts() {
        (state._charts || []).forEach(c => { try { c.dispose(); } catch (e) {} });
        state._charts = [];
      }
      function cleanupCurrentScene() {
        if (state._sceneCleanup) {
          try { state._sceneCleanup(); } catch (e) {}
          state._sceneCleanup = null;
        }
      }

      // ============================================================
      // 资源路径
      // ============================================================
      function assetUrl(name) {
        if (!name || typeof name !== 'string') return '';
        if (state.assetMap[name]) return state.assetMap[name];
        if (name.indexOf('assets/') !== 0) {
          const k = 'assets/' + name;
          if (state.assetMap[k]) return state.assetMap[k];
        }
        if (name.indexOf('assets/') === 0) {
          const k = name.substring('assets/'.length);
          if (state.assetMap[k]) return state.assetMap[k];
        }
        // 短名解析：meta.audios
        if (state.currentScript && state.currentScript.meta && state.currentScript.meta.audios) {
          const p = state.currentScript.meta.audios[name];
          if (p) return assetUrl(p);
        }
        // 短名解析：sprites
        const trySprites = (scene) => {
          if (!scene || !Array.isArray(scene.characters)) return '';
          for (const c of scene.characters) {
            if (c.sprites && c.sprites[name]) return assetUrl(c.sprites[name]);
          }
          return '';
        };
        let r = trySprites(state.currentNode);
        if (r) return r;
        if (state.currentScript && state.currentScript.scenes) {
          for (const sid in state.currentScript.scenes) {
            r = trySprites(state.currentScript.scenes[sid]);
            if (r) return r;
          }
        }
        return '';
      }

      // ============================================================
      // 模板填充
      // ============================================================
      function fill(str) {
        if (typeof str !== 'string') return str;
        const d = new Date();
        const base = {
          year: d.getFullYear(),
          month: d.getMonth() + 1,
          day: d.getDate(),
          date: `${d.getFullYear()}年${d.getMonth() + 1}月${d.getDate()}日`
        };
        const allVars = Object.assign({}, base, state.vars);
        return str.replace(/\{\{([^}]+)\}\}/g, (m, key) => {
          const k = key.trim();
          if (allVars[k] !== undefined) return allVars[k];
          const parts = k.split('.');
          let cur = allVars;
          for (const p of parts) {
            if (cur == null) return m;
            cur = cur[p];
          }
          if (cur !== undefined) return cur;
          return m;
        });
      }

      function showIntro(intro, tagText, onConfirm) {
        introModalTag.textContent = tagText || '介绍';
        introModalTitle.textContent = intro.title || '';
        introModalContent.textContent = intro.content || '';
        introModal.style.display = 'flex';
        introModalBtn.onclick = function () {
          introModal.style.display = 'none';
          if (typeof onConfirm === 'function') onConfirm();
        };
      }

      // ============================================================
      // 动作执行器
      // ============================================================
      function executeActions(actions, ctx) {
        ctx = ctx || {};
        if (!Array.isArray(actions)) return Promise.resolve();
        let p = Promise.resolve();
        actions.forEach(a => { p = p.then(() => executeAction(a, ctx)); });
        return p;
      }

      function executeAction(action, ctx) {
        if (!action || !action.type) return Promise.resolve();
        const t = action.type;

        switch (t) {
          case 'setTitle':
            gameTitle.textContent = fill(action.text || '');
            return Promise.resolve();

          case 'setVariable': {
            const v = resolveValue(action.value, ctx);
            state.vars[action.name] = typeof v === 'string' ? fill(v) : v;
            return Promise.resolve();
          }

          case 'showUploadPage':
            uploadPage.style.display = 'flex';
            return Promise.resolve();

          case 'hideUploadPage':
            uploadPage.style.display = 'none';
            return Promise.resolve();

          case 'formModal': {
            uploadPage.style.display = 'none';
            formModal.style.display = 'flex';
            formModalTitle.textContent = fill(action.title || '');
            formModalDesc.textContent = fill(action.description || '');
            formError.style.display = 'none';
            formConfirmBtn.textContent = fill(action.buttonText || '确认');
            state._onFormConfirm = action.onConfirm || [];
            state._formFields = action.fields || [];
            state._formVarNames = state._formFields.map(f => f.name);
            formModalFields.innerHTML = '';
            state._formFields.forEach(f => {
              const wrap = document.createElement('div');
              wrap.className = 'form-field';
              if (f.label) {
                const label = document.createElement('label');
                label.textContent = fill(f.label);
                wrap.appendChild(label);
              }
              const ftype = f.type || 'text';
              let input;

              if (ftype === 'textarea') {
                input = document.createElement('textarea');
                input.name = f.name;
                input.value = f.default || '';
                if (f.placeholder) input.placeholder = fill(f.placeholder);
                if (f.maxLength) input.maxLength = f.maxLength;
                wrap.appendChild(input);
              } else if (ftype === 'select') {
                input = document.createElement('select');
                input.name = f.name;
                (f.options || []).forEach(opt => {
                  const o = document.createElement('option');
                  o.value = typeof opt === 'string' ? opt : (opt.value || '');
                  o.textContent = typeof opt === 'string' ? opt : (opt.label || opt.value || '');
                  if (o.value === (f.default || '')) o.selected = true;
                  input.appendChild(o);
                });
                wrap.appendChild(input);
              } else if (ftype === 'radio') {
                const group = document.createElement('div');
                group.className = 'form-radio-group';
                (f.options || []).forEach(opt => {
                  const val = typeof opt === 'string' ? opt : (opt.value || '');
                  const label = typeof opt === 'string' ? opt : (opt.label || opt.value || '');
                  const row = document.createElement('label');
                  const rb = document.createElement('input');
                  rb.type = 'radio';
                  rb.name = f.name;
                  rb.value = val;
                  if (val === (f.default || '')) rb.checked = true;
                  row.appendChild(rb);
                  row.appendChild(document.createTextNode(label));
                  group.appendChild(row);
                });
                wrap.appendChild(group);
              } else if (ftype === 'checkbox') {
                const group = document.createElement('div');
                group.className = 'form-checkbox-group';
                const defaults = Array.isArray(f.default) ? f.default : [];
                (f.options || []).forEach(opt => {
                  const val = typeof opt === 'string' ? opt : (opt.value || '');
                  const label = typeof opt === 'string' ? opt : (opt.label || opt.value || '');
                  const row = document.createElement('label');
                  const cb = document.createElement('input');
                  cb.type = 'checkbox';
                  cb.name = f.name;
                  cb.value = val;
                  if (defaults.includes(val)) cb.checked = true;
                  row.appendChild(cb);
                  row.appendChild(document.createTextNode(label));
                  group.appendChild(row);
                });
                wrap.appendChild(group);
              } else if (ftype === 'slider') {
                const row = document.createElement('div');
                row.className = 'form-slider-row';
                input = document.createElement('input');
                input.type = 'range';
                input.name = f.name;
                input.min = f.min != null ? f.min : 0;
                input.max = f.max != null ? f.max : 10;
                input.step = f.step != null ? f.step : 1;
                input.value = f.default != null ? f.default : input.min;
                const valueEl = document.createElement('span');
                valueEl.className = 'form-slider-value';
                valueEl.textContent = input.value;
                input.addEventListener('input', () => { valueEl.textContent = input.value; });
                row.appendChild(input);
                row.appendChild(valueEl);
                wrap.appendChild(row);
              } else {
                input = document.createElement('input');
                input.type = ftype;
                input.name = f.name;
                if (ftype === 'date') {
                  input.value = f.default || new Date().toISOString().slice(0, 10);
                } else {
                  input.value = f.default || '';
                }
                if (f.placeholder) input.placeholder = fill(f.placeholder);
                if (f.maxLength) input.maxLength = f.maxLength;
                if (f.min != null) input.min = f.min;
                if (f.max != null) input.max = f.max;
                wrap.appendChild(input);
              }

              formModalFields.appendChild(wrap);
            });
            const first = formModalFields.querySelector('input, textarea, select');
            if (first) first.focus();
            return Promise.resolve();
          }

          case 'showEndingPage':
            disposeCharts();
            endingInner.innerHTML = '';
            endingPage.style.display = 'block';
            return Promise.resolve();

          case 'renderTree': {
            const tree = resolveValue(action.tree, ctx);
            const container = action.target ? $(action.target) : endingInner;
            if (container) {
              if (!action.append) container.innerHTML = '';
              container.appendChild(renderTree(tree, ctx));
            }
            return Promise.resolve();
          }

          case 'renderText': {
            const text = fill(String(resolveValue(action.text, ctx) || ''));
            const container = action.target ? $(action.target) : endingInner;
            if (container) {
              if (!action.append) container.innerHTML = '';
              const p = document.createElement('p');
              p.textContent = text;
              container.appendChild(p);
            }
            return Promise.resolve();
          }

          case 'computeScore': {
            const result = computeScore(action, ctx);
            if (action.target) state.vars[action.target] = result;
            return Promise.resolve();
          }

          case 'judgeCase': {
            const result = judgeCase(action.rules || [], state.choices);
            if (action.target) state.vars[action.target] = result;
            return Promise.resolve();
          }

          case 'condition': {
            const val = evaluateCondition(action.if, ctx);
            const branch = val ? action.then : action.else;
            return executeActions(branch || [], ctx);
          }

          case 'loop': {
            const items = resolveValue(action.source, ctx) || [];
            let p = Promise.resolve();
            items.forEach((item, index) => {
              p = p.then(() => {
                const childCtx = Object.assign({}, ctx, { item, index, loop: item });
                return executeActions(action.template || [], childCtx);
              });
            });
            return p;
          }

          case 'showButtons': {
            const container = action.target ? $(action.target) : endingInner;
            if (container) {
              const scripts = getSortedScripts();
              const curKey = state.currentScript && state.currentScript._key;
              const curIdx = curKey ? scripts.indexOf(curKey) : -1;
              const bar = document.createElement('div');
              bar.className = 'e-actions';
              (action.buttons || []).forEach(b => {
                const loadActions = (b.actions || []).filter(a =>
                  a.type === 'loadScriptByIndex' || a.type === 'loadNextScript');
                const allOverBound = loadActions.length > 0 && loadActions.every(a => {
                  if (a.type === 'loadNextScript') return curIdx + 1 >= scripts.length;
                  const idx = a.index != null ? Number(a.index) : 0;
                  return idx >= scripts.length;
                });
                if (allOverBound) return;

                const btn = document.createElement('button');
                btn.className = 'e-btn';
                btn.textContent = fill(b.text || '');
                btn.addEventListener('click', () => { executeActions(b.actions || [], ctx); });
                bar.appendChild(btn);
              });
              container.appendChild(bar);
            }
            return Promise.resolve();
          }

          case 'exportButtons': {
            const container = action.target ? $(action.target) : endingInner;
            if (container) {
              const bar = document.createElement('div');
              bar.className = 'e-actions';
              (action.buttons || []).forEach(b => {
                const btn = document.createElement('button');
                btn.className = 'e-btn export';
                btn.textContent = fill(b.text || '导出');
                btn.addEventListener('click', () => { handleExport(b); });
                bar.appendChild(btn);
              });
              container.appendChild(bar);
            }
            return Promise.resolve();
          }

          case 'loadScript':
            return loadScript(resolveValue(action.scriptId, ctx) || action.scriptId, ctx);

          case 'loadResult':
            return loadResult(ctx);

          case 'goToScene': {
            const sceneId = resolveValue(action.sceneId, ctx) || action.sceneId;
            goToScene(sceneId);
            return Promise.resolve();
          }

          case 'showScriptSelector':
            showScriptSelector();
            return Promise.resolve();

          case 'goToInit':
            return runInit(ctx);

          case 'next':
            return Promise.resolve();

          case 'delay':
            return new Promise(r => setTimeout(r, action.ms || 1000));

          case 'loadScriptByIndex': {
            const scripts = getSortedScripts();
            if (scripts.length === 0) {
              console.error('无可用剧本');
              return Promise.resolve();
            }
            const idx = action.index != null ? Number(resolveValue(action.index, ctx)) : null;
            if (idx != null && (idx < 0 || idx >= scripts.length)) {
              setStatus('⚠️ 剧本编号越界', false);
              return Promise.resolve();
            }
            if (state._endingLock && idx != null) {
              return loadScript(scripts[idx], ctx);
            }
            if (scripts.length === 1) {
              return loadScript(scripts[0], ctx);
            }
            showScriptSelector();
            return Promise.resolve();
          }

          case 'loadNextScript': {
            const scripts = getSortedScripts();
            const curKey = state.currentScript && state.currentScript._key;
            const curIdx = curKey ? scripts.indexOf(curKey) : -1;
            const nextIdx = curIdx + 1;
            if (nextIdx < 0 || nextIdx >= scripts.length) {
              setStatus('⚠️ 已经是最后一则剧情了', false);
              return Promise.resolve();
            }
            return loadScript(scripts[nextIdx], ctx);
          }

          default:
            console.warn('未知动作:', t, action);
            return Promise.resolve();
        }
      }

      function resolveValue(v, ctx) {
        if (typeof v === 'string' && v.indexOf('{{') === 0 && v.indexOf('}}') === v.length - 2) {
          const key = v.slice(2, -2).trim();
          const parts = key.split('.');
          let cur;
          if (parts[0] === 'item' || parts[0] === 'loop') {
            cur = ctx[parts[0]];
            parts.shift();
          } else if (parts[0] === 'vars') {
            parts.shift();
            cur = state.vars;
          } else {
            cur = state.vars;
          }
          for (const p of parts) {
            if (cur == null) return undefined;
            cur = cur[p];
          }
          return cur;
        }
        if (Array.isArray(v)) return v;
        return v;
      }

      // ============================================================
      // 条件求值器
      // ============================================================
      function evaluateCondition(expr, ctx) {
        if (typeof expr !== 'string') return !!expr;
        let s = expr.trim();
        if (!s) return false;
        if (s.startsWith('!') && s[1] !== '=') return !evaluateCondition(s.slice(1).trim(), ctx);
        const orParts = splitTopLevel(s, '||');
        if (orParts.length > 1) return orParts.some(p => evaluateCondition(p, ctx));
        const andParts = splitTopLevel(s, '&&');
        if (andParts.length > 1) return andParts.every(p => evaluateCondition(p, ctx));

        let m = s.match(/^isNull\s*\(\s*(.+?)\s*\)$/);
        if (m) return resolveExprValue(m[1], ctx) == null;
        m = s.match(/^isNotNull\s*\(\s*(.+?)\s*\)$/);
        if (m) return resolveExprValue(m[1], ctx) != null;
        m = s.match(/^count\s*\(\s*(.+?)\s*,\s*(.+)\s*\)$/);
        if (m) {
          const arr = resolveExprValue(m[1], ctx) || [];
          const sub = m[2];
          return arr.filter(item => evaluateCondition(sub, Object.assign({}, ctx, { item }))).length;
        }
        m = s.match(/^length\s*\(\s*(.+?)\s*\)$/);
        if (m) {
          const arr = resolveExprValue(m[1], ctx);
          if (Array.isArray(arr) || typeof arr === 'string') return arr.length;
          return 0;
        }

        const ops = ['contains', 'notContains', 'startsWith', 'endsWith', ' notIn ', ' in ', '==', '!=', '>=', '<=', '>', '<'];
        for (const op of ops) {
          const idx = findTopLevelOp(s, op);
          if (idx < 0) continue;
          const left = s.slice(0, idx).trim();
          const right = s.slice(idx + op.length).trim();
          const lv = resolveExprValue(left, ctx);
          const rv = resolveExprValue(right, ctx);
          const o = op.trim();
          switch (o) {
            case 'contains': return Array.isArray(lv) ? lv.includes(rv) : String(lv).indexOf(String(rv)) >= 0;
            case 'notContains': return Array.isArray(lv) ? !lv.includes(rv) : String(lv).indexOf(String(rv)) < 0;
            case 'startsWith': return String(lv).startsWith(String(rv));
            case 'endsWith': return String(lv).endsWith(String(rv));
            case '==': return lv == rv;
            case '!=': return lv != rv;
            case '>=': return Number(lv) >= Number(rv);
            case '<=': return Number(lv) <= Number(rv);
            case '>': return Number(lv) > Number(rv);
            case '<': return Number(lv) < Number(rv);
            case 'in': return Array.isArray(rv) ? rv.includes(lv) : String(rv).indexOf(String(lv)) >= 0;
            case 'notIn': return Array.isArray(rv) ? !rv.includes(lv) : String(rv).indexOf(String(lv)) < 0;
          }
        }
        return !!resolveExprValue(s, ctx);
      }

      function findTopLevelOp(str, op) {
        let depth = 0;
        for (let i = 0; i <= str.length - op.length; i++) {
          if (str[i] === '{' && str[i + 1] === '{') { depth++; i++; continue; }
          if (str[i] === '}' && str[i + 1] === '}') { depth--; i++; continue; }
          if (depth === 0 && str.slice(i, i + op.length) === op) return i;
        }
        return -1;
      }

      function resolveExprValue(raw, ctx) {
        if (typeof raw !== 'string') return raw;
        raw = raw.trim();
        if ((raw.startsWith("'") && raw.endsWith("'")) || (raw.startsWith('"') && raw.endsWith('"'))) {
          return raw.slice(1, -1);
        }
        if (/^-?\d+(\.\d+)?$/.test(raw)) return Number(raw);
        if (raw === 'true') return true;
        if (raw === 'false') return false;
        if (raw === 'null') return null;
        if (raw === 'undefined') return undefined;
        return resolveValue(raw, ctx);
      }

      function splitTopLevel(str, sep) {
        const parts = [];
        let depth = 0;
        let start = 0;
        for (let i = 0; i < str.length; i++) {
          const ch = str[i];
          if (ch === '{' && str[i + 1] === '{') { depth++; i++; continue; }
          if (ch === '}' && str[i + 1] === '}') { depth--; i++; continue; }
          if (depth === 0 && str.slice(i, i + sep.length) === sep) {
            parts.push(str.slice(start, i));
            start = i + sep.length;
            i += sep.length - 1;
          }
        }
        parts.push(str.slice(start));
        return parts.map(p => p.trim()).filter(Boolean);
      }

      // ============================================================
      // 渲染树
      // ============================================================
      function renderTree(nodes, ctx) {
        const frag = document.createDocumentFragment();
        (nodes || []).forEach(n => {
          const el = renderNode(n, ctx);
          if (el) frag.appendChild(el);
        });
        return frag;
      }

      function renderNode(n, ctx) {
        if (!n || !n.type) return null;
        switch (n.type) {
          case 'section': {
            const sec = document.createElement('div');
            sec.className = 'e-section';
            if (n.title) {
              const h = document.createElement('h2');
              h.textContent = fill(String(resolveValue(n.title, ctx) || ''));
              sec.appendChild(h);
            }
            sec.appendChild(renderTree(n.children, ctx));
            return sec;
          }
          case 'box': {
            const box = document.createElement('div');
            box.className = 'e-box' + (n.style ? ' ' + n.style : '');
            box.appendChild(renderTree(n.children, ctx));
            return box;
          }
          case 'p': {
            const p = document.createElement('p');
            p.appendChild(renderInline(n.children, ctx));
            return p;
          }
          case 'strong': {
            const s = document.createElement('strong');
            s.textContent = fill(String(resolveValue(n.text, ctx) || ''));
            return s;
          }
          case 'text':
            return document.createTextNode(fill(String(resolveValue(n.text, ctx) || '')));
          case 'ul': {
            const ul = document.createElement('ul');
            ul.style.cssText = 'margin-left:20px;line-height:1.9;';
            (n.items || []).forEach(item => {
              const li = document.createElement('li');
              if (typeof item === 'string') {
                li.textContent = fill(String(resolveValue(item, ctx) || ''));
              } else {
                li.appendChild(renderInline([
                  { type: 'strong', text: item.name || '' },
                  { type: 'text', text: '：' + (item.desc || '') }
                ], ctx));
              }
              ul.appendChild(li);
            });
            return ul;
          }
          case 'ol': {
            const ol = document.createElement('ol');
            ol.style.cssText = 'margin-left:20px;line-height:1.9;';
            (n.items || []).forEach(item => {
              const li = document.createElement('li');
              li.textContent = fill(String(resolveValue(item, ctx) || ''));
              ol.appendChild(li);
            });
            return ol;
          }
          case 'stars': {
            const div = document.createElement('div');
            div.style.cssText = 'color:#f0c27f;font-size:18px;letter-spacing:2px;';
            const score = Number(resolveValue(n.score, ctx)) || 0;
            const max = n.max || 5;
            div.textContent = '★'.repeat(score) + '☆'.repeat(max - score) + `（${score}/${max}）`;
            return div;
          }
          case 'bar': {
            const wrap = document.createElement('div');
            wrap.style.cssText = 'background:rgba(76,154,255,0.2);border-radius:4px;height:10px;overflow:hidden;margin:4px 0;';
            const inner = document.createElement('div');
            const val = Number(resolveValue(n.value, ctx)) || 0;
            const max = n.max || 5;
            inner.style.cssText = `width:${Math.min(100, val / max * 100)}%;height:100%;background:#4c9aff;`;
            wrap.appendChild(inner);
            return wrap;
          }
          case 'table': {
            const table = document.createElement('table');
            table.style.cssText = 'width:100%;border-collapse:collapse;font-size:14px;';
            let rows = n.rows;
            if (typeof rows === 'string') {
              const key = rows.replace(/^\{\{|\}\}$/g, '').trim();
              if (key === 'choices' || key === 'choicesRows') {
                rows = (state.choices || []).map(c => [c.scene, c.sceneName, c.text, c.pathType || '']);
              } else if (key === 'timeline') {
                rows = (state._timeline || []).map(t => {
                  if (t.type === 'choice') return [t.scene, t.sceneName, t.text, t.pathType || ''];
                  return [t.scene, t.sceneName, t.value, '输入'];
                });
              } else {
                rows = state.vars[key] || [];
              }
            }
            if (!Array.isArray(rows)) rows = [];
            const thead = document.createElement('thead');
            const trh = document.createElement('tr');
            trh.style.background = 'rgba(76,154,255,0.12)';
            (n.headers || []).forEach(h => {
              const th = document.createElement('th');
              th.style.cssText = 'padding:10px;border:1px solid rgba(76,154,255,0.3);text-align:left;color:#4c9aff;';
              th.textContent = fill(String(resolveValue(h, ctx) || ''));
              trh.appendChild(th);
            });
            thead.appendChild(trh);
            table.appendChild(thead);
            const tbody = document.createElement('tbody');
            rows.forEach(row => {
              const tr = document.createElement('tr');
              const cells = Array.isArray(row) ? row : Object.values(row);
              cells.forEach((cell, i) => {
                const td = document.createElement('td');
                const colorRule = (n.colorRules || []).find(r => r.col === i);
                let colorStyle = '';
                if (colorRule && colorRule.map && colorRule.map[cell]) {
                  colorStyle = `color:${colorRule.map[cell]};`;
                }
                td.style.cssText = `padding:10px;border:1px solid rgba(76,154,255,0.2);${colorStyle}`;
                td.textContent = fill(String(resolveValue(cell, ctx) || ''));
                tr.appendChild(td);
              });
              tbody.appendChild(tr);
            });
            table.appendChild(tbody);
            return table;
          }
          case 'portrait': {
            const wrap = document.createDocumentFragment();
            const dims = n.dimensions || [];
            const scores = state.vars[n.source || 'portraitScores'] || [];
            dims.forEach((dim, i) => {
              const score = scores[i] || 3;
              const d = document.createElement('div');
              d.style.marginBottom = '14px';
              const name = document.createElement('div');
              name.style.cssText = 'color:#4c9aff;font-weight:600;margin-bottom:4px;';
              name.textContent = typeof dim === 'string' ? dim : (dim.name || '');
              const stars = document.createElement('div');
              stars.style.cssText = 'color:#4c9aff;font-size:18px;letter-spacing:2px;';
              stars.textContent = '★'.repeat(score) + '☆'.repeat(5 - score) + `（${score}/5）`;
              const desc = document.createElement('div');
              desc.style.cssText = 'color:#9aa9c1;font-size:13px;margin-top:4px;';
              desc.textContent = (typeof dim === 'object' && dim.description) || '';
              d.appendChild(name); d.appendChild(stars); d.appendChild(desc);
              wrap.appendChild(d);
            });
            return wrap;
          }
          case 'radar': {
            const wrap = document.createElement('div');
            const id = 'radar-' + Date.now() + '-' + Math.floor(Math.random() * 10000);
            wrap.id = id;
            wrap.style.cssText = 'width:100%;height:420px;margin:16px 0;';
            setTimeout(() => {
              const dom = document.getElementById(id);
              if (!dom || typeof echarts === 'undefined') return;
              const chart = echarts.init(dom);
              const dims = n.dimensions || [];
              const scores = state.vars[n.source || 'portraitScores'] || [];
              const max = n.max || 5;
              const seriesName = n.seriesName || '你的选择';
              chart.setOption({
                backgroundColor: 'transparent',
                radar: {
                  indicator: dims.map(d => ({
                    name: (typeof d === 'string' ? d : (d.name || '')),
                    max: max
                  })),
                  shape: 'polygon',
                  splitNumber: max,
                  axisName: { color: '#9aa9c1', fontSize: 13 },
                  splitArea: { areaStyle: { color: ['rgba(76,154,255,0.03)', 'rgba(76,154,255,0.08)'] } },
                  splitLine: { lineStyle: { color: 'rgba(76,154,255,0.2)' } },
                  axisLine: { lineStyle: { color: 'rgba(76,154,255,0.25)' } }
                },
                tooltip: { trigger: 'item' },
                series: [{
                  type: 'radar',
                  data: [{
                    value: scores,
                    name: seriesName,
                    symbol: 'circle',
                    symbolSize: 6,
                    lineStyle: { color: '#4c9aff', width: 2 },
                    areaStyle: { color: 'rgba(76,154,255,0.25)' },
                    itemStyle: { color: '#4c9aff' },
                    label: {
                      show: true,
                      color: '#e0f2fe',
                      fontSize: 12,
                      formatter: function (params) { return params.value; }
                    }
                  }]
                }]
              });
              state._charts.push(chart);
            }, 0);
            return wrap;
          }
          case 'br':
            return document.createElement('br');
          case 'image': {
            const img = document.createElement('img');
            const src = assetUrl(resolveValue(n.src, ctx));
            if (src) img.src = src;
            if (n.style) img.style.cssText = n.style;
            return img;
          }
          default:
            return null;
        }
      }

      function renderInline(children, ctx) {
        const frag = document.createDocumentFragment();
        (children || []).forEach(c => {
          if (typeof c === 'string') {
            frag.appendChild(document.createTextNode(fill(c)));
            return;
          }
          const el = renderNode(c, ctx);
          if (el) frag.appendChild(el);
        });
        return frag;
      }

      // ============================================================
      // 计分与判定
      // ============================================================
      function computeScore(action, ctx) {
        const rules = action.rules || [];
        const source = resolveValue(action.source, ctx) || state.choices;
        let dimensions = action.dimensions;
        if (!dimensions || (Array.isArray(dimensions) && dimensions.length === 0)) {
          dimensions = state.vars.portraitDimensions || [];
        }
        if (typeof dimensions === 'string') {
          dimensions = resolveValue(dimensions, ctx) || [];
        }
        const dimNames = dimensions.map(d => (typeof d === 'string' ? d : (d.name || '')));
        const scores = dimNames.map(() => 0);
        const counts = dimNames.map(() => 0);
        rules.forEach(r => {
          if (r.expr) {
            if (evaluateCondition(r.expr, ctx)) {
              if (r.scores && typeof r.scores === 'object') {
                Object.keys(r.scores).forEach(dim => {
                  const di = dimNames.indexOf(dim);
                  if (di >= 0) { scores[di] += r.scores[dim]; counts[di] += 1; }
                });
              }
            }
          } else {
            (source || []).forEach(c => {
              if (r.pathType === c.pathType) {
                const di = dimNames.indexOf(r.dimension);
                if (di >= 0) { scores[di] += r.score; counts[di] += 1; }
              }
            });
          }
        });
        if (action.mode === 'dimensionScores') {
          return scores.map((s, i) => counts[i] === 0 ? (action.defaultScore || 3) : Math.round(s / counts[i]));
        }
        return { scores, counts };
      }

      function judgeCase(rules, choices) {
        for (const rule of rules) {
          const trig = rule.trigger;
          if (!trig || !Array.isArray(trig.conditions)) continue;
          const arr = choices || [];
          const results = trig.conditions.map(cond => {
            if (cond.expr) return evaluateCondition(cond.expr, {});
            const quantifier = cond.quantifier || 'any';
            const test = c => {
              const val = c[cond.field];
              if (cond.operator === 'equals') return val === cond.value;
              if (cond.operator === 'notEquals') return val !== cond.value;
              if (cond.operator === 'includes') return Array.isArray(val) && val.includes(cond.value);
              return false;
            };
            if (arr.length === 0) return false;
            return quantifier === 'all' ? arr.every(test) : arr.some(test);
          });
          const matched = trig.logic === 'all' ? results.every(Boolean) : results.some(Boolean);
          if (matched) return rule;
        }
        return null;
      }

      function buildExportData() {
        const data = {};
        Object.keys(state.vars).forEach(k => {
          if (k.startsWith('_')) return;
          if (k === 'caseRule' || k === 'portraitScores' || k === 'lastChoices' || k === 'timeline') return;
          data[k] = state.vars[k];

        data.timeline = state._timeline.slice();

      function buildTxtExport(data) {
        const lines = [];
        lines.push('===== 用户信息 =====');
        Object.keys(data).forEach(k => {
          if (k === 'timeline') return;
          lines.push(`${k}: ${data[k]}`);
        });
        lines.push('');
        lines.push('===== 作答记录 =====');
        (data.timeline || []).forEach((t, i) => {
          lines.push(`[${i + 1}] 场景：${t.sceneName || t.scene}（${t.scene}）`);
          if (t.type === 'choice') {
            lines.push(`    类型：选择`);
            lines.push(`    选择：${t.text}`);
            if (t.pathType) lines.push(`    路径类型：${t.pathType}`);
          } else if (t.type === 'input') {
            lines.push(`    类型：输入`);
            if (t.prompt) lines.push(`    提示：${t.prompt}`);
            lines.push(`    输入：${t.value}`);
          }
          lines.push('');
        });
        return lines.join('\n');
      }

      function downloadBlob(blob, filename) {
        const a = document.createElement('a');
        a.href = URL.createObjectURL(blob);
        a.download = filename;

      function handleExport(config) {
        const format = config.format || 'json';
        const ext = format === 'txt' ? 'txt' : 'json';
        const filename = (config.filename || '导出') + '.' + ext;
        const source = config.source || 'timeline';

        let content = '';
        let mime = 'text/plain;charset=utf-8';

        let sourceValue;
        if (source === 'timeline') {
          sourceValue = buildExportData();
        } else if (typeof source === 'string' && source.indexOf('{{') === 0) {
          sourceValue = resolveValue(source, {});
        } else {
          sourceValue = state.vars[source];
        }

        if (format === 'json') {
          content = JSON.stringify(sourceValue != null ? sourceValue : {}, null, 2);
          mime = 'application/json;charset=utf-8';
        } else if (format === 'txt') {
          if (source === 'timeline') {
            content = buildTxtExport(sourceValue);
          } else {
            content = typeof sourceValue === 'string' ? sourceValue : JSON.stringify(sourceValue, null, 2);
          }
        } else {
          content = String(sourceValue != null ? sourceValue : '');
        }

        const blob = new Blob([content], { type: mime });
        downloadBlob(blob, filename);
        setStatus(`✅ 已导出：${filename}`, true);
      }

      (function initDragUpload() {
        const dropZone = $('dropZone');
        const globalOverlay = $('globalDragOverlay');
        let dragCounter = 0;

        ['dragenter', 'dragover', 'dragleave', 'drop'].forEach(eventName => {
          document.body.addEventListener(eventName, e => {
            e.preventDefault();
            e.stopPropagation();
          });
        });

        document.addEventListener('dragenter', e => {
          if (uploadPage.style.display === 'none') return;
          dragCounter++;
          if (dragCounter === 1) {
            globalOverlay.classList.add('active');
            uploadPage.classList.add('dragging');
          }
        });
        document.addEventListener('dragover', e => {
          if (uploadPage.style.display === 'none') return;
          e.preventDefault();
        });
        document.addEventListener('dragleave', e => {
          if (uploadPage.style.display === 'none') return;
          dragCounter--;
          if (dragCounter <= 0) {
            dragCounter = 0;
            globalOverlay.classList.remove('active');
            uploadPage.classList.remove('dragging');
          }
        });
        document.addEventListener('drop', e => {
          if (uploadPage.style.display === 'none') return;
          e.preventDefault();
          dragCounter = 0;
          globalOverlay.classList.remove('active');
          uploadPage.classList.remove('dragging');
          const files = e.dataTransfer.files;
          if (!files || files.length === 0) return;
          const file = files[0];
          if (!/\.zip$/i.test(file.name)) { alert('请拖入 zip 文件'); return; }
          handleZipFile(file);
        });

        dropZone.addEventListener('dragenter', e => { e.preventDefault(); dropZone.classList.add('dragover'); });
        dropZone.addEventListener('dragover', e => { e.preventDefault(); dropZone.classList.add('dragover'); });
        dropZone.addEventListener('dragleave', e => {
          e.preventDefault();
          if (!dropZone.contains(e.relatedTarget)) dropZone.classList.remove('dragover');
        });
        dropZone.addEventListener('drop', e => {
          e.preventDefault();
          e.stopPropagation();
          dropZone.classList.remove('dragover');
          const files = e.dataTransfer.files;
          if (!files || files.length === 0) return;
          const file = files[0];
          if (!/\.zip$/i.test(file.name)) { alert('请拖入 zip 文件'); return; }
          handleZipFile(file);

      function handleZipFile(file) {
        if (!/\.zip$/i.test(file.name)) { alert('请上传 zip 文件'); return; }
        showLoading('正在解析 zip…');
        const reader = new FileReader();
        reader.onload = function (ev) {
          JSZip.loadAsync(ev.target.result).then(handleZip).catch(err => {
            hideLoading();
            alert('zip 解析失败：' + err.message);
          });
        };
        reader.readAsArrayBuffer(file);

      function handleZip(zip) {
        clearAllAssets();

        const allFiles = [];
        zip.forEach((path, entry) => {
          if (entry.dir) return;
          allFiles.push({ path, entry });
        });

        if (allFiles.length === 0) { hideLoading(); alert('zip 内没有任何文件'); return; }

        let rootPrefix = '';
        const rootJsonFiles = allFiles.filter(f => /^[^/]+\.json$/i.test(f.path));
        if (rootJsonFiles.length === 0) {
          const topDirs = new Set();
          allFiles.forEach(f => {
            const i = f.path.indexOf('/');
            if (i > 0) topDirs.add(f.path.substring(0, i));
          });

          if (topDirs.size === 0) {
            hideLoading();
            alert('zip 内未找到 json 文件（根目录无 json，也没有文件夹）');
            return;
          }
          if (topDirs.size > 1) {
            hideLoading();
            alert('zip 内未找到 json 文件（根目录无 json，且有多个顶层文件夹：' + Array.from(topDirs).join('、') + '）');
            return;
          }
          rootPrefix = Array.from(topDirs)[0] + '/';
        }

        const jsonFiles = [];
        const assetFiles = [];
        allFiles.forEach(f => {
          if (rootPrefix && !f.path.startsWith(rootPrefix)) return;
          const relPath = rootPrefix ? f.path.substring(rootPrefix.length) : f.path;
          const name = relPath.split('/').pop();
          if (!name) return;
          if (/\.json$/i.test(name)) {
            jsonFiles.push({ path: f.path, name, entry: f.entry });
          } else if (/\.(png|jpg|jpeg|gif|webp|mp3|wav|ogg|m4a|mp4|webm)$/i.test(name)) {
            if (relPath.indexOf('assets/') === 0) {
              assetFiles.push({ path: f.path, name, relPath, entry: f.entry });
            }
          }
        });

        if (jsonFiles.length === 0) {
          hideLoading();
          alert('zip 内未找到 json 文件' + (rootPrefix ? '（在文件夹 "' + rootPrefix.replace(/\/$/, '') + '" 内）' : ''));
          return;
        }

        const imgPromises = assetFiles.map(f =>
          f.entry.async('blob').then(blob => {
            state.assetMap[f.relPath] = URL.createObjectURL(blob);
          })
        );

        Promise.all(imgPromises).then(() => {
          const jsonPromises = jsonFiles.map(f =>
            f.entry.async('string').then(text => {
              try { return { name: f.name, data: JSON.parse(text) }; }
              catch (e) { console.error('JSON 解析失败:', f.name, e); return null; }
            })
          );
          return Promise.all(jsonPromises);
        }).then(list => {
          list.filter(Boolean).forEach(item => { state.files[item.name] = item.data; });
          hideLoading();
          uploadPage.style.display = 'none';

          const initFile = Object.keys(state.files).find(k => /^init\.json$/i.test(k));
          const init = initFile ? state.files[initFile] : null;

          const runInitFlow = () => {
            if (init && Array.isArray(init.actions) && init.actions.length > 0) {
              executeActions(init.actions, {}).catch(err => {
                console.error('init 执行失败:', err);
              });
            } else {
              startDefaultFlow();
            }
          };

          if (init && init.intro && (init.intro.title || init.intro.content)) {
            showIntro(init.intro, '数据包介绍', runInitFlow);
          } else {
            runInitFlow();
          }
        }).catch(err => {
          hideLoading();
          alert('资源加载失败：' + err.message);
        });
      }

      function findCharImg(name) {
        const list = charLayer.querySelectorAll('.char-sprite');
        for (let i = 0; i < list.length; i++) {
          if (list[i].alt === name) return list[i];
