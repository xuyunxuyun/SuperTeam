        let missions = JSON.parse(JSON.stringify(missionsData));
        let totalTasks = 0;
        missions.forEach(g => totalTasks += g.tasks.length);

        // 存储展开状态: 当前打开的大组索引（同一时间只有一个大组展开，-1代表全折叠）
        let currentOpenGroup = null;
        // 存储每个任务组内部当前展开的小任务索引（用于手风琴效果：每个组内同一时间只展开一个任务）
        let groupOpenTaskIndex = {};  // { "groupIndex": taskIndex }  -1代表该组内没有展开任务

        function saveGlobalState() {
            localStorage.setItem('wasteMissions', JSON.stringify(missions));
            localStorage.setItem('currentOpenGroup', currentOpenGroup !== null ? currentOpenGroup : -1);
            localStorage.setItem('groupOpenTaskIndex', JSON.stringify(groupOpenTaskIndex));
        }

        function loadGlobalState() {
            const saved = localStorage.getItem('wasteMissions');
            if (saved) missions = JSON.parse(saved);
            const savedGroup = localStorage.getItem('currentOpenGroup');
            if (savedGroup !== null && parseInt(savedGroup) !== -1) currentOpenGroup = parseInt(savedGroup);
            else currentOpenGroup = null;
            const savedTaskIdx = localStorage.getItem('groupOpenTaskIndex');
            if (savedTaskIdx) groupOpenTaskIndex = JSON.parse(savedTaskIdx);
            else groupOpenTaskIndex = {};
        }

        // 勾选任务时: 自动折叠当前任务并打开下一个未完成任务（同组内）
        function autoJumpToNextTask(groupIdx, currentTaskIdx) {
            const group = missions[groupIdx];
            if (!group) return;
            // 寻找当前任务后面第一个未完成的任务
            let nextIndex = -1;
            for (let i = currentTaskIdx + 1; i < group.tasks.length; i++) {
                if (!group.tasks[i].done) {
                    nextIndex = i;
                    break;
                }
            }
            if (nextIndex !== -1) {
                // 折叠当前展开的任务（如果有）
                if (groupOpenTaskIndex[groupIdx] !== undefined) {
                    // 只是折叠当前展开项，不改变 groupOpenTaskIndex 就代表关闭旧的
                }
                // 设置新的展开任务索引
                groupOpenTaskIndex[groupIdx] = nextIndex;
                // 重新渲染以保证界面展开到新的任务详情
                render();
                // 滚动到新任务位置，提升体验
                setTimeout(() => {
                    const targetTask = document.querySelector(`.task-item[data-group='${groupIdx}'][data-task='${nextIndex}']`);
                    if (targetTask) targetTask.scrollIntoView({ behavior: 'smooth', block: 'center' });
                }, 50);
            } else {
                // 没有下一个任务了，但也可以保留当前折叠状态，不清空展开也可以，渲染后同一组内手风琴规则保证不会错误
                // 如果已完成所有任务，最好折叠当前打开的任务
                if (groupOpenTaskIndex[groupIdx] !== undefined) delete groupOpenTaskIndex[groupIdx];
                render();
            }
        }

        function render() {
            const container = document.getElementById('missionsContainer');
            container.innerHTML = '';
            let doneCount = 0;
            missions.forEach((group, gi) => {
                const groupDone = group.tasks.filter(t => t.done).length;
                doneCount += groupDone;
                const groupDiv = document.createElement('div');
                groupDiv.className = 'mission-group';
                // 头部
                const header = document.createElement('div');
                header.className = 'group-header';
                header.innerHTML = `
                <div class="group-title">
                    <span class="emoji">${group.emoji}</span>
                    <span>${group.name}</span>
                </div>
                <div style="display: flex; align-items: center; gap: 14px;">
                    <div class="group-count">${groupDone}/${group.tasks.length}</div>
                    <div class="group-expand-icon">▼</div>
                </div>
            `;
                const tasksContainer = document.createElement('div');
                tasksContainer.className = 'tasks-container';
                // 大组手风琴逻辑: 只有当前打开的大组才显示任务列表
                const isGroupOpen = (currentOpenGroup === gi);
                tasksContainer.style.display = isGroupOpen ? 'block' : 'none';
                const iconSpan = header.querySelector('.group-expand-icon');
                iconSpan.style.transform = isGroupOpen ? 'rotate(180deg)' : 'rotate(0deg)';

                // 点击大组头部：关闭其他所有大组，切换当前组
                header.addEventListener('click', (e) => {
                    if (e.target.tagName === 'A') return;
                    if (currentOpenGroup === gi) {
                        // 如果已经打开，就折叠（并清除该组内部的任务展开索引）
                        currentOpenGroup = null;
                        delete groupOpenTaskIndex[gi];
                    } else {
                        currentOpenGroup = gi;
                        // 打开新组时，确保该组内默认有展开的任务: 如果没有设定展开任务且存在未完成任务，展开第一个未完成；若全部完成则展开第一个
                        if (groupOpenTaskIndex[gi] === undefined) {
                            const firstIncomplete = group.tasks.findIndex(t => !t.done);
                            groupOpenTaskIndex[gi] = firstIncomplete !== -1 ? firstIncomplete : 0;
                        }
                    }
                    saveGlobalState();
                    render();
                });

                // 渲染任务列表
                group.tasks.forEach((task, ti) => {
                    const taskItem = document.createElement('div');
                    taskItem.className = 'task-item';
                    taskItem.setAttribute('data-group', gi);
                    taskItem.setAttribute('data-task', ti);
                    const taskHeader = document.createElement('div');
                    taskHeader.className = 'task-header';
                    const checkboxSpan = document.createElement('div');
                    checkboxSpan.className = `task-checkbox ${task.done ? 'checked' : ''}`;
                    checkboxSpan.innerHTML = task.done ? '✓' : '';
                    checkboxSpan.addEventListener('click', (e) => {
                        e.stopPropagation();
                        if (!task.done) {
                            task.done = true;
                            saveGlobalState();
                            // 勾选后自动跳转下一未完成任务（同组内）
                            autoJumpToNextTask(gi, ti);
                        } else {
                            // 取消勾选时，只是改变状态并重新渲染，不进行自动跳转
                            task.done = false;
                            saveGlobalState();
                            render();
                        }
                    });
                    const titleSpan = document.createElement('div');
                    titleSpan.className = 'task-title';
                    // 处理超链接显示
                    let displayText = task.text;
                    if (task.hasLink && task.linkUrl) {
                        titleSpan.innerHTML = `<a href="${task.linkUrl}" target="_blank" rel="noopener noreferrer" onclick="event.stopPropagation()">${task.linkText || task.text}</a>`;
                    } else {
                        titleSpan.innerText = task.text;
                    }
                    const expandIcon = document.createElement('div');
                    expandIcon.className = 'task-expand-icon';
                    expandIcon.innerHTML = '▼';
                    const detailDiv = document.createElement('div');
                    detailDiv.className = 'task-detail';
                    detailDiv.innerHTML = `
                    <div class="detail-content">
                        <div class="detail-text">
                            ${task.detail}
                        </div>
                        <div class="speaker-info">
                            <div class="speaker-avatar">${task.speakerEmoji || '💬'}</div>
                            <div class="speaker-name">${task.speaker}</div>
                            <div class="speaker-quote">“${task.speakerQuote}”</div>
                        </div>
                    </div>
                `;
                    // 同组内任务手风琴: 只有当前大组打开时，且该任务索引等于 groupOpenTaskIndex[gi] 才展开详情
                    const isTaskOpen = (isGroupOpen && groupOpenTaskIndex[gi] === ti);
                    detailDiv.style.display = isTaskOpen ? 'block' : 'none';
                    expandIcon.style.transform = isTaskOpen ? 'rotate(180deg)' : 'rotate(0deg)';
                    // 点击任务头部：展开当前任务，并折叠同组其他任务详情
                    taskHeader.addEventListener('click', (e) => {
                        if (e.target.tagName === 'A') return;
                        if (e.target === checkboxSpan || checkboxSpan.contains(e.target)) return;
                        if (!isGroupOpen) return; // 大组未打开，不能展开任务
                        if (groupOpenTaskIndex[gi] === ti) {
                            // 如果已经展开，则折叠当前
                            delete groupOpenTaskIndex[gi];
                        } else {
                            // 否则打开当前，关闭组内其他
                            groupOpenTaskIndex[gi] = ti;
                        }
                        saveGlobalState();
                        render();
                    });
                    taskHeader.appendChild(checkboxSpan);
                    taskHeader.appendChild(titleSpan);
                    taskHeader.appendChild(expandIcon);
                    taskItem.appendChild(taskHeader);
                    taskItem.appendChild(detailDiv);
                    tasksContainer.appendChild(taskItem);
                });
                groupDiv.appendChild(header);
                groupDiv.appendChild(tasksContainer);
                container.appendChild(groupDiv);
            });

            const percent = (doneCount / totalTasks) * 100;
            document.getElementById('progressBar').style.width = percent + '%';
            document.getElementById('doneCount').innerText = doneCount;
            document.getElementById('totalCount').innerText = totalTasks;
            const easterEgg = document.getElementById('easterEgg');
            const completeMsg = document.getElementById('completeMessage');
            if (doneCount === totalTasks && totalTasks > 0) {
                easterEgg.style.display = 'block';
                completeMsg.classList.add('show');
            } else {
                easterEgg.style.display = 'none';
                completeMsg.classList.remove('show');
            }
        }

        document.getElementById('resetBtn').addEventListener('click', () => {
            missions = JSON.parse(JSON.stringify(missionsData));
            currentOpenGroup = null;
            groupOpenTaskIndex = {};
            saveGlobalState();
            // 清除旧的localstorage部分标记但无需全部清除
            render();
        });

        loadGlobalState();
        render();
    </script>
