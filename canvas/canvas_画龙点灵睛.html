    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        /* 深色科技感主题变量 */
        :root {
            --bg-deep: #0a0f1c;
            --bg-panel: #0f1422;
            --bg-card: #111827;
            --bg-elevated: #1a1f2e;
            --border-subtle: #2a3452;
            --border-glow: rgba(76, 154, 255, 0.4);
            --primary-blue: #4c9aff;
            --primary-blue-dark: #3b82f6;
            --primary-glow: rgba(76, 154, 255, 0.3);
            --text-primary: #e0e0e0;
            --text-secondary: #9aa9c1;
            --text-muted: #6b7a8f;
            --accent-danger: #f56565;
            --accent-warning: #f39c12;
            --accent-success: #48bb78;
            --shadow-card: 0 8px 24px rgba(0, 0, 0, 0.4);
            --shadow-glow: 0 0 12px rgba(76, 154, 255, 0.2);
        }

        body {
            font-family: 'Segoe UI', 'Inter', system-ui, -apple-system, sans-serif;
            background: var(--bg-deep);
            height: 100vh;
            overflow: hidden;
        }

        .app-container {
            display: flex;
            flex-direction: column;
            height: 100vh;
            width: 100vw;
            background: var(--bg-deep);
        }

        /* 毛玻璃工具栏 */
        .toolbar-glass {
            flex-shrink: 0;
            background: rgba(15, 20, 34, 0.92);
            backdrop-filter: blur(16px);
            border-bottom: 1px solid var(--border-subtle);
            padding: 10px 20px;
            z-index: 50;
        }

        .toolbar-flex {
            display: flex;
            flex-wrap: wrap;
            gap: 8px 14px;
            align-items: center;
        }

        .tool-capsule {
            display: flex;
            flex-wrap: wrap;
            gap: 2px;
            background: rgba(26, 31, 46, 0.6);
            padding: 4px 8px;
            border-radius: 48px;
            border: 1px solid var(--border-subtle);
        }

        .tool-icon {
            background: transparent;
            border: none;
            cursor: pointer;
            padding: 6px 12px;
            border-radius: 32px;
            transition: all 0.2s ease;
            color: var(--text-secondary);
            display: inline-flex;
            align-items: center;
            gap: 6px;
            font-size: 13px;
            font-weight: 500;
        }

        .tool-icon i {
            width: 16px;
            height: 16px;
            display: inline-block;
        }

        .tool-icon:hover {
            background: rgba(76, 154, 255, 0.15);
            color: var(--primary-blue);
            transform: translateY(-1px);
        }

        /* 特殊按钮样式 */
        .btn-file {
            background: linear-gradient(135deg, var(--primary-blue), var(--primary-blue-dark));
            color: white !important;
            padding: 6px 16px;
        }
        .btn-file:hover {
            background: linear-gradient(135deg, var(--primary-blue-dark), #2563eb);
            transform: translateY(-1px);
            box-shadow: var(--shadow-glow);
        }

        .btn-export {
            background: rgba(76, 154, 255, 0.12);
            color: var(--primary-blue) !important;
            border: 1px solid rgba(76, 154, 255, 0.3);
        }
        .btn-export:hover {
            background: rgba(76, 154, 255, 0.25);
            border-color: var(--primary-blue);
        }

        .btn-source {
            background: rgba(107, 122, 143, 0.15);
            color: var(--text-primary) !important;
        }
        .btn-source:hover {
            background: rgba(107, 122, 143, 0.3);
            color: var(--primary-blue) !important;
        }

        .btn-clear {
            background: rgba(245, 101, 101, 0.12);
            color: var(--accent-danger) !important;
            border: 1px solid rgba(245, 101, 101, 0.3);
        }
        .btn-clear:hover {
            background: rgba(245, 101, 101, 0.25);
            border-color: var(--accent-danger);
        }

        /* 编辑器滚动区 */
        .editor-scroll {
            flex: 1;
            overflow-y: auto;
            padding: 24px 32px;
        }

        .editor-scroll::-webkit-scrollbar {
            width: 6px;
        }
        .editor-scroll::-webkit-scrollbar-track {
            background: var(--bg-panel);
            border-radius: 4px;
        }
        .editor-scroll::-webkit-scrollbar-thumb {
            background: var(--border-subtle);
            border-radius: 4px;
        }
        .editor-scroll::-webkit-scrollbar-thumb:hover {
            background: var(--primary-blue);
        }

        /* 卡片式编辑器面板 - 浅色编辑器区域 */
        .editor-paper {
            max-width: 1280px;
            margin: 0 auto;
            background: #ffffff;
            border-radius: 20px;
            border: 1px solid var(--border-subtle);
            box-shadow: var(--shadow-card);
            overflow: hidden;
            transition: border-color 0.2s;
        }
        .editor-paper:hover {
            border-color: var(--border-glow);
        }

        /* ========== 编辑器浅色样式 ========== */
        .nova-editor {
            min-height: 70vh;
            padding: 36px 44px;
            outline: none;
            font-size: 0.95rem;
            line-height: 1.65;
            background: #ffffff;
            color: #1f2a3e;
            font-family: 'Segoe UI', 'Inter', system-ui, sans-serif;
        }

        .nova-editor:empty:before {
            content: attr(placeholder);
            color: #a6bbcf;
            pointer-events: none;
            opacity: 0.7;
        }

        /* 浅色编辑器内容样式 */
        .nova-editor h1 { 
            font-size: 1.9rem; 
            font-weight: 600; 
            margin: 1rem 0 0.75rem; 
            border-left: 3px solid #2c6e9e; 
            padding-left: 18px; 
            color: #1e293b;
            letter-spacing: -0.02em;
        }
        .nova-editor h2 { 
            font-size: 1.5rem; 
            font-weight: 600; 
            margin: 0.8rem 0 0.5rem; 
            color: #2d3a5e;
        }
        .nova-editor h3 { 
            font-size: 1.25rem; 
            font-weight: 600; 
            margin: 0.6rem 0; 
            color: #3a4a6e;
        }
        .nova-editor p { 
            margin: 0.75rem 0; 
            line-height: 1.65; 
            color: #334155;
        }
        .nova-editor ul, .nova-editor ol { 
            margin: 0.5rem 0 1rem 1.8rem; 
            color: #334155;
        }
        .nova-editor li {
            margin: 0.25rem 0;
            color: #334155;
        }
        .nova-editor blockquote {
            border-left: 3px solid #2c6e9e;
            background: #f7fafd;
            margin: 1rem 0;
            padding: 0.6rem 1.2rem;
            border-radius: 12px;
            color: #2c577a;
        }
        .nova-editor pre {
            background: #1e2a3a;
            color: #e2f0ff;
            padding: 1rem;
            border-radius: 14px;
            overflow-x: auto;
            font-family: 'Fira Code', 'Monaco', monospace;
            font-size: 0.85rem;
            border: 1px solid #cbd5e1;
        }
        .nova-editor code {
            background: #eef3fc;
            padding: 0.2rem 0.45rem;
            border-radius: 6px;
            font-family: 'Fira Code', monospace;
            font-size: 0.85em;
            color: #2563eb;
        }
        .nova-editor img { 
            max-width: 100%; 
            border-radius: 12px; 
            margin: 12px 0;
            border: 1px solid #e2e8f0;
        }
        .nova-editor a { 
            color: #2c6e9e; 
            text-decoration: none; 
            border-bottom: 1px solid #c9dfef;
            transition: 0.2s;
        }
        .nova-editor a:hover {
            border-bottom-color: #2c6e9e;
        }
        .nova-editor table {
            width: 100%;
            border-collapse: collapse;
            margin: 1rem 0;
            background: #ffffff;
            border-radius: 12px;
            overflow: hidden;
        }
        .nova-editor th, .nova-editor td {
            border: 1px solid #e2e8f0;
            padding: 10px 14px;
            color: #334155;
        }
        .nova-editor th {
            background: #f8fafc;
            color: #1e293b;
            font-weight: 600;
        }
        .nova-editor hr {
            border: none;
            height: 1px;
            background: linear-gradient(90deg, transparent, #cbd5e1, transparent);
            margin: 1.2rem 0;

            background: rgba(10, 15, 28, 0.85);

            align-items: center;
            justify-content: center;

            display: flex;

            padding: 16px 24px;

            display: flex;

            align-items: center;
            font-weight: 600;
            font-size: 1rem;
            background: rgba(26, 31, 46, 0.8);

            color: var(--primary-blue);

        .source-modal-header button {
            background: none;
            border: none;
            font-size: 24px;
            cursor: pointer;
            color: var(--text-muted);

        .source-modal-header button:hover {

        }
        .source-textarea {
            flex: 1;
            padding: 20px 24px;
        }
        .source-textarea textarea {

            font-size: 13px;
            line-height: 1.5;
            padding: 16px;
            border: 1px solid var(--border-subtle);
            border-radius: 16px;
            resize: vertical;
            outline: none;
            background: var(--bg-card);
            color: var(--text-primary);
        }
        .source-textarea textarea:focus {
            border-color: var(--primary-blue);
            box-shadow: 0 0 0 2px rgba(76, 154, 255, 0.2);
        }
        .source-modal-footer {
            padding: 16px 24px;
            border-top: 1px solid var(--border-subtle);
            display: flex;
            justify-content: flex-end;
            gap: 12px;
        }
        .source-modal-footer button {
            padding: 8px 22px;
            border-radius: 40px;
            border: none;
            cursor: pointer;
            font-weight: 500;
            transition: 0.2s;
            font-size: 13px;
        }
        .btn-apply {
            background: linear-gradient(135deg, var(--primary-blue), var(--primary-blue-dark));
            color: white;
        }
        .btn-apply:hover { 
            background: linear-gradient(135deg, var(--primary-blue-dark), #2563eb);
            transform: translateY(-1px);
            box-shadow: var(--shadow-glow);
        }
        .btn-cancel {
            background: rgba(107, 122, 143, 0.2);
            color: var(--text-secondary);
            border: 1px solid var(--border-subtle);
        }
        .btn-cancel:hover { 
            background: rgba(107, 122, 143, 0.35);
            color: var(--text-primary);
        }

        /* 状态提示 */
        .status-toast {
            position: fixed;
            bottom: 24px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(26, 31, 46, 0.95);
            backdrop-filter: blur(12px);
            padding: 6px 18px;
            border-radius: 40px;
            font-size: 12px;
            color: var(--text-primary);
            border: 1px solid var(--border-glow);
            pointer-events: none;
            z-index: 300;
            white-space: nowrap;
        }

        /* 右键菜单 */
        .context-menu {
            position: fixed;
            background: rgba(30, 35, 55, 0.98);
            backdrop-filter: blur(12px);
            border: 1px solid var(--primary-blue);
            border-radius: 12px;
            padding: 6px 0;
            min-width: 180px;
            z-index: 10000;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.5);
            display: none;
        }
        .context-menu-item {
            padding: 8px 18px;
            font-size: 13px;
            color: var(--text-secondary);
            cursor: pointer;
            transition: 0.1s;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .context-menu-item i {
            width: 18px;
            font-size: 12px;
            color: var(--primary-blue);
        }
        .context-menu-item:hover {
            background: var(--primary-blue);
            color: white;
        }
        .context-menu-item:hover i {
            color: white;
        }
        .context-menu-divider {
            height: 1px;
            background: var(--border-subtle);
            margin: 4px 0;
        }

        input[type="file"] { display: none; }

        /* 响应式 */
        @media (max-width: 768px) {
            .toolbar-glass { padding: 8px 12px; }
            .tool-capsule { padding: 3px 6px; }
            .tool-icon { padding: 4px 10px; font-size: 11px; }
            .editor-scroll { padding: 16px; }
            .nova-editor { padding: 24px 28px; }
            .source-modal-content { width: 95%; }
        }
    </style>
</head>
<body>
<div class="app-container">

        <div class="toolbar-flex">
            <!-- 基础文本样式组 -->
            <div class="tool-capsule">

            <!-- 标题/段落组 -->
            <div class="tool-capsule">

                <button class="tool-icon" data-cmd="formatBlock" data-value="h2" title="二级标题">H2</button>

            <!-- 编辑辅助组 -->
            <div class="tool-capsule">
                <button class="tool-icon" data-cmd="undo" title="撤销 (Ctrl+Z)"><i data-lucide="undo-2"></i></button>

                <button class="tool-icon btn-source" id="sourceCodeBtn"><i data-lucide="code"></i> 源码</button>
                <button class="tool-icon btn-clear" id="clearEditorBtn"><i data-lucide="trash-2"></i> 清空</button>

    <div class="editor-scroll">
        <div class="editor-paper">

<!-- 右键菜单 -->
<div id="contextMenu" class="context-menu">
    <div class="context-menu-item" id="ctxExportHtml">
        <i data-lucide="download"></i> 导出为HTML
    </div>
    <div class="context-menu-divider"></div>
    <div class="context-menu-item" id="ctxClearAll">
        <i data-lucide="trash-2"></i> 清空全部内容
    </div>

<div id="statusToast" class="status-toast" style="display: none;"></div>

<script>
    (function() {
        const editor = document.getElementById('novaEditor');
        const fileInput = document.getElementById('htmlUpload');
        const exportBtn = document.getElementById('exportHtmlBtn');
        const clearBtn = document.getElementById('clearEditorBtn');
        const sourceBtn = document.getElementById('sourceCodeBtn');
        
        // 初始化编辑器
        editor.innerHTML = '';
        editor.setAttribute('placeholder', '📝 开始书写... 支持富文本编辑、HTML导入导出');

        function showTip(msg, duration = 2000) {
            const toast = document.getElementById('statusToast');
            toast.innerText = msg;
            toast.style.display = 'block';
            setTimeout(() => {
                toast.style.display = 'none';
            }, duration);
        }

        function exec(cmd, val = null) {
            editor.focus();
            try {
                if (val !== null && val !== undefined) {
                    document.execCommand(cmd, false, val);
                } else {
                    document.execCommand(cmd, false, null);
                }
                editor.dispatchEvent(new Event('input'));
            } catch(e) { console.warn(cmd, e); }
        }
        
        // ========== 核心安全过滤器：提取body内容 + 移除危险样式 ==========
        function sanitizeHtmlContent(rawHtml) {
            if (!rawHtml || rawHtml.trim() === '') return '';
            
            const parser = new DOMParser();
            const doc = parser.parseFromString(rawHtml, 'text/html');
            
            const styleNodes = doc.querySelectorAll('style');
            const safeStyles = [];
            styleNodes.forEach(style => {
                let cssText = style.innerHTML;
                const dangerousProps = /(position\s*:\s*(absolute|fixed|sticky)|margin\s*:\s*[^;]*;?|top\s*:\s*[^;]*|left\s*:\s*[^;]*|transform\s*:\s*[^;]*|overflow\s*:\s*hidden|height\s*:\s*100[vh%]?)/gi;
                let filteredCss = cssText.replace(/(body|html)\s*\{([^}]*)\}/gi, (match, selector, props) => {
                    let safeProps = props.replace(dangerousProps, '/* 已过滤偏移样式 */');
                    if (safeProps.trim() === '') return '';
                    return `${selector} { ${safeProps} }`;
                });
                filteredCss = filteredCss.replace(/\*\{([^}]*?)\}/gi, (match, props) => {
                    let cleaned = props.replace(/(margin|padding)\s*:\s*[^;]+;?/gi, '/* 已清理 */');
                    if (cleaned.trim() === '') return '';
                    return `* { ${cleaned} }`;
                });
                if (filteredCss.trim()) {
                    const newStyle = document.createElement('style');
                    newStyle.textContent = filteredCss;
                    safeStyles.push(newStyle);
                }
            });
            
            const bodyContent = doc.body;
            const contentFragment = document.createDocumentFragment();
            if (bodyContent) {
                while (bodyContent.firstChild) {
                    contentFragment.appendChild(bodyContent.firstChild);
                }
            }
            
            const walker = document.createTreeWalker(contentFragment, NodeFilter.SHOW_ELEMENT, null);
            while (walker.nextNode()) {
                const el = walker.currentNode;
                if (el.nodeType === 1 && el.hasAttribute('style')) {
                    let styleAttr = el.getAttribute('style');
                    if (styleAttr) {
                        let cleanedStyle = styleAttr.replace(/(position|margin|top|left|bottom|right|transform)\s*:\s*[^;]+;?/gi, '');
                        if (cleanedStyle.trim() === '') el.removeAttribute('style');
                        else el.setAttribute('style', cleanedStyle);
                    }
                }
            }
            
            const tempContainer = document.createElement('div');
            safeStyles.forEach(style => tempContainer.appendChild(style.cloneNode(true)));
            while (contentFragment.firstChild) {
                tempContainer.appendChild(contentFragment.firstChild);
            }
            return tempContainer.innerHTML;
        }
        
        function loadHtmlSmart(file) {
            if (!file) return;
            const reader = new FileReader();
            reader.onload = (e) => {
                try {
                    const safeContent = sanitizeHtmlContent(e.target.result);
                    editor.innerHTML = safeContent || '';
                    showTip('✅ 文件已加载并过滤样式', 2000);
                } catch(err) {
                    console.error(err);
                    editor.innerHTML = '<p>⚠️ 解析异常</p>';
                    showTip('❌ 文件解析失败', 2000);
                }
                editor.focus();
            };
            reader.onerror = () => alert('文件读取失败');
            reader.readAsText(file, 'UTF-8');
        }
        
        function fullClear() {
            if (confirm('⚠️ 清空所有内容？此操作不可撤销。')) {
                editor.innerHTML = '';
                editor.focus();
                showTip('🗑️ 已清空编辑器', 1500);
            }
        }
        
        function exportSafeHtml() {
            let inner = editor.innerHTML;
            if (!inner.trim() && !confirm('当前内容为空，确定导出空白文档吗？')) return;
            const finalDoc = `<!DOCTYPE html>
<html lang="zh-CN">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>画龙点灵睛 · 文档导出</title>
<style>
    body { 
        max-width: 1100px; 
        margin: 2rem auto; 
        padding: 2rem; 
        background: #ffffff; 
        color: #1f2a3e;
        font-family: 'Segoe UI', system-ui; 
        line-height: 1.6; 
    }
    img { max-width: 100%; border-radius: 12px; }
    table { border-collapse: collapse; width: 100%; margin: 1rem 0; }
    th, td { border: 1px solid #e2e8f0; padding: 8px 12px; }
    th { background: #f8fafc; color: #1e293b; }
    pre { background: #1e2a3a; color: #e2f0ff; padding: 1rem; border-radius: 12px; overflow-x: auto; }
    code { background: #eef3fc; padding: 0.2rem 0.4rem; border-radius: 6px; color: #2563eb; }
    blockquote { border-left: 3px solid #2c6e9e; background: #f7fafd; padding: 0.5rem 1.2rem; margin: 1rem 0; border-radius: 12px; color: #2c577a; }
    a { color: #2c6e9e; text-decoration: none; border-bottom: 1px solid #c9dfef; }
    hr { border: none; height: 1px; background: linear-gradient(90deg, transparent, #cbd5e1, transparent); }
</style>
</head>
<body>${inner}</body>
</html>`;
            const blob = new Blob([finalDoc], { type: 'text/html' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.download = `document_${Date.now()}.html`;
            a.href = url;
            a.click();
            URL.revokeObjectURL(url);
            showTip('📄 文档已导出', 1500);
        }
        
        // ========== 源码编辑弹窗 ==========
        function showSourceEditor() {
            const currentHtml = editor.innerHTML;
            const modal = document.createElement('div');
            modal.className = 'source-modal';
            modal.innerHTML = `
                <div class="source-modal-content">
                    <div class="source-modal-header">
                        <span>✏️ 编辑 HTML 源码</span>
                        <button class="close-modal-btn">&times;</button>
                    </div>
                    <div class="source-textarea">
                        <textarea id="sourceRawHtml" placeholder="在此粘贴或编辑 HTML 源码...&#10;提示：完整的网页内容会被自动提取 body 并过滤偏移样式。">${escapeHtml(currentHtml)}</textarea>
                    </div>
                    <div class="source-modal-footer">
                        <button class="btn-cancel" id="cancelSourceBtn">取消</button>
                        <button class="btn-apply" id="applySourceBtn">安全应用</button>
                    </div>
                </div>
            `;
            document.body.appendChild(modal);
            
            const textarea = modal.querySelector('#sourceRawHtml');
            const closeBtn = modal.querySelector('.close-modal-btn');
            const cancelBtn = modal.querySelector('#cancelSourceBtn');
            const applyBtn = modal.querySelector('#applySourceBtn');
            
            const closeModal = () => modal.remove();
            
            closeBtn.addEventListener('click', closeModal);
            cancelBtn.addEventListener('click', closeModal);
            applyBtn.addEventListener('click', () => {
                const rawHtml = textarea.value;
                if (!rawHtml.trim()) {
                    editor.innerHTML = '';
                } else {
                    const safeContent = sanitizeHtmlContent(rawHtml);
                    editor.innerHTML = safeContent || '';
                }
                editor.focus();
                showTip('✅ 源码已应用', 1500);
                closeModal();
            });
            modal.addEventListener('click', (e) => {
                if (e.target === modal) closeModal();
            });
            textarea.focus();
        }
        
        function escapeHtml(str) {
            if (!str) return '';
            return str.replace(/[&<>]/g, function(m) {
                if (m === '&') return '&amp;';
                if (m === '<') return '&lt;';
                if (m === '>') return '&gt;';
                return m;
            });
        }
        
        function insertLink() {
            let url = prompt('🔗 链接地址:', 'https://');
            if (url) {
                if (!url.startsWith('http')) url = 'https://' + url;
                exec('createLink', url);
            }
        }
        function insertImage() {
            let url = prompt('🖼️ 图片URL:', 'https://picsum.photos/600/400');
            if (url) exec('insertImage', url);
        }
        function insertTable() {
            let r = prompt('行数', '3'), c = prompt('列数', '3');
            if(!r||!c) return;
            let rows = parseInt(r), cols = parseInt(c);
            let html = `</table><tbody>`;
            for(let i=0;i<rows;i++) {
                html += '<tr>';
                for(let j=0;j<cols;j++) {
                    if(i===0) html += `<th>标题${j+1}</th>`;
                    else html += `<td>数据${j+1}</td>`;
                }
                html += '</tr>';
            }
            html += `</tbody></table>`;
            exec('insertHTML', html);
        }
        function insertHr() { exec('insertHorizontalRule'); }
        function indent() { exec('indent'); }
        function outdent() { exec('outdent'); }
        
        // 右键菜单功能
        function initContextMenu() {
            const menu = document.getElementById('contextMenu');
            document.addEventListener('contextmenu', (e) => {
                e.preventDefault();
                menu.style.display = 'block';
                menu.style.left = e.clientX + 'px';
                menu.style.top = e.clientY + 'px';
                const closeMenu = () => {
                    menu.style.display = 'none';
                    document.removeEventListener('click', closeMenu);
                };
                setTimeout(() => { document.addEventListener('click', closeMenu); }, 10);
            });
            document.getElementById('ctxExportHtml').addEventListener('click', () => {
                exportSafeHtml();
                menu.style.display = 'none';
            });
            document.getElementById('ctxClearAll').addEventListener('click', () => {
                fullClear();
                menu.style.display = 'none';
            });
        }
        
        function bindDataButtons() {
            document.querySelectorAll('.tool-icon[data-cmd]').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    e.preventDefault();
                    let cmd = btn.getAttribute('data-cmd');
                    let val = btn.getAttribute('data-value');
                    if (cmd === 'formatBlock') {
                        if (val === 'pre') exec('formatBlock', '<pre>');
                        else exec('formatBlock', `<${val}>`);
                    } else {
                        exec(cmd, val);
                    }
                });
            });
        }
        
        function bindSpecialUI() {
            document.getElementById('linkAction')?.addEventListener('click', insertLink);
            document.getElementById('imageAction')?.addEventListener('click', insertImage);
            document.getElementById('tableAction')?.addEventListener('click', insertTable);
            document.getElementById('hrAction')?.addEventListener('click', insertHr);
            document.getElementById('indentBtn')?.addEventListener('click', indent);
            document.getElementById('outdentBtn')?.addEventListener('click', outdent);
            document.getElementById('sourceCodeBtn')?.addEventListener('click', showSourceEditor);
            exportBtn.addEventListener('click', exportSafeHtml);
            clearBtn.addEventListener('click', fullClear);
            fileInput.addEventListener('change', (e) => {
                if(e.target.files[0]) loadHtmlSmart(e.target.files[0]);
                fileInput.value = '';
            });
        }
        
        function initShortcuts() {
            editor.addEventListener('keydown', (e) => {
                if (e.ctrlKey && e.key === 'b') { e.preventDefault(); exec('bold'); }
                else if (e.ctrlKey && e.key === 'i') { e.preventDefault(); exec('italic'); }
                else if (e.ctrlKey && e.key === 'u') { e.preventDefault(); exec('underline'); }
                else if (e.ctrlKey && e.key === 'z') { e.preventDefault(); exec('undo'); }
                else if (e.ctrlKey && e.key === 'y') { e.preventDefault(); exec('redo'); }
                else if (e.ctrlKey && e.key === ']') { e.preventDefault(); exec('indent'); }
                else if (e.ctrlKey && e.key === '[') { e.preventDefault(); exec('outdent'); }
            });
        }
        
        function renderIcons() { 
            if (typeof lucide !== 'undefined') lucide.createIcons();
            else setTimeout(renderIcons, 100);
        }
        
        function init() {
            bindDataButtons();
            bindSpecialUI();
            initShortcuts();
            initContextMenu();
            renderIcons();
            editor.focus();
        }
        init();
    })();
</script>
</body>
</html>
