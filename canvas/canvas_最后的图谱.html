    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Segoe UI', 'Roboto', sans-serif;
            background: #0b0f1c;
            height: 100vh;
            width: 100vw;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            user-select: none;
        }

        .tabs-header {
            background: #141a2c;
            padding: 8px 16px 0 16px;
            display: flex;
            gap: 4px;
            align-items: flex-end;
            overflow-x: auto;
            overflow-y: hidden;
            scrollbar-width: thin;
            border-bottom: 1px solid #2a3452;
            z-index: 20;
            flex-shrink: 0;
        }

        .tabs-header::-webkit-scrollbar {
            height: 4px;
            background: transparent;
        }

        .tab-item {
            background: #1e243b;
            color: #b9c7d9;
            padding: 8px 18px;
            border-radius: 12px 12px 0 0;
            font-size: 13px;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            border: 1px solid #2a3452;
            border-bottom: none;
            position: relative;
            margin-bottom: -1px;
        }

        .tab-item.active {
            background: #0f1422;
            color: white;
            border-top: 2px solid #4c9aff;
            border-bottom: 1px solid #0f1422;
        }

        .tab-name {
            display: inline-block;
            cursor: pointer;
            padding: 0 2px;
            border-radius: 4px;
        }

        .tab-name:hover {
            background: rgba(76, 154, 255, 0.2);
        }

        .close-tab {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 30px;
            width: 20px;
            height: 20px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
            cursor: pointer;
            transition: 0.2s;
        }

        .close-tab:hover {
            background: #ff5c5c;
            color: white;
        }

        .add-tab-btn {
            background: #2a3452;
            border: none;
            color: #9aa9c1;
            padding: 6px 18px;
            border-radius: 20px;

        .add-tab-btn:hover {

            color: white;
        }

        .tab-name-input {
            background: #2a3a60;
            border: 1px solid #4c9aff;
            border-radius: 6px;
            padding: 2px 6px;
            font-size: 12px;
            color: white;
            outline: none;
            width: 100px;
        }

        .accordion-menu {
            position: fixed;
            left: 20px;
            top: 80px;
            width: 300px;
            background: rgba(20, 26, 44, 0.95);
            backdrop-filter: blur(16px);
            border-radius: 20px;
            border: 1px solid rgba(76, 154, 255, 0.4);
            z-index: 100;
            overflow: hidden;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
        }

        .accordion-item {
            border-bottom: 1px solid #2a3452;
        }

        .accordion-header {
            padding: 12px 16px;
            background: rgba(0, 0, 0, 0.3);
            cursor: pointer;
            font-weight: 600;
            color: #4c9aff;
            font-size: 13px;
            transition: 0.2s;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .accordion-header:hover {
            background: rgba(76, 154, 255, 0.15);
        }

        .accordion-icon {
            font-size: 12px;
            transition: transform 0.2s;

        .accordion-content {

        .menu-inner {

        .custom-file-label {

        .style-item {

        .style-label {

            flex: 1;

        .add-prop-btn {
            background: #2a5a3e;

            border-radius: 20px;

            cursor: pointer;
            color: white;

        }

        .no-selection {
            text-align: center;

            padding: 16px;

        }

        .graph-container {
            flex: 1;
            position: relative;
            background: #0a0e1a;

        .status-tip {
            position: fixed;

            border-radius: 16px;

            pointer-events: none;

        .context-menu {

            background: rgba(30, 35, 55, 0.98);

            border-radius: 12px;
            padding: 6px 0;
            min-width: 160px;
            z-index: 1000;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.4);

        }

        .context-menu-item {
            padding: 8px 16px;

            cursor: pointer;
            transition: 0.1s;
        }

        .context-menu-item:hover {
            background: #4c9aff;
            color: white;
        }

        .context-menu-divider {
            height: 1px;
            background: #2a3452;
            margin: 4px 0;
        }

        /* 悬停提示框样式 */
        .hover-tooltip {
            position: fixed;
            background: rgba(10, 14, 26, 0.95);
            backdrop-filter: blur(12px);
            border: 1px solid #4c9aff;
            border-radius: 12px;
            padding: 10px 14px;
            font-size: 12px;
            color: #e0e0e0;
            z-index: 2000;
            pointer-events: none;
            font-family: 'Segoe UI', monospace;
            max-width: 400px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.5);
            transition: opacity 0.15s ease;
            line-height: 1.5;
        }

        .hover-tooltip .tooltip-title {
            font-weight: bold;
            color: #4c9aff;
            margin-bottom: 6px;
            border-bottom: 1px solid #2a3452;
            padding-bottom: 4px;
        }

        .hover-tooltip .tooltip-props {
            margin-top: 4px;
        }

        .hover-tooltip .prop-row-tooltip {
            display: flex;
            margin: 4px 0;
            gap: 8px;
        }

        .hover-tooltip .prop-key-tooltip {
            color: #9aa9c1;
            min-width: 70px;
        }

        .hover-tooltip .prop-val-tooltip {
            color: #ffffff;
            word-break: break-word;
            flex: 1;
        }

        .hover-tooltip .no-props {

            font-style: italic;
        }

<body>
    <div class="tabs-header" id="tabsHeader">
        <button class="add-tab-btn" id="addTabBtn">+ 新建页签</button>
    </div>
    <div id="globalGraphContainer" class="graph-container"></div>

    <div class="accordion-menu" id="accordionMenu">
        <div class="accordion-item" id="accordionMain">
            <div class="accordion-header" data-target="main">
                <span>📁 主菜单</span>
                <span class="accordion-icon">▼</span>
            </div>
            <div class="accordion-content" id="contentMain">
                <div class="menu-inner">
                    <div>
                        <label class="custom-file-label" for="jsonInput">📎 追加JSON (当前页签)</label>
                        <input type="file" id="jsonInput" accept=".json">
                        <div id="fileName">未选择文件</div>
                    </div>
                    <div id="statusMsg" class="status-box">等待操作</div>
                    <button id="resetViewBtn">🔄 重置视图</button>
                    <button id="clearGraphBtn" style="background:#7a3e3e;">🗑️ 清空当前图谱</button>
                </div>
            </div>
        </div>
        <div class="accordion-item" id="accordionStyles">
            <div class="accordion-header" data-target="styles">
                <span>🎨 类型管理器</span>
                <span class="accordion-icon">▼</span>
            </div>
            <div class="accordion-content" id="contentStyles">
                <div class="menu-inner">
                    <div id="stylePanelContent" style="max-height: 300px; overflow-y: auto;">
                        <div class="no-styles">暂无类型数据</div>
                    </div>
                </div>
            </div>
        </div>
        <div class="accordion-item" id="accordionProps">
            <div class="accordion-header" data-target="props">
                <span>✏️ 属性修改</span>
                <span class="accordion-icon">▼</span>
            </div>
            <div class="accordion-content" id="contentProps">
                <div class="menu-inner" id="propsEditorContainer">
                    <div class="no-selection">点击顶点或关系以编辑属性</div>
                </div>
            </div>
        </div>
    </div>

    <div id="statusTip" class="status-tip" style="display: none;"></div>
    <div id="contextMenu" class="context-menu">
        <div class="context-menu-item" id="exportDataBtn">📤 导出数据 (JSON)</div>
        <div class="context-menu-divider"></div>
        <div class="context-menu-item" id="exportImageBtn">📸 导出图片 (PNG)</div>
    </div>

    <div id="hoverTooltip" class="hover-tooltip" style="display: none;"></div>

    <script>
        let tabs = [];
        let activeTabId = null;
        let nextTabId = 1;
        let currentSelectedElement = null;
        let pendingEdgeSource = null;

        const STORAGE_KEY = 'multitab_graphs_v16_statusborder';

        // 顶点填充样式映射 (label -> { background, border })
        let globalVertexFillStyles = new Map();
        // 顶点状态边框映射 (status -> borderColor)
        let globalStatusBorderStyles = new Map();
        let globalRelationStyles = new Map();

        function initDefaultStyles() {
            const defaultColors = ["#FF6B6B", "#4ECDC4", "#45B7D1", "#96CEB4", "#FFEAA7", "#DDA0DD", "#F4A261", "#2A9D8F", "#E9C46A", "#9B5DE5"];
            defaultColors.forEach((c, idx) => {
                globalVertexFillStyles.set(`类型${idx + 1}`, { background: c, border: shadeColor(c, -30) });
            });
            const defaultEdgeColors = ["#7F8C8D", "#95A5A6", "#BDC3C7", "#AAB7B8", "#839192", "#F39C12", "#E67E22"];
            defaultEdgeColors.forEach((c, idx) => {
                globalRelationStyles.set(`关系类型${idx + 1}`, c);
            });
            // 预置几种状态边框色
            globalStatusBorderStyles.set("正面", "#2ecc71");
            globalStatusBorderStyles.set("负面", "#e74c3c");
            globalStatusBorderStyles.set("中性", "#f39c12");
            globalStatusBorderStyles.set("示例", "#9b59b6");
            globalStatusBorderStyles.set("默认", "#95a5a6");
        }
        initDefaultStyles();

        function shadeColor(color, percent) {
            if (!color || !color.startsWith('#')) return '#666666';
            let R = parseInt(color.substring(1, 3), 16);
            let G = parseInt(color.substring(3, 5), 16);
            let B = parseInt(color.substring(5, 7), 16);
            R = Math.min(255, Math.max(0, R + (R * percent) / 100));
            G = Math.min(255, Math.max(0, G + (G * percent) / 100));
            B = Math.min(255, Math.max(0, B + (B * percent) / 100));
            return `rgb(${Math.round(R)}, ${Math.round(G)}, ${Math.round(B)})`;
        }

        // 获取顶点完整样式
        function getVertexStyleByType(typeLabel, statusValue) {
            if (!typeLabel) typeLabel = "默认";
            let fillConfig = globalVertexFillStyles.get(typeLabel);
            if (!fillConfig) {
                const hash = Math.abs(typeLabel.split('').reduce((a, b) => a + b.charCodeAt(0), 0));
                const colors = ["#FF6B6B", "#4ECDC4", "#45B7D1", "#96CEB4", "#FFEAA7", "#DDA0DD", "#F4A261", "#2A9D8F", "#E9C46A", "#9B5DE5"];
                const bg = colors[hash % colors.length];
                fillConfig = { background: bg, border: shadeColor(bg, -30) };
                globalVertexFillStyles.set(typeLabel, fillConfig);
            }
            let borderColor = fillConfig.border;
            if (statusValue && statusValue.trim() !== "") {
                const statusKey = statusValue.trim();
                let statusBorder = globalStatusBorderStyles.get(statusKey);
                if (!statusBorder) {
                    const hashStat = Math.abs(statusKey.split('').reduce((a, b) => a + b.charCodeAt(0), 0));
                    const candidates = ["#3498db", "#e67e22", "#1abc9c", "#e84393", "#f1c40f", "#2c3e50"];
                    statusBorder = candidates[hashStat % candidates.length];
                    globalStatusBorderStyles.set(statusKey, statusBorder);
                }
                borderColor = statusBorder;
            }
            return {
                color: {
                    background: fillConfig.background,
                    border: borderColor,
                    highlight: {
                        background: shadeColor(fillConfig.background, 20),
                        border: borderColor
                    }
                },
                shape: 'dot',
                size: 18,
                font: {
                    size: 11,
                    color: '#ffffff',
                    face: 'Segoe UI',
                    background: 'rgba(0,0,0,0.55)',
                    strokeWidth: 0.5,
                    align: 'center'
                },
                borderWidth: 2.5,
                shadow: true
            };
        }

        function applyVertexStyleToNode(tab, nodeId) {
            if (!tab.verticesDataSet) return;
            const node = tab.verticesDataSet.get(nodeId);
            if (node) {
                const style = getVertexStyleByType(node.typeLabel || '默认', node.status);
                tab.verticesDataSet.update({
                    id: nodeId,
                    color: style.color,
                    font: style.font,
                    size: style.size,
                    shape: style.shape,
                    borderWidth: style.borderWidth,
                    shadow: style.shadow
                });
            }
        }

        function getRelationStyleByType(typeLabel) {
            if (!typeLabel) typeLabel = "默认关系";
            let color = globalRelationStyles.get(typeLabel);
            if (!color) {
                const hash = Math.abs(typeLabel.split('').reduce((a, b) => a + b.charCodeAt(0), 0));
                const edgeColors = ["#7F8C8D", "#95A5A6", "#BDC3C7", "#AAB7B8", "#839192", "#F39C12", "#E67E22"];
                color = edgeColors[hash % edgeColors.length];
                globalRelationStyles.set(typeLabel, color);
            }
            return {
                width: 3,
                color: color,
                highlight: '#FFC857',
                font: {
                    size: 14,
                    align: 'middle',
                    color: '#fff',
                    strokeWidth: 0,
                    background: null
                },
                smooth: {
                    type: 'continuous',
                    roundness: 0.3
                },
                arrows: {
                    to: {
                        enabled: true,
                        scaleFactor: 0.7
                    }
                }
            };
        }

        function applyRelationStyleToEdge(tab, edgeId) {
            if (!tab.relationsDataSet) return;
            const edge = tab.relationsDataSet.get(edgeId);
            if (edge) {
                const style = getRelationStyleByType(edge.typeLabel || '默认关系');
                tab.relationsDataSet.update({
                    id: edgeId,
                    color: style.color,
                    width: style.width,
                    font: style.font,
                    smooth: style.smooth,
                    arrows: style.arrows
                });
            }
        }

        // 获取节点显示名称
        function getNodeDisplayName(tab, nodeId) {
            if (!tab.verticesDataSet) return nodeId;
            const node = tab.verticesDataSet.get(nodeId);
            if (node && node.displayName) return node.displayName;
            return nodeId;
        }

        // 生成悬停提示内容 - 顶点
        function getVertexTooltipContent(vertex, tab) {
            let title = `📍 ${vertex.displayName || vertex.id}`;
            if (vertex.typeLabel && vertex.typeLabel !== '默认') {
                title += ` [${vertex.typeLabel}]`;
            }
            if (vertex.status) {
                title += ` (${vertex.status})`;
            }
            
            let propsHtml = '';
            const propsObj = vertex.props || {};
            const propEntries = Object.entries(propsObj);
            if (propEntries.length === 0) {
                propsHtml = '<div class="no-props">📭 无属性数据</div>';
            } else {
                propsHtml = '<div class="tooltip-props">';
                for (const [key, val] of propEntries) {
                    propsHtml += `<div class="prop-row-tooltip">
                        <span class="prop-key-tooltip">${escapeHtml(key)}:</span>
                        <span class="prop-val-tooltip">${escapeHtml(String(val))}</span>
                    </div>`;
                }
                propsHtml += '</div>';
            }
            
            return `<div class="tooltip-title">${title}</div>${propsHtml}`;
        }

        // 生成悬停提示内容 - 关系（格式：起点 -> [关系类型] -> 终点）
        function getEdgeTooltipContent(edge, tab) {
            const fromName = getNodeDisplayName(tab, edge.from);
            const toName = getNodeDisplayName(tab, edge.to);
            const relationType = (edge.typeLabel && edge.typeLabel !== '默认关系') ? edge.typeLabel : '';
            
            let title;
            if (relationType) {
                title = `${fromName} → [${relationType}] → ${toName}`;
            } else {
                title = `${fromName} → ${toName}`;
            }
            
            let propsHtml = '';
            const propsObj = edge.props || {};
            const propEntries = Object.entries(propsObj);
            if (propEntries.length === 0) {
                propsHtml = '<div class="no-props">📭 无属性数据</div>';
            } else {
                propsHtml = '<div class="tooltip-props">';
                for (const [key, val] of propEntries) {
                    propsHtml += `<div class="prop-row-tooltip">
                        <span class="prop-key-tooltip">${escapeHtml(key)}:</span>
                        <span class="prop-val-tooltip">${escapeHtml(String(val))}</span>
                    </div>`;
                }
                propsHtml += '</div>';
            }
            
            return `<div class="tooltip-title">${title}</div>${propsHtml}`;
        }

        // 显示悬停提示
        function showHoverTooltip(content, mouseX, mouseY) {
            const tooltip = document.getElementById('hoverTooltip');
            tooltip.innerHTML = content;
            tooltip.style.display = 'block';
            
            // 计算位置，避免超出边界
            let left = mouseX + 15;
            let top = mouseY + 15;
            const rect = tooltip.getBoundingClientRect();
            if (left + rect.width > window.innerWidth) {
                left = mouseX - rect.width - 15;
            }
            if (top + rect.height > window.innerHeight) {
                top = mouseY - rect.height - 15;
            }
            tooltip.style.left = left + 'px';
            tooltip.style.top = top + 'px';
        }

        function hideHoverTooltip() {
            const tooltip = document.getElementById('hoverTooltip');
            tooltip.style.display = 'none';
            tooltip.innerHTML = '';
        }

        function refreshStylePanel() {
            const container = document.getElementById('stylePanelContent');
            if (!container) return;
            const activeTab = tabs.find(t => t.id === activeTabId);
            if (!activeTab || !activeTab.verticesDataSet) {
                container.innerHTML = '<div class="no-styles">暂无类型数据</div>';
                return;
            }

            const vertexTypes = new Set();
            const statusTypes = new Set();
            activeTab.verticesDataSet.get().forEach(v => {
                const type = v.typeLabel || '默认';
                vertexTypes.add(type);
                if (v.status && v.status.trim() !== "") {
                    statusTypes.add(v.status.trim());
                }
            });
            for (let st of globalStatusBorderStyles.keys()) {
                if (st && st.trim() !== "") statusTypes.add(st);
            }

            let html = '';
            if (vertexTypes.size > 0) {
                html += `<div class="section-title">🎨 顶点填充颜色 (Label)</div><div class="style-list">`;
                for (let type of vertexTypes) {
                    const config = globalVertexFillStyles.get(type) || { background: '#888888', border: '#666666' };
                    html += `<div class="style-item" data-style-type="vertex_fill" data-style-name="${escapeHtml(type)}">
                            <span class="style-label" title="${escapeHtml(type)}">${escapeHtml(type.length > 12 ? type.slice(0, 10) + '...' : type)}</span>
                            <input type="color" class="style-color-input" value="${config.background}" data-style-type="vertex_fill" data-style-name="${escapeHtml(type)}">
                         </div>`;
                }
                html += `</div>`;
            }
            if (statusTypes.size > 0) {
                if (vertexTypes.size > 0) html += `<div style="height:12px;"></div>`;
                html += `<div class="section-title">🖌️ 状态边框颜色 (Status)</div><div class="style-list">`;
                for (let stat of statusTypes) {
                    const borderColor = globalStatusBorderStyles.get(stat) || "#cccccc";
                    html += `<div class="style-item" data-style-type="status_border" data-style-name="${escapeHtml(stat)}">
                            <span class="style-label" title="${escapeHtml(stat)}">${escapeHtml(stat.length > 12 ? stat.slice(0, 10) + '...' : stat)}</span>
                            <input type="color" class="style-color-input" value="${borderColor}" data-style-type="status_border" data-style-name="${escapeHtml(stat)}">
                         </div>`;
                }
                html += `</div>`;
            }
            const relationTypes = new Set();
            activeTab.relationsDataSet.get().forEach(r => {
                const type = r.typeLabel || '默认关系';
                relationTypes.add(type);
            });
            if (relationTypes.size > 0) {
                html += `<div style="height:12px;"></div><div class="section-title">🔗 关系类型颜色</div><div class="style-list">`;
                for (let type of relationTypes) {
                    const color = globalRelationStyles.get(type) || '#95a5a6';
                    html += `<div class="style-item" data-style-type="relation" data-style-name="${escapeHtml(type)}">
                            <span class="style-label" title="${escapeHtml(type)}">${escapeHtml(type.length > 12 ? type.slice(0, 10) + '...' : type)}</span>
                            <input type="color" class="style-color-input" value="${color}" data-style-type="relation" data-style-name="${escapeHtml(type)}">
                         </div>`;
                }
                html += `</div>`;
            }
            if (html === '') html = '<div class="no-styles">暂无类型数据</div>';
            container.innerHTML = html;

            container.querySelectorAll('.style-color-input').forEach(input => {
                input.addEventListener('change', (e) => {
                    const styleType = input.dataset.styleType;
                    const styleName = input.dataset.styleName;
                    const newColor = input.value;
                    if (styleType === 'vertex_fill') {
                        let config = globalVertexFillStyles.get(styleName);
                        if (!config) config = { background: newColor, border: shadeColor(newColor, -30) };
                        else config.background = newColor;
                        config.border = shadeColor(newColor, -30);
                        globalVertexFillStyles.set(styleName, config);
                        tabs.forEach(tab => {
                            if (tab.verticesDataSet) {
                                const toUpdate = tab.verticesDataSet.get().filter(v => (v.typeLabel || '默认') === styleName);
                                toUpdate.forEach(v => applyVertexStyleToNode(tab, v.id));
                            }
                        });
                    } else if (styleType === 'status_border') {
                        globalStatusBorderStyles.set(styleName, newColor);
                        tabs.forEach(tab => {
                            if (tab.verticesDataSet) {
                                const toUpdate = tab.verticesDataSet.get().filter(v => v.status === styleName);
                                toUpdate.forEach(v => applyVertexStyleToNode(tab, v.id));
                            }
                        });
                    } else if (styleType === 'relation') {
                        globalRelationStyles.set(styleName, newColor);
                        tabs.forEach(tab => {
                            if (tab.relationsDataSet) {
                                const toUpdate = tab.relationsDataSet.get().filter(r => (r.typeLabel || '默认关系') === styleName);
                                toUpdate.forEach(r => applyRelationStyleToEdge(tab, r.id));
                            }
                        });
                    }
                    saveAllToLocal();
                    showTip(`样式 "${styleName}" 已更新`, 1000);
                });
            });
        }

        // 顶点编辑器
        function showVertexEditor(tab, vertex) {
            let html = `<div class="prop-editor">
                        <div class="prop-group"><div class="section-title" style="margin-bottom:8px;">基础属性</div>
                            <div class="prop-row"><div class="prop-key">ID</div><input class="prop-value" value="${escapeHtml(vertex.id)}" readonly></div>
                            <div class="prop-row"><div class="prop-key">名称</div><input class="prop-value" id="editDisplayName" value="${escapeHtml(vertex.displayName || vertex.id)}"></div>
                            <div class="prop-row"><div class="prop-key">类型(label)</div><input class="prop-value" id="editTypeLabel" value="${escapeHtml(vertex.typeLabel || '默认')}"></div>
                            <div class="prop-row"><div class="prop-key">状态(status)</div><input class="prop-value" id="editStatus" value="${escapeHtml(vertex.status || '默认')}"></div>
                        </div>
                        <div class="prop-group"><div class="section-title" style="margin-bottom:8px;">属性 <button class="add-prop-btn" id="addPropBtn">+ 添加</button></div>`;
            const propsObj = vertex.props || {};
            for (const [k, v] of Object.entries(propsObj)) {
                html += `<div class="prop-row" data-prop-key="${k}">
                        <input type="text" class="prop-value" style="width:70px;" value="${escapeHtml(k)}" data-prop-type="key">
                        <input type="text" class="prop-value" value="${escapeHtml(String(v))}" data-prop-type="value">
                        <button class="delete-prop-btn" data-prop-key="${k}">删</button>
                     </div>`;
            }
            html += `</div>
                 <button class="delete-vertex-btn" id="deleteVertexBtn" style="width:100%; margin-top:8px;">🗑️ 删除此顶点及所有关联关系</button>
                 </div>`;
            openPropsPanelAndShowEditor(html);

            document.getElementById('editDisplayName')?.addEventListener('change', (e) => {
                const newName = e.target.value.trim();
                if (newName) {
                    tab.verticesDataSet.update({ id: vertex.id, displayName: newName, label: newName });
                    saveAllToLocal(); refreshStylePanel();
                    const updated = tab.verticesDataSet.get(vertex.id);
                    if (updated) showVertexEditor(tab, updated);
                }
            });
            document.getElementById('editTypeLabel')?.addEventListener('change', (e) => {
                const newType = e.target.value.trim();
                if (newType) {
                    tab.verticesDataSet.update({ id: vertex.id, typeLabel: newType });
                    applyVertexStyleToNode(tab, vertex.id);
                    saveAllToLocal(); refreshStylePanel();
                    const updated = tab.verticesDataSet.get(vertex.id);
                    if (updated) showVertexEditor(tab, updated);
                }
            });
            document.getElementById('editStatus')?.addEventListener('change', (e) => {
                const newStatus = e.target.value.trim();
                const update = { id: vertex.id, status: newStatus === "" ? undefined : newStatus };
                tab.verticesDataSet.update(update);
                applyVertexStyleToNode(tab, vertex.id);
                saveAllToLocal(); refreshStylePanel();
                const updated = tab.verticesDataSet.get(vertex.id);
                if (updated) showVertexEditor(tab, updated);
            });
            document.getElementById('deleteVertexBtn')?.addEventListener('click', () => {
                if (confirm(`确定要删除顶点 "${vertex.displayName || vertex.id}" 及其所有关联关系吗？`)) deleteVertexAndRelations(tab, vertex.id);
            });
            const addBtn = document.getElementById('addPropBtn');
            if (addBtn) addBtn.onclick = () => {
                const currentProps = { ...(tab.verticesDataSet.get(vertex.id).props || {}) };
                currentProps[`新属性_${Date.now()}`] = "";
                tab.verticesDataSet.update({ id: vertex.id, props: currentProps });
                saveAllToLocal();
                showVertexEditor(tab, tab.verticesDataSet.get(vertex.id));
            };
            bindPropEventsInEditor(tab, vertex.id, 'vertex');
        }

                            <div class="prop-row"><div class="prop-key">起点</div><input class="prop-value" value="${escapeHtml(fromName)}" readonly></div>
                            <div class="prop-row"><div class="prop-key">终点</div><input class="prop-value" value="${escapeHtml(toName)}" readonly></div>
                            <div class="prop-row"><div class="prop-key">类型</div><input class="prop-value" id="editRelationType" value="${escapeHtml(relation.typeLabel || '默认关系')}"></div>
                        </div>
                        <div class="prop-group"><div class="section-title" style="margin-bottom:8px;">属性 <button class="add-prop-btn" id="addPropBtn">+ 添加</button></div>`;
            const propsObj = relation.props || {};
            for (const [k, v] of Object.entries(propsObj)) {
                html += `<div class="prop-row" data-prop-key="${k}">
                        <input type="text" class="prop-value" style="width:70px;" value="${escapeHtml(k)}" data-prop-type="key">
                        <input type="text" class="prop-value" value="${escapeHtml(String(v))}" data-prop-type="value">

            html += `</div>
                 <button class="delete-relation-btn" id="deleteRelationBtn" style="width:100%; margin-top:8px;">🗑️ 删除此关系</button>
                 </div>`;
            openPropsPanelAndShowEditor(html);
            document.getElementById('editRelationType')?.addEventListener('change', (e) => {
                const newType = e.target.value.trim();
                if (newType) {
                    tab.relationsDataSet.update({ id: relation.id, typeLabel: newType, label: newType === '默认关系' ? '' : newType });
                    applyRelationStyleToEdge(tab, relation.id);
                    saveAllToLocal(); refreshStylePanel();
                    const updated = tab.relationsDataSet.get(relation.id);
                    if (updated) showRelationEditor(tab, updated);

            document.getElementById('deleteRelationBtn')?.addEventListener('click', () => {
                if (confirm("确定要删除此关系吗？")) deleteRelation(tab, relation.id);

            if (addBtn) addBtn.onclick = () => {

                currentProps[`新属性_${Date.now()}`] = "";

        function bindPropEventsInEditor(tab, id, type) {
            const container = document.getElementById('propsEditorContainer');
            if (!container) return;
            container.querySelectorAll('.prop-row').forEach(row => {
                const keyInput = row.querySelector('input[data-prop-type="key"]');
                const valInput = row.querySelector('input[data-prop-type="value"]');
                const delBtn = row.querySelector('.delete-prop-btn');
                if (keyInput) {
                    keyInput.addEventListener('change', () => {
                        const oldKey = delBtn?.dataset.propKey;
                        const newKey = keyInput.value.trim();
                        if (!newKey) return;
                        const currentProps = { ...(type === 'vertex' ? tab.verticesDataSet.get(id).props : tab.relationsDataSet.get(id).props) };
                        const val = currentProps[oldKey];
                        delete currentProps[oldKey];
                        currentProps[newKey] = val;
                        if (type === 'vertex') tab.verticesDataSet.update({ id, props: currentProps });
                        else tab.relationsDataSet.update({ id, props: currentProps });
                        saveAllToLocal();
                        if (type === 'vertex') showVertexEditor(tab, tab.verticesDataSet.get(id));
                        else showRelationEditor(tab, tab.relationsDataSet.get(id));
                    });
                }
                if (valInput) {
                    valInput.addEventListener('change', () => {
                        const key = delBtn?.dataset.propKey;
                        if (key) {
                            const currentProps = { ...(type === 'vertex' ? tab.verticesDataSet.get(id).props : tab.relationsDataSet.get(id).props) };
                            currentProps[key] = valInput.value;
                            if (type === 'vertex') tab.verticesDataSet.update({ id, props: currentProps });
                            else tab.relationsDataSet.update({ id, props: currentProps });
                            saveAllToLocal();
                        }
                    });
                }
                if (delBtn) {
                    delBtn.onclick = () => {
                        const key = delBtn.dataset.propKey;
                        const currentProps = { ...(type === 'vertex' ? tab.verticesDataSet.get(id).props : tab.relationsDataSet.get(id).props) };
                        delete currentProps[key];
                        if (type === 'vertex') tab.verticesDataSet.update({ id, props: currentProps });
                        else tab.relationsDataSet.update({ id, props: currentProps });
                        saveAllToLocal();
                        if (type === 'vertex') showVertexEditor(tab, tab.verticesDataSet.get(id));
                        else showRelationEditor(tab, tab.relationsDataSet.get(id));
                    };
                }
            });
        }

        function createVertexAtPosition(tab, x, y) {
            if (!tab.verticesDataSet) return null;
            const baseId = `顶点_${Date.now().toString().slice(-6)}_${Math.random().toString(36).substr(2, 4)}`;
            const baseName = baseId;
            const typeLabel = "默认";
            const style = getVertexStyleByType(typeLabel, "");
            const newVertex = {
                id: baseId,
                label: baseName,
                displayName: baseName,
                originalName: baseId,
                typeLabel: typeLabel,
                status: undefined,
                props: {},
                x: x, y: y,
                color: style.color,
                font: style.font,
                size: style.size,
                shape: style.shape,
                borderWidth: style.borderWidth,
                shadow: style.shadow
            };
            tab.verticesDataSet.add(newVertex);
            saveAllToLocal(); refreshStylePanel();
            showTip(`已创建顶点: ${baseName}`);
            setTimeout(() => { const v = tab.verticesDataSet.get(baseId); if (v) showVertexEditor(tab, v); }, 50);
            return baseId;
        }

        function createRelation(tab, fromId, toId) {
            if (!tab.verticesDataSet || !tab.relationsDataSet) return null;
            if (fromId === toId) {
                showTip("不能创建指向自己的关系");
                return null;
            }
            const existing = tab.relationsDataSet.get().some(r => r.from === fromId && r.to === toId);
            if (existing) {
                showTip("关系已存在");
                return null;
            }
            const relId = `${fromId}→${toId}_${Date.now()}_${Math.random().toString(36).substr(2, 4)}`;
            const style = getRelationStyleByType("默认关系");
            const newRelation = {
                id: relId,
                from: fromId,
                to: toId,
                typeLabel: "默认关系",
                label: "",
                props: {},
                color: style.color,
                width: style.width,
                font: style.font,
                smooth: style.smooth,
                arrows: style.arrows
            };
            tab.relationsDataSet.add(newRelation);
            saveAllToLocal();
            refreshStylePanel();
            const fromName = getNodeDisplayName(tab, fromId);
            const toName = getNodeDisplayName(tab, toId);
            showTip(`已创建关系: ${fromName} → ${toName}`);
            setTimeout(() => {
                const r = tab.relationsDataSet.get(relId);
                if (r) {
                    currentSelectedElement = { type: 'relation', id: relId, tabId: tab.id };
                    showRelationEditor(tab, r);
                }
            }, 50);
            return relId;
        }

        function saveVertexPositions(tab) {
            if (!tab.network || !tab.verticesDataSet) return;
            try {
                const positions = tab.network.getPositions();
                const vertices = tab.verticesDataSet.get();
                const updates = [];
                for (let v of vertices) {
                    const pos = positions[v.id];
                    if (pos && (pos.x !== undefined && pos.y !== undefined) && (v.x !== pos.x || v.y !== pos.y)) {
                        updates.push({ id: v.id, x: pos.x, y: pos.y });
                    }
                }
                if (updates.length) tab.verticesDataSet.update(updates);
            } catch (e) { }
        }

        function restoreVertexPositions(tab) {
            if (!tab.network || !tab.verticesDataSet) return;
            const withPos = tab.verticesDataSet.get().filter(v => v.x !== undefined && v.y !== undefined);
            if (!withPos.length) return;
            const positions = {};
            withPos.forEach(v => { positions[v.id] = { x: v.x, y: v.y }; });
            tab.network.moveTo({ positions, animation: false });
            setTimeout(() => {
                withPos.forEach(v => tab.verticesDataSet.update({ id: v.id, fixed: false }));
            }, 300);
        }

        function createContainer(tabId) {
            const div = document.createElement('div');
            div.id = `graph-${tabId}`;
            div.style.cssText = 'width:100%;height:100%;position:absolute;top:0;left:0;background:#0a0e1a;';
            document.getElementById('globalGraphContainer').appendChild(div);
            return div;
        }

        function initGraph(tab, verticesArray, relationsArray) {
            const container = tab.container;
            const processedVertices = (verticesArray || []).map(v => ({
                ...v,
                label: v.displayName || v.id
            }));
            const verticesDs = new vis.DataSet(processedVertices);
            const relationsDs = new vis.DataSet(relationsArray || []);
            const options = {
                nodes: {
                    shape: 'dot',
                    size: 10,
                    font: {
                        size: 18,
                        color: '#fff',
                        align: 'center',
                        background: 'rgba(0,0,0,0.5)'
                    },
                    borderWidth: 2
                },
                edges: {
                    width: 3,
                    arrows: {
                        to: true
                    },
                    smooth: true,
                    font: {
                        size: 14,
                        align: 'middle',
                        color: '#fff',
                        strokeWidth: 0,
                        background: null
                    }
                },
                physics: {
                    enabled: true,
                    stabilization: { fit: true, iterations: 100 },
                    timestep: 0.1,
                    solver: 'forceAtlas2Based',
                    forceAtlas2Based: {
                        gravitationalConstant: -100,
                        springLength: 100,
                        springConstant: 0.05,
                        dampingConstant: 0.5
                    }
                },
                interaction: {
                    dragNodes: true,
                    dragView: true,
                    zoomView: true,
                    hover: true
                }
            };
            const network = new vis.Network(container, { nodes: verticesDs, edges: relationsDs }, options);

            // 应用现有顶点样式
            verticesDs.get().forEach(v => applyVertexStyleToNode(tab, v.id));
            relationsDs.get().forEach(r => applyRelationStyleToEdge(tab, r.id));

            // 监听添加事件
            verticesDs.on('add', (event, properties) => {
                properties.items.forEach(nodeId => applyVertexStyleToNode(tab, nodeId));
            });
            relationsDs.on('add', (event, properties) => {
                properties.items.forEach(edgeId => applyRelationStyleToEdge(tab, edgeId));
            });

            network.on("dragEnd", () => {
                saveVertexPositions(tab);
                saveAllToLocal();
            });
            network.once("stabilizationIterationsDone", () => {
                restoreVertexPositions(tab);
                saveAllToLocal();
            });

            // 悬停显示属性 - 顶点
            network.on("hoverNode", (params) => {
                const node = verticesDs.get(params.node);
                if (node) {
                    const content = getVertexTooltipContent(node, tab);
                    showHoverTooltip(content, params.event.clientX, params.event.clientY);
                }
            });
            
            // 悬停显示属性 - 边（显示节点名称）
            network.on("hoverEdge", (params) => {
                const edge = relationsDs.get(params.edge);
                if (edge) {
                    const content = getEdgeTooltipContent(edge, tab);
                    showHoverTooltip(content, params.event.clientX, params.event.clientY);
                }
            });
            
            // 离开顶点时隐藏提示
            network.on("blurNode", () => {
                hideHoverTooltip();
            });
            
            // 离开边时隐藏提示
            network.on("blurEdge", () => {
                hideHoverTooltip();
            });

            // 双击事件
            network.on("doubleClick", (params) => {
                if (params.nodes.length === 0 && params.edges.length === 0) {
                    const pointer = params.pointer.canvas;
                    createVertexAtPosition(tab, pointer.x, pointer.y);
                    return;
                }
                if (params.nodes.length > 0 && pendingEdgeSource === null) {
                    pendingEdgeSource = params.nodes[0];
                    document.body.style.cursor = 'crosshair';
                    const nodeName = tab.verticesDataSet.get(pendingEdgeSource)?.displayName || pendingEdgeSource;
                    showTip(`🔗 已选中「${nodeName}」，请单击目标顶点创建关系 (按ESC取消)`, 3000);
                }
            });

            // 单击事件
            network.on("click", (params) => {
                if (pendingEdgeSource !== null && params.nodes.length > 0) {
                    const targetId = params.nodes[0];
                    if (targetId !== pendingEdgeSource) {
                        createRelation(tab, pendingEdgeSource, targetId);
                    } else {
                        showTip("不能创建指向自己的关系", 1500);
                    }
                    pendingEdgeSource = null;
                    document.body.style.cursor = 'default';
                    return;
                }
                if (params.nodes.length) {
                    const v = verticesDs.get(params.nodes[0]);
                    if (v) {
                        currentSelectedElement = { type: 'vertex', id: v.id, tabId: tab.id };
                        showVertexEditor(tab, v);
                    }
                } else if (params.edges.length) {
                    const r = relationsDs.get(params.edges[0]);
                    if (r) {
                        currentSelectedElement = { type: 'relation', id: r.id, tabId: tab.id };
                        showRelationEditor(tab, r);
                    }
                } else {
                    currentSelectedElement = null;
                    openPropsPanelAndShowEditor('<div class="no-selection">点击顶点或关系以编辑属性</div>');
                }
            });

            // ESC取消关系创建
            const escHandler = (e) => {
                if (e.key === 'Escape' && pendingEdgeSource !== null) {
                    pendingEdgeSource = null;
                    document.body.style.cursor = 'default';
                    showTip("已取消关系创建", 1000);
                }
            };
            document.addEventListener('keydown', escHandler);

            tab.verticesDataSet = verticesDs;
            tab.relationsDataSet = relationsDs;
            tab.network = network;
            return network;
        }

        function appendJSON(tab, jsonData, fileName) {
            if (!tab.verticesDataSet) return;
            const newVertices = jsonData.nodes || [];
            const newRelations = jsonData.edges || [];
            const existNames = new Set(tab.verticesDataSet.get().map(v => v.id));
            const verticesToAdd = [];
            for (const raw of newVertices) {
                const vid = raw.id;
                if (!vid || existNames.has(vid)) continue;
                const displayName = raw.name || vid;
                const typeLabel = raw.label || '默认';
                const statusVal = raw.status && raw.status.trim() !== "" ? raw.status.trim() : undefined;
                const style = getVertexStyleByType(typeLabel, statusVal);
                verticesToAdd.push({
                    id: vid,
                    label: displayName,
                    displayName: displayName,
                    originalName: vid,
                    typeLabel: typeLabel,
                    status: statusVal,
                    props: raw.props || {},
                    x: undefined, y: undefined,
                    color: style.color,
                    font: style.font,
                    size: style.size,
                    shape: style.shape,
                    borderWidth: style.borderWidth,
                    shadow: style.shadow
                });
                existNames.add(vid);
            }
            const relationsToAdd = [];
            const existRels = new Set(tab.relationsDataSet.get().map(r => `${r.from}|${r.to}|${r.typeLabel || ''}`));
            for (const raw of newRelations) {
                if (!raw.from || !raw.to) continue;
                if (!existNames.has(raw.from) || !existNames.has(raw.to)) continue;
                const relType = raw.label || '默认关系';
                const key = `${raw.from}|${raw.to}|${relType}`;
                if (existRels.has(key)) continue;
                const style = getRelationStyleByType(relType);
                relationsToAdd.push({
                    id: `${raw.from}->${raw.to}_${Date.now()}_${Math.random()}`,
                    from: raw.from, to: raw.to,
                    typeLabel: relType,
                    label: relType === '默认关系' ? '' : relType,
                    props: raw.props || {},
                    color: style.color, width: style.width, font: style.font, smooth: style.smooth, arrows: style.arrows
                });
                existRels.add(key);
            }
            if (verticesToAdd.length) tab.verticesDataSet.add(verticesToAdd);
            if (relationsToAdd.length) tab.relationsDataSet.add(relationsToAdd);
            if (tab.network) setTimeout(() => tab.network.fit({ animation: true }), 200);
            document.getElementById('statusMsg').innerHTML = `✅ 追加 ${verticesToAdd.length}顶点,${relationsToAdd.length}关系 (支持status边框)`;
            document.getElementById('fileName').innerText = fileName;
            saveAllToLocal();
            refreshStylePanel();
        }

        function deleteVertexAndRelations(tab, vertexId) {
            if (!tab.verticesDataSet) return;
            const related = tab.relationsDataSet.get().filter(r => r.from === vertexId || r.to === vertexId);
            if (related.length) tab.relationsDataSet.remove(related.map(r => r.id));
            tab.verticesDataSet.remove(vertexId);
            saveAllToLocal();
            refreshStylePanel();
            if (currentSelectedElement && currentSelectedElement.id === vertexId) {
                currentSelectedElement = null;
                openPropsPanelAndShowEditor('<div class="no-selection">点击顶点或关系以编辑属性</div>');
            }
            showTip(`已删除顶点及 ${related.length} 条关联关系`);
        }

        function deleteRelation(tab, relationId) {
            if (!tab.relationsDataSet) return;
            tab.relationsDataSet.remove(relationId);
            saveAllToLocal();
            refreshStylePanel();
            if (currentSelectedElement && currentSelectedElement.id === relationId) {
                currentSelectedElement = null;
                openPropsPanelAndShowEditor('<div class="no-selection">点击顶点或关系以编辑属性</div>');
            }
            showTip("已删除关系");
        }

        function clearTab(tab) {
            if (!tab.verticesDataSet) return;
            const vids = tab.verticesDataSet.get().map(v => v.id);
            const rids = tab.relationsDataSet.get().map(r => r.id);
            if (vids.length) tab.verticesDataSet.remove(vids);
            if (rids.length) tab.relationsDataSet.remove(rids);
            if (tab.network) tab.network.fit({ animation: true });
            saveAllToLocal();
            currentSelectedElement = null;
            openPropsPanelAndShowEditor('<div class="no-selection">点击顶点或关系以编辑属性</div>');
            refreshStylePanel();
            showTip("已清空当前图谱");
        }

        function switchTab(tabId) {
            if (activeTabId === tabId) return;
            pendingEdgeSource = null;
            document.body.style.cursor = 'default';
            hideHoverTooltip();
            const old = tabs.find(t => t.id === activeTabId);
            if (old && old.network) saveVertexPositions(old);
            tabs.forEach(t => {
                if (t.container) t.container.style.display = 'none';
            });
            const target = tabs.find(t => t.id === tabId);
            if (target) {
                target.container.style.display = 'block';
                activeTabId = tabId;
                document.querySelectorAll('.tab-item').forEach(el => el.classList.remove('active'));
                const tabBtn = document.querySelector(`.tab-item[data-tab-id='${tabId}']`);
                if (tabBtn) tabBtn.classList.add('active');
                if (target.network) setTimeout(() => target.network.fit({ animation: true, duration: 200 }), 100);
                currentSelectedElement = null;
                openPropsPanelAndShowEditor('<div class="no-selection">点击顶点或关系以编辑属性</div>');
                refreshStylePanel();
                saveAllToLocal();
            }
        }

        function createNewTab(name = null) {
            const id = nextTabId++;
            const tabName = name || `图谱${id}`;
            const container = createContainer(id);
            const tab = { id, name: tabName, container, verticesDataSet: null, relationsDataSet: null, network: null };
            tabs.push(tab);
            initGraph(tab, [], []);
            addTabButton(id, tabName);
            switchTab(id);
            saveAllToLocal();
            refreshStylePanel();
            return tab;
        }

        function addTabButton(tabId, tabName) {
            const header = document.getElementById('tabsHeader');
            const addBtn = document.getElementById('addTabBtn');
            const div = document.createElement('div');
            div.className = 'tab-item';
            div.setAttribute('data-tab-id', tabId);

            const nameSpan = document.createElement('span');
            nameSpan.className = 'tab-name';
            nameSpan.innerText = tabName;

            const closeSpan = document.createElement('span');
            closeSpan.className = 'close-tab';
            closeSpan.innerText = '✕';
            closeSpan.setAttribute('data-tab-id', tabId);

            div.appendChild(nameSpan);
            div.appendChild(closeSpan);

            // 修复：双击编辑页签名 - 修复不立即显示的问题
            nameSpan.addEventListener('dblclick', (e) => {
                e.stopPropagation();
                const oldName = nameSpan.innerText;
                const input = document.createElement('input');
                input.type = 'text';
                input.value = oldName;
                input.className = 'tab-name-input';
                
                // 隐藏原文字，显示输入框
                nameSpan.style.display = 'none';
                nameSpan.parentNode.insertBefore(input, nameSpan);
                input.focus();

                const saveRename = () => {
                    let newName = input.value.trim();
                    if (!newName) newName = oldName;
                    if (newName !== oldName) {
                        renameTab(tabId, newName);
                    } else {
                        // 名称没变，恢复原文字
                        nameSpan.innerText = oldName;
                    }
                    // 确保显示文字，移除输入框
                    nameSpan.style.display = 'inline-block';
                    input.remove();
                };
                
                input.addEventListener('blur', saveRename);
                input.addEventListener('keypress', (e) => { 
                    if (e.key === 'Enter') saveRename(); 
                });
            });

            div.addEventListener('click', (e) => {
                if (e.target.classList.contains('close-tab')) {
                    e.stopPropagation();
                    closeTab(tabId);
                } else if (!e.target.classList.contains('tab-name-input')) {
                    switchTab(tabId);
                }
            });
            header.insertBefore(div, addBtn);
        }

        function closeTab(tabId) {
            const tab = tabs.find(t => t.id === tabId);
            if (!tab) return;

            if (tab.verticesDataSet && (tab.verticesDataSet.length > 0 || tab.relationsDataSet.length > 0)) {
                showTip(`页签 "${tab.name}" 包含数据，请先清空后再关闭`, 2500);
                return;
            }

            if (tabs.length <= 1) {
                showTip("至少保留一个页签", 1500);
                return;
            }

            const idx = tabs.findIndex(t => t.id === tabId);
            if (idx === -1) return;

            if (tab.network) {
                tab.network.destroy();
                tab.network = null;
            }
            if (tab.container) tab.container.remove();
            tabs.splice(idx, 1);
            document.querySelector(`.tab-item[data-tab-id='${tabId}']`).remove();
            if (activeTabId === tabId) switchTab(tabs[0].id);
            saveAllToLocal();
            refreshStylePanel();
            showTip(`页签 "${tab.name}" 已关闭`, 1000);
        }

        function renameTab(tabId, newName) {
            const tab = tabs.find(t => t.id === tabId);
            if (!tab) return;
            tab.name = newName;
            const tabElement = document.querySelector(`.tab-item[data-tab-id='${tabId}'] .tab-name`);
            if (tabElement) {
                tabElement.innerText = newName;
            }
            saveAllToLocal();
            showTip(`页签已改名为: ${newName}`, 1000);
        }

        function saveAllToLocal() {
            const data = tabs.map(tab => {
                const vertices = tab.verticesDataSet ? tab.verticesDataSet.get() : [];
                const relations = tab.relationsDataSet ? tab.relationsDataSet.get() : [];
                return { id: tab.id, name: tab.name, vertices, relations };
            });
            const styleData = {
                vertexFillStyles: Array.from(globalVertexFillStyles.entries()),
                statusBorderStyles: Array.from(globalStatusBorderStyles.entries()),
                relationStyles: Array.from(globalRelationStyles.entries())
            };
            localStorage.setItem(STORAGE_KEY, JSON.stringify({ tabs: data, styles: styleData, activeTabId }));
        }

        function loadFromLocal() {
            const raw = localStorage.getItem(STORAGE_KEY);
            if (!raw) { createNewTab("默认图谱"); refreshStylePanel(); return; }
            try {
                const saved = JSON.parse(raw);
                if (saved.styles) {
                    globalVertexFillStyles.clear();
                    globalStatusBorderStyles.clear();
                    globalRelationStyles.clear();
                    saved.styles.vertexFillStyles?.forEach(([k, v]) => globalVertexFillStyles.set(k, v));
                    saved.styles.statusBorderStyles?.forEach(([k, v]) => globalStatusBorderStyles.set(k, v));
                    saved.styles.relationStyles?.forEach(([k, v]) => globalRelationStyles.set(k, v));
                }
                const savedTabs = saved.tabs || [];
                const container = document.getElementById('globalGraphContainer');
                while (container.firstChild) container.removeChild(container.firstChild);
                document.querySelectorAll('.tab-item:not(#addTabBtn)').forEach(el => el.remove());
                tabs = [];
                nextTabId = Math.max(...savedTabs.map(t => t.id), 0) + 1;
                for (const s of savedTabs) {
                    const containerDiv = createContainer(s.id);
                    const tab = { id: s.id, name: s.name, container: containerDiv, verticesDataSet: null, relationsDataSet: null, network: null };
                    tabs.push(tab);
                    initGraph(tab, s.vertices || [], s.relations || []);
                    addTabButton(s.id, s.name);
                }
                const savedActive = saved.activeTabId;
                if (savedActive && tabs.find(t => t.id == savedActive)) switchTab(parseInt(savedActive));
                else if (tabs.length) switchTab(tabs[0].id);
                refreshStylePanel();
            } catch (e) { createNewTab("恢复图谱"); refreshStylePanel(); }
        }

        function exportCurrentTabData() {
            const tab = tabs.find(t => t.id === activeTabId);
            if (!tab || !tab.verticesDataSet) {
                showTip("没有可导出的数据");
                return;
            }
            const vertices = tab.verticesDataSet.get().map(v => ({
                id: v.id,
                name: v.displayName || v.id,
                label: v.typeLabel || "默认",
                status: v.status || "",
                props: v.props || {}
            }));
            const edges = tab.relationsDataSet.get().map(r => ({
                from: r.from, to: r.to, label: r.typeLabel || "默认关系", props: r.props || {}
            }));
            const jsonStr = JSON.stringify({ nodes: vertices, edges }, null, 2);
            const blob = new Blob([jsonStr], { type: 'application/json' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `graph_export_${tab.name}_${Date.now()}.json`;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
            showTip(`已导出 ${vertices.length} 个顶点, ${edges.length} 条关系 (含status字段)`);
        }

        async function exportCurrentCanvasAsImage() {
            const tab = tabs.find(t => t.id === activeTabId);
            if (!tab || !tab.container) {
                showTip("没有可导出的画布");
                return;
            }
            const menu = document.getElementById('accordionMenu');
            const tip = document.getElementById('statusTip');
            const originalMenuDisplay = menu.style.display;
            const originalTipOpacity = tip.style.opacity;
            menu.style.display = 'none';
            tip.style.opacity = '0';
            try {
                const canvas = await html2canvas(tab.container, { backgroundColor: '#0a0e1a', scale: 2 });
                const link = document.createElement('a');
                link.download = `graph_screenshot_${tab.name}_${Date.now()}.png`;
                link.href = canvas.toDataURL();
                link.click();
                showTip("图片已导出");
            } catch (err) {
                showTip("导出图片失败");
            } finally {
                menu.style.display = originalMenuDisplay;
                tip.style.opacity = originalTipOpacity;
            }
        }

        function openPropsPanelAndShowEditor(htmlContent) {
            const propsContent = document.getElementById('contentProps');
            const editorContainer = document.getElementById('propsEditorContainer');
            if (!propsContent || !editorContainer) return;
            if (!propsContent.classList.contains('open')) {
                propsContent.classList.add('open');
            }
            editorContainer.innerHTML = htmlContent;
        }

        function showTip(msg, duration = 2000) {
            const tip = document.getElementById('statusTip');
            tip.innerText = msg;
            tip.style.display = 'block';
            setTimeout(() => { tip.style.display = 'none'; }, duration);
        }

        function escapeHtml(str) { return String(str).replace(/[&<>]/g, function (m) { if (m === '&') return '&amp;'; if (m === '<') return '&lt;'; return '&gt;'; }); }

        function initAccordion() {
            const headers = document.querySelectorAll('.accordion-header');
            headers.forEach(header => {
                header.addEventListener('click', () => {
                    const targetId = header.dataset.target;
                    const content = document.getElementById(`content${targetId.charAt(0).toUpperCase() + targetId.slice(1)}`);
                    const isOpen = content.classList.contains('open');
                    document.querySelectorAll('.accordion-content').forEach(c => c.classList.remove('open'));
                    if (!isOpen) content.classList.add('open');
                });
            });
            document.getElementById('contentMain').classList.add('open');
        }

        document.getElementById('jsonInput').addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = ev => {
                try {
                    const json = JSON.parse(ev.target.result);
                    const tab = tabs.find(t => t.id === activeTabId);
                    if (tab) appendJSON(tab, json, file.name);
                } catch (err) { document.getElementById('statusMsg').innerHTML = `❌ ${err.message}`; }
            };
            reader.readAsText(file);
            e.target.value = '';
        });
        document.getElementById('resetViewBtn').addEventListener('click', () => {
            const tab = tabs.find(t => t.id === activeTabId);
            if (tab && tab.network) tab.network.fit({ animation: true, duration: 300 });
        });
        document.getElementById('clearGraphBtn').addEventListener('click', () => {
            if (confirm('清空当前页签所有数据？')) {
                const tab = tabs.find(t => t.id === activeTabId);
                if (tab) clearTab(tab);
            }
        });
        document.getElementById('addTabBtn').addEventListener('click', () => createNewTab(`图谱${tabs.length + 1}`));
        document.getElementById('exportDataBtn').addEventListener('click', () => {
            exportCurrentTabData();
            document.getElementById('contextMenu').style.display = 'none';
        });
        document.getElementById('exportImageBtn').addEventListener('click', () => {
            exportCurrentCanvasAsImage();
            document.getElementById('contextMenu').style.display = 'none';
        });
        document.addEventListener('contextmenu', (e) => {
            e.preventDefault();
            const menu = document.getElementById('contextMenu');
            menu.style.display = 'block';
            menu.style.left = e.clientX + 'px';
            menu.style.top = e.clientY + 'px';
            const closeMenu = () => {
                menu.style.display = 'none';
                document.removeEventListener('click', closeMenu);
            };
            setTimeout(() => { document.addEventListener('click', closeMenu); }, 10);
        });

        initAccordion();
        loadFromLocal();
    </script>
</body>

</html>
