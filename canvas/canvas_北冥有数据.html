            function normalize(field, range) {
                const tab = tabs.find(t => t.id === activeTabId);
                const data = dfToArray(tab.df);
                const values = data.map(r => Number(r[field])).filter(v => !isNaN(v));
                const minVal = Math.min(...values),
                    maxVal = Math.max(...values);
                const newData = data.map(row => {
                    const newRow = { ...row };
                    const val = Number(row[field]);
                    if (isNaN(val)) newRow[field + '_归一化'] = null;
                    else if (range === '0to1') newRow[field + '_归一化'] = (val - minVal) / (maxVal - minVal);
                    else if (range === '-1to1') newRow[field + '_归一化'] = 2 * (val - minVal) / (maxVal - minVal) -
                        1;
                    return newRow;
                });
                addTab(tab.name + '归一化', newData);
            }

            function standardize(field) {
                const tab = tabs.find(t => t.id === activeTabId);
                const data = dfToArray(tab.df);
                const values = data.map(r => Number(r[field])).filter(v => !isNaN(v));
                const mean = values.reduce((a, b) => a + b, 0) / values.length;
                const variance = values.reduce((acc, v) => acc + (v - mean) ** 2, 0) / (values.length - 1 || 1);
                const std = Math.sqrt(variance);
                const newData = data.map(row => {
                    const newRow = { ...row };
                    const val = Number(row[field]);
                    newRow[field + '_标准化'] = isNaN(val) ? null : (val - mean) / std;
                    return newRow;
                });
                addTab(tab.name + '标准化', newData);
            }

            function normalizeSum(field) {
                const tab = tabs.find(t => t.id === activeTabId);
                const data = dfToArray(tab.df);
                const values = data.map(r => Number(r[field])).filter(v => !isNaN(v) && v >= 0);
                if (values.length === 0) { alertModal('该字段没有非负值'); return; }
                const sum = values.reduce((a, b) => a + b, 0);
                if (sum === 0) { alertModal('总和为0，无法规范化'); return; }
                const newData = data.map(row => {
                    const newRow = { ...row };
                    const val = Number(row[field]);
                    newRow[field + '_规范化'] = (isNaN(val) || val < 0) ? null : val / sum;
                    return newRow;
                });
                addTab(tab.name + '规范化', newData);
            }

            function splitField(field, separator) {
                const tab = tabs.find(t => t.id === activeTabId);
                const data = dfToArray(tab.df);
                const newData = data.map(row => {
                    const newRow = { ...row };
                    const str = String(row[field] ?? '');
                    const idx = str.indexOf(separator);
                    if (idx === -1) {
                        newRow[field + '_左'] = str;
                        newRow[field + '_右'] = '';
                    } else {
                        newRow[field + '_左'] = str.substring(0, idx);
                        newRow[field + '_右'] = str.substring(idx + separator.length);
                    }
                    return newRow;
                });
                addTab(tab.name + '字段分割', newData);
            }

            function replaceValue(field, oldStr, newStr) {
                const tab = tabs.find(t => t.id === activeTabId);
                const data = dfToArray(tab.df);
                const newData = data.map(row => {
                    const newRow = { ...row };
                    const cell = String(row[field] ?? '');
                    newRow[field + '_替换'] = cell.split(oldStr).join(newStr);
                    return newRow;
                });
                addTab(tab.name + '属性替换', newData);
            }

            function oneHot(field) {
                const tab = tabs.find(t => t.id === activeTabId);
                const data = dfToArray(tab.df);
                const uniqueVals = [...new Set(data.map(r => String(r[field] ?? '')))];
                const newData = data.map(row => {
                    const newRow = { ...row };
                    uniqueVals.forEach(val => {
                        newRow[field + '_' + val] = (String(row[field] ?? '') === val) ? 1 : 0;
                    });
                    return newRow;
                });
                addTab(tab.name + '独热编码', newData);
            }

            // ========== 渲染函数 ==========
            function updateRecordCount(tab) {
                if (!tab) { recordCount.textContent = ''; return; }
                const total = tab.allData.length;
                const shown = tab.showingAll ? total : Math.min(20, total);
                recordCount.textContent = `(共 ${total} 条 · 显示 ${shown} 条)`;
            }

            function renderTable(tab) {
                if (!tab) {
                    dataTableWrapper.style.display = 'none';
                    emptyMessage.style.display = 'flex';
                    emptyMessage.innerHTML = '<i class="fas fa-file-import"></i><span>请上传文件</span>';
                    updateRecordCount(null);
                    return;
                }
                const data = tab.showingAll ? tab.allData : tab.allData.slice(0, 20);
                if (!data || data.length === 0) {
                    dataTableWrapper.style.display = 'none';
                    emptyMessage.style.display = 'flex';
                    emptyMessage.innerHTML = '<i class="fas fa-exclamation-circle"></i><span>数据为空</span>';
                    updateRecordCount(tab);
                    return;
                }
                emptyMessage.style.display = 'none';
                dataTableWrapper.style.display = 'block';
                const columns = Object.keys(data[0]);
                let html = '<table><thead><tr><th style="width:50px;">#</th>';
                columns.forEach(c => html += `<th>${c}</th>`);
                html += '</tr></thead><tbody>';
                data.forEach((row, i) => {
                    html += `<tr><td style="color:#8ba0c0;">${i + 1}</td>`;
                    columns.forEach(c => {
                        let v = row[c];
                        if (v === null || v === undefined) v = '';
                        html += `<td>${v}</td>`;
                    });
                    html += '</tr>';
                });
                html += '</tbody></table>';
                dataTableWrapper.innerHTML = html;
                updateRecordCount(tab);
            }

            function updateToggleButton(tab) {
                if (!tab) {
                    toggleAllBtn.innerHTML = '<i class="fas fa-expand"></i> 展示全部';
                    toggleAllBtn.classList.remove('active');
                    return;
                }
                if (tab.showingAll) {
                    toggleAllBtn.innerHTML = '<i class="fas fa-compress"></i> 仅显示前20条';
                    toggleAllBtn.classList.add('active');
                } else {
                    toggleAllBtn.innerHTML = '<i class="fas fa-expand"></i> 展示全部';
                    toggleAllBtn.classList.remove('active');
                }
            }

            function setActiveTab(tabId) {
                activeTabId = tabId;
                document.querySelectorAll('.tab').forEach(el => el.classList.toggle('active', el.dataset.id ===
                    tabId));
                const tab = tabs.find(t => t.id === tabId);
                renderTable(tab);
                updateToggleButton(tab);
                if (tab) {
                    activeTabTitle.innerHTML = `<i class="fas fa-table"></i> ${tab.name}`;
                } else {
                    activeTabTitle.innerHTML = '<i class="fas fa-table"></i> 请选择数据';
                }
            }

            function renderTabBar() {
                tabBar.innerHTML = '';
                tabs.forEach(tab => {
                    const el = document.createElement('div');
                    el.className = 'tab' + (tab.id === activeTabId ? ' active' : '');
                    el.dataset.id = tab.id;
                    el.draggable = true;
                    const label = document.createElement('span');
                    label.className = 'tab-label';
                    label.textContent = tab.name;
                    label.title = '双击修改标签名';
                    const closeBtn = document.createElement('button');
                    closeBtn.className = 'close-tab';
                    closeBtn.innerHTML = '<i class="fas fa-times"></i>';
                    el.appendChild(label);
                    el.appendChild(closeBtn);
                    el.addEventListener('click', e => {
                        if (e.target.closest('.close-tab')) return;
                        setActiveTab(tab.id);
                    });
                    closeBtn.addEventListener('click', async (e) => {
                        e.stopPropagation();
                        const confirmed = await confirmModal(`关闭后数据会消失，确定关闭 "${tab.name}" 吗？`,
                            '确认关闭');
                        if (confirmed) closeTab(tab.id);
                    });
                    el.addEventListener('dblclick', async (e) => {
                        if (e.target.closest('.close-tab')) return;
                        e.preventDefault();
                        const newName = await promptModal('请输入新的标签名：', tab.name, '修改标签名');
                        if (newName && newName.trim()) {
                            tab.name = newName.trim();
                            renderTabBar();
                            if (tab.id === activeTabId) {
                                activeTabTitle.innerHTML = `<i class="fas fa-table"></i> ${tab.name}`;
                            }
                        }
                    });
                    el.addEventListener('dragstart', e => {
                        e.dataTransfer.setData('text/plain', tab.id);
                        el.classList.add('dragging');
                    });
                    el.addEventListener('dragend', () => el.classList.remove('dragging'));
                    el.addEventListener('dragover', e => e.preventDefault());
                    el.addEventListener('drop', e => {
                        e.preventDefault();
                        const sid = e.dataTransfer.getData('text/plain');
                        if (sid && sid !== tab.id) reorderTabs(sid, tab.id);
                    });
                    tabBar.appendChild(el);
                });
            }

            function closeTab(tabId) {
                const idx = tabs.findIndex(t => t.id === tabId);
                if (idx === -1) return;
                tabs.splice(idx, 1);
                if (activeTabId === tabId) {
                    if (tabs.length) setActiveTab(tabs[0].id);
                    else {
                        activeTabId = null;
                        dataTableWrapper.style.display = 'none';
                        emptyMessage.style.display = 'flex';
                        emptyMessage.innerHTML = '<i class="fas fa-file-import"></i><span>请上传文件</span>';
                        activeTabTitle.innerHTML = '<i class="fas fa-table"></i> 请选择数据';
                        recordCount.textContent = '';
                    }
                }
                renderTabBar();
            }

            function reorderTabs(sid, tid) {
                const si = tabs.findIndex(t => t.id === sid),
                    ti = tabs.findIndex(t => t.id === tid);
                if (si === -1 || ti === -1 || si === ti) return;
                const [m] = tabs.splice(si, 1);
                tabs.splice(ti, 0, m);
                renderTabBar();
            }

            function addTab(name, allData) {
                const df = arrayToDf(allData);
                const t = {
                    id: generateTabId(),
                    name,
                    df: df,
                    allData: allData,
                    showingAll: false,
                    describe: computeDescribeWithDf(df)
                };
                tabs.push(t);
                renderTabBar();
                setActiveTab(t.id);
            }

            // ========== 菜单动作绑定 ==========
            document.querySelectorAll('.submenu-item[data-action]').forEach(item => {
                item.addEventListener('click', () => {
                    const action = item.dataset.action;
                    if (action === 'describe') openDataDescription();
                    else if (action === 'dropna') showFieldSelector('删除缺失值', dropMissing);
                    else if (action === 'fillna') showFieldSelector('填补缺失值', fillMissing, { type: 'fillna' });
                    else if (action === 'dropduplicates') showFieldSelector('删除重复值', dropDuplicates);
                    else if (action === 'merge') openMergeModal();
                    else if (action === 'concat') openConcatModal();
                    else if (action === 'select_fields') openFieldSelection();
                    else if (action === 'pca') openPCA();
                    else if (action === 'sample_data') openSampling();
                    else if (action === 'filter_by_value') openValueFilter();
                    else if (action === 'kmeans') openKMeans();
                    else if (action === 'groupby') openGroupBy();
                    else if (action === 'normalize') {
                        selectNumericField((field) => {
                            const overlay = document.createElement('div');
                            overlay.className = 'modal-overlay';
                            const dialog = document.createElement('div');
                            dialog.className = 'modal-dialog';
                            dialog.innerHTML =
                                `<h3><i class="fas fa-chart-line"></i> 归一化范围</h3><div class="filter-input-group"><label>选择范围：</label><select id="normRange"><option value="0to1">0~1</option><option value="-1to1">-1~1</option></select></div><div class="modal-btns"><button class="btn-secondary" id="cancelNormRange">取消</button><button class="btn-primary" id="confirmNormRange">确定</button></div>`;
                            overlay.appendChild(dialog);
                            document.body.appendChild(overlay);
                            document.getElementById('cancelNormRange').onclick = () => document.body
                                .removeChild(overlay);
                            document.getElementById('confirmNormRange').onclick = () => {
                                const range = dialog.querySelector('#normRange').value;
                                document.body.removeChild(overlay);
                                normalize(field, range);
                            };
                        }, '选择要归一化的字段');
                    } else if (action === 'standardize') selectNumericField((field) => standardize(field),
                        '选择要标准化的字段');
                    else if (action === 'normalize_sum') selectNumericField((field) => normalizeSum(field),
                        '选择要规范化的字段');
                    else if (action === 'split_field') {
                        const tab = tabs.find(t => t.id === activeTabId);
                        if (!tab) { alertModal('请先选择数据标签'); return; }
                        const columns = tab.df.columns;
                        const overlay = document.createElement('div');
                        overlay.className = 'modal-overlay';
                        const dialog = document.createElement('div');
                        dialog.className = 'modal-dialog';
                        let html =
                            `<h3><i class="fas fa-cut"></i> 字段分割</h3><div class="filter-input-group"><label>选择字段：</label><select id="splitField">${columns.map(c => `<option>${c}</option>`).join('')}</select></div>`;
                        html +=
                            `<div class="filter-input-group"><label>分隔符：</label><input type="text" id="splitSeparator" value=","></div>`;
                        html +=
                            '<div class="modal-btns"><button class="btn-secondary" id="cancelSplit">取消</button><button class="btn-primary" id="confirmSplit">分割</button></div>';
                        dialog.innerHTML = html;
                        overlay.appendChild(dialog);
                        document.body.appendChild(overlay);
                        document.getElementById('cancelSplit').onclick = () => document.body.removeChild(
                            overlay);
                        document.getElementById('confirmSplit').onclick = () => {
                            const field = dialog.querySelector('#splitField').value,
                                sep = dialog.querySelector('#splitSeparator').value;
                            if (sep === '') { alertModal('请输入分隔符'); return; }
                            document.body.removeChild(overlay);
                            splitField(field, sep);
                        };
                    } else if (action === 'replace_value') {
                        const tab = tabs.find(t => t.id === activeTabId);
                        if (!tab) { alertModal('请先选择数据标签'); return; }
                        const columns = tab.df.columns;
                        const overlay = document.createElement('div');
                        overlay.className = 'modal-overlay';
                        const dialog = document.createElement('div');
                        dialog.className = 'modal-dialog';
                        let html =
                            `<h3><i class="fas fa-edit"></i> 属性替换</h3><div class="filter-input-group"><label>选择字段：</label><select id="replaceField">${columns.map(c => `<option>${c}</option>`).join('')}</select></div>`;
                        html +=
                            `<div class="filter-input-group"><label>查找字符：</label><input type="text" id="oldStr" placeholder="旧字符"></div>`;
                        html +=
                            `<div class="filter-input-group"><label>替换为：</label><input type="text" id="newStr" placeholder="新字符"></div>`;
                        html +=
                            '<div class="modal-btns"><button class="btn-secondary" id="cancelReplace">取消</button><button class="btn-primary" id="confirmReplace">替换</button></div>';
                        dialog.innerHTML = html;
                        overlay.appendChild(dialog);
                        document.body.appendChild(overlay);
                        document.getElementById('cancelReplace').onclick = () => document.body.removeChild(
                            overlay);
                        document.getElementById('confirmReplace').onclick = () => {
                            const field = dialog.querySelector('#replaceField').value,
                                oldStr = dialog.querySelector('#oldStr').value,
                                newStr = dialog.querySelector('#newStr').value;
                            if (oldStr === '') { alertModal('请输入要替换的字符'); return; }
                            document.body.removeChild(overlay);
                            replaceValue(field, oldStr, newStr);
                        };
                    } else if (action === 'one_hot') {
                        const tab = tabs.find(t => t.id === activeTabId);
                        if (!tab) { alertModal('请先选择数据标签'); return; }
                        const columns = tab.df.columns;
                        const overlay = document.createElement('div');
                        overlay.className = 'modal-overlay';
                        const dialog = document.createElement('div');
                        dialog.className = 'modal-dialog';
                        let html =
                            `<h3><i class="fas fa-th-large"></i> 独热编码</h3><div class="filter-input-group"><label>选择字段：</label><select id="oneHotField">${columns.map(c => `<option>${c}</option>`).join('')}</select></div>`;
                        html +=
                            '<div class="modal-btns"><button class="btn-secondary" id="cancelOneHot">取消</button><button class="btn-primary" id="confirmOneHot">编码</button></div>';
                        dialog.innerHTML = html;
                        overlay.appendChild(dialog);
                        document.body.appendChild(overlay);
                        document.getElementById('cancelOneHot').onclick = () => document.body.removeChild(
                            overlay);
                        document.getElementById('confirmOneHot').onclick = () => {
                            const field = dialog.querySelector('#oneHotField').value;
                            document.body.removeChild(overlay);
                            oneHot(field);
                        };
                    }
                });
            });

            // ========== 导出功能 ==========
            function exportActiveTab(format) {
                const tab = tabs.find(t => t.id === activeTabId);
                if (!tab) { alertModal('无数据'); return; }
                const data = tab.allData;
                if (!data.length) return;

                // 如果是 json 或 markdown，先检查行数限制
                if (format === 'json' || format === 'markdown') {
                    if (data.length > 20) {
                        alertModal('数据量过大，请下载 CSV 或 Excel 文件。');
                        return;
                    }
                    showCodeExportModal(format, data);
                    return;
                }

                const name = tab.name || '数据';
                if (format === 'csv') {
                    const csv = XLSX.utils.sheet_to_csv(XLSX.utils.json_to_sheet(data));
                    const blob = new Blob(['\uFEFF' + csv], { type: 'text/csv;charset=utf-8;' });
                    const a = document.createElement('a');
                    a.href = URL.createObjectURL(blob);
                    a.download = name + '.csv';
                    a.click();
                } else if (format === 'xlsx') {
                    const ws = XLSX.utils.json_to_sheet(data);
                    const wb = XLSX.utils.book_new();
                    XLSX.utils.book_append_sheet(wb, ws, 'Sheet1');
                    XLSX.writeFile(wb, name + '.xlsx');
                }
                closeExportMenu();
            }

            function showCodeExportModal(format, data) {
                const overlay = document.createElement('div');
                overlay.className = 'modal-overlay';
                const modal = document.createElement('div');
                modal.className = 'code-export-modal';
                let code = '';
                if (format === 'json') {
                    code = JSON.stringify(data, null, 2);
                } else if (format === 'markdown') {
                    // 生成 Markdown 表格
                    const columns = Object.keys(data[0]);
                    // 表头
                    let md = '| ' + columns.join(' | ') + ' |\n';
                    // 分隔线
                    md += '| ' + columns.map(() => '---').join(' | ') + ' |\n';
                    // 数据行
                    data.forEach(row => {
                        md += '| ' + columns.map(c => String(row[c] ?? '')).join(' | ') + ' |\n';
                    });
                    code = md;
                }
                modal.innerHTML = `
                    <h3><i class="fas fa-code"></i> ${format === 'json' ? 'JSON 数据' : 'Markdown 数据'}</h3>
                    <textarea readonly>${code}</textarea>
                    <div class="modal-btns">
                        <button class="btn-secondary" id="closeCodeModal">关闭</button>
                        <button class="btn-primary" id="copyCodeBtn"><i class="fas fa-copy"></i> 一键复制</button>
                    </div>
                `;
                overlay.appendChild(modal);
                document.body.appendChild(overlay);

                const textarea = modal.querySelector('textarea');
                document.getElementById('closeCodeModal').onclick = () => document.body.removeChild(overlay);
                document.getElementById('copyCodeBtn').onclick = async () => {
                    try {
                        await navigator.clipboard.writeText(code);
                        alertModal('已复制到剪贴板');
                    } catch (e) {
                        alertModal('复制失败，请手动复制');
                    }
                };
                // 点击遮罩关闭
                overlay.addEventListener('click', (e) => {
                    if (e.target === overlay) document.body.removeChild(overlay);
                });
            }

            function closeExportMenu() {
                exportMenuOpen = false;
                exportOptions.classList.remove('show');
            }
            exportBtn.addEventListener('click', e => {
                e.stopPropagation();
                exportMenuOpen = !exportMenuOpen;
                exportOptions.classList.toggle('show', exportMenuOpen);
            });
            document.addEventListener('click', e => { if (!e.target.closest('.export-menu')) closeExportMenu(); });
            exportOptions.querySelectorAll('.export-option').forEach(opt => opt.addEventListener('click', e => {
                e.stopPropagation();
                exportActiveTab(opt.dataset.format);
            }));

            // ========== 文件上传 ==========
            fileInput.addEventListener('change', e => {
                const files = e.target.files;
                if (!files.length) return;
                for (let file of files) {
                    const ext = file.name.split('.').pop().toLowerCase();
                    if (ext === 'csv') {
                        const reader = new FileReader();
                        reader.onload = ev => {
                            const wb = XLSX.read(ev.target.result, { type: 'string' });
                            const ws = wb.Sheets[wb.SheetNames[0]];
                            addTab(file.name.replace(/\.csv$/i, ''), XLSX.utils.sheet_to_json(ws, { defval: '' }));
                        };
                        reader.readAsText(file);
                    } else if (ext === 'xlsx' || ext === 'xls') {
                        const reader = new FileReader();
                        reader.onload = ev => {
                            const wb = XLSX.read(new Uint8Array(ev.target.result), { type: 'array' });
                            const names = wb.SheetNames;
                            const overlay = document.createElement('div');
                            overlay.className = 'modal-overlay';
                            const dialog = document.createElement('div');
                            dialog.className = 'modal-dialog';
                            dialog.innerHTML =
                                `<h3><i class="fas fa-file-excel"></i> 选择工作表</h3><div class="field-checkbox-group">${names.map((s, i) => `<label class="field-checkbox-label"><input type="checkbox" class="sheet-check" value="${s}" checked> ${s}</label>`).join('')}</div><div style="display:flex;justify-content:space-between;margin-bottom:15px;"><button id="selectAllSheets" style="background:none;border:none;color:#3b82f6;cursor:pointer;font-size:0.85rem;">全选</button></div><div class="modal-btns"><button class="btn-secondary" id="cancelSheetModal">取消</button><button class="btn-primary" id="confirmSheetModal">导入</button></div>`;
                            overlay.appendChild(dialog);
                            document.body.appendChild(overlay);
                            document.getElementById('cancelSheetModal').onclick = () => document.body
                                .removeChild(overlay);
                            document.getElementById('selectAllSheets').onclick = () => {
                                dialog.querySelectorAll('.sheet-check').forEach(cb => cb.checked =
                                    true);
                            };
                            document.getElementById('confirmSheetModal').onclick = () => {
                                const sel = [...dialog.querySelectorAll('.sheet-check:checked')].map(
                                    cb => cb.value);
                                document.body.removeChild(overlay);
                                sel.forEach(s => addTab(s, XLSX.utils.sheet_to_json(wb.Sheets[s], {
                                    defval: ''
                                })));
                            };
                        };
                        reader.readAsArrayBuffer(file);
                    } else alertModal('不支持文件');
                }
                fileInput.value = '';
            });

            // ========== 工具栏 ==========
            toggleAllBtn.addEventListener('click', async () => {
                const tab = tabs.find(t => t.id === activeTabId);
                if (!tab) return;
                if (!tab.showingAll && tab.allData.length > 500) {
                    const ok = await confirmModal(
                        `数据量较大 (${tab.allData.length} 条)，全部展示可能卡顿，继续吗？`);
                    if (!ok) return;
                }
                tab.showingAll = !tab.showingAll;
                renderTable(tab);
                updateToggleButton(tab);
            });

            // ========== 初始化 ==========
            renderTabBar();
            setActiveTab(null);
            updateToggleButton(null);
            closeExportMenu();
        })();
    </script>
</body>

</html>
