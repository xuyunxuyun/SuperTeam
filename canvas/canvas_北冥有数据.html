    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>北冥有数据</title>
    <!-- SheetJS 用于 Excel/CSV 解析 -->
    <script src="https://cdn.sheetjs.com/xlsx-0.20.2/package/dist/xlsx.full.min.js">
    </script>
    <!-- Danfo.js 用于类 Pandas 数据操作 -->
    <script src="https://cdn.jsdelivr.net/npm/danfojs@1.1.2/lib/bundle.min.js">
    </script>
    <!-- ML.js 用于 PCA、KMeans -->
    <script src="https://www.lactame.com/lib/ml/6.0.0/ml.min.js"></script>
    <!-- ECharts 用于绘制 SSE 折线图 -->
    <script src="https://cdn.jsdelivr.net/npm/echarts@5.5.0/dist/echarts.min.js">
    </script>
    <!-- Font Awesome 图标库 -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg-primary: #0a0f1f;
            --bg-sidebar: #111827;
            --bg-panel: #0f172f;
            --bg-card: rgba(18, 25, 45, 0.9);
            --bg-hover: rgba(59, 130, 246, 0.12);
            --border-color: #2d3a5e;
            --border-blue: #3b82f6;
            --text-primary: #eef2ff;
            --text-secondary: #cbd5e6;
            --text-muted: #8ba0c0;
            --accent-blue: #3b82f6;
            --accent-hover: #2563eb;
            --danger: #ef4444;
            --success: #10b981;
            --shadow-card: 0 4px 20px rgba(0, 0, 0, 0.4);
            --radius: 12px;
            --radius-sm: 8px;
            --radius-lg: 16px;
            --radius-xl: 20px;
            --transition: 0.2s ease;
        }

        body {
            font-family: 'Segoe UI', 'Roboto', sans-serif;
            background: var(--bg-primary);
            height: 100vh;
            display: flex;
            overflow: hidden;
            color: var(--text-primary);
            user-select: none;
        }

        /* ========== 侧边栏 ========== */
        .sidebar {
            width: 280px;
            background: var(--bg-sidebar);
            color: var(--text-primary);
            display: flex;
            flex-direction: column;
            box-shadow: 4px 0 24px rgba(0, 0, 0, 0.5);
            flex-shrink: 0;
            z-index: 10;
            overflow-y: auto;
            border-right: 1px solid var(--border-color);
        }

        .sidebar-header {
            padding: 25px 20px;
            border-bottom: 1px solid var(--border-color);
        }

        .sidebar-header h2 {
            font-weight: 600;
            font-size: 1.45rem;
            color: #fff;
            display: flex;
            align-items: center;
            gap: 10px;
            letter-spacing: 0.5px;
        }

        .sidebar-header h2 i {
            color: var(--accent-blue);
            font-size: 1.7rem;
            text-shadow: 0 0 12px rgba(59, 130, 246, 0.6);
        }

        .menu-area {
            padding: 15px 12px;
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .upload-btn-wrapper {
            position: relative;
            overflow: hidden;
            border-radius: var(--radius-lg);
            margin-bottom: 4px;
        }

        .upload-btn {
            background: linear-gradient(135deg, #3b82f6, #2563eb);
            color: white;
            padding: 13px 20px;
            border: none;
            border-radius: var(--radius-lg);
            font-size: 0.95rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            width: 100%;
            font-weight: 600;
            letter-spacing: 0.3px;
            transition: var(--transition);
            box-shadow: 0 4px 16px rgba(59, 130, 246, 0.3);
        }

        .upload-btn:hover {
            background: linear-gradient(135deg, #2563eb, #1d4ed8);
            box-shadow: 0 6px 24px rgba(59, 130, 246, 0.5);
            transform: translateY(-1px);
        }

        .upload-btn-wrapper input[type=file] {
            position: absolute;
            inset: 0;
            opacity: 0;
            cursor: pointer;
        }

        .collapsible-header {
            background: rgba(255, 255, 255, 0.04);
            padding: 12px 15px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 10px;
            border-radius: var(--radius-sm);
            transition: var(--transition);
            font-size: 0.9rem;
            font-weight: 500;
            color: var(--text-secondary);
            border: 1px solid transparent;
        }

        .collapsible-header:hover {
            background: rgba(59, 130, 246, 0.1);
            border-color: rgba(59, 130, 246, 0.3);
            color: #fff;
        }

        .collapsible-header .chevron {
            margin-left: auto;
            transition: transform 0.3s;
            font-size: 0.7rem;
            color: var(--text-muted);
        }

        .collapsible-header.active .chevron {
            transform: rotate(90deg);
            color: var(--accent-blue);
        }

        .collapsible-content {
            max-height: 0;
            overflow: hidden;
            transition: max-height 0.35s ease;
            padding-left: 10px;
        }

        .collapsible-content.open {
            max-height: 600px;
        }

        .submenu-item {
            padding: 8px 15px;
            margin: 3px 0;
            border-radius: var(--radius-sm);
            cursor: pointer;
            font-size: 0.85rem;
            display: flex;
            align-items: center;
            gap: 10px;
            color: var(--text-muted);
            transition: var(--transition);
            border: 1px solid transparent;
        }

        .submenu-item:hover {
            background: rgba(59, 130, 246, 0.12);
            color: #fff;
            border-color: rgba(59, 130, 246, 0.25);
        }

        .submenu-item i:not(.chevron) {
            width: 18px;
            text-align: center;
            color: #60a5fa;
        }

        .future-btn-disabled {
            background: transparent;
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: rgba(255, 255, 255, 0.3);
            padding: 8px 15px;
            border-radius: var(--radius-sm);
            width: 100%;
            text-align: left;
            cursor: not-allowed;
            font-size: 0.85rem;
            display: flex;
            align-items: center;
            gap: 10px;
            margin: 3px 0;
        }

        /* ========== 主内容区 ========== */
        .main-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            min-width: 0;
            background: var(--bg-primary);
        }

        .tab-bar {
            background: #111827;
            border-bottom: 1px solid var(--border-color);
            padding: 8px 16px 0 16px;
            display: flex;
            align-items: flex-end;
            gap: 4px;
            overflow-x: auto;
            min-height: 46px;
            scrollbar-width: thin;
            flex-shrink: 0;
        }

        .tab-bar::-webkit-scrollbar {
            height: 4px;
        }

        .tab-bar::-webkit-scrollbar-thumb {
            background: var(--accent-blue);
            border-radius: 4px;
        }

        .tab {
            background: #1f2937;
            color: #cbd5e6;
            padding: 9px 18px;
            border-radius: 12px 12px 0 0;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 0.85rem;
            font-weight: 500;
            border: 1px solid var(--border-color);
            border-bottom: none;
            flex-shrink: 0;
            transition: var(--transition);
            margin-bottom: -1px;
        }

        .tab:hover {
            background: #263244;
            color: #fff;
        }

        .tab.active {
            background: #0f172f;
            color: #fff;
            border-top: 2px solid var(--accent-blue);
            border-color: var(--border-color);
            border-bottom: 1px solid #0f172f;
            font-weight: 600;
        }

        .tab .tab-label {
            overflow: hidden;
            text-overflow: ellipsis;
            max-width: 120px;
            cursor: pointer;
        }

        .tab .close-tab {
            background: rgba(255, 255, 255, 0.1);
            border: none;
            cursor: pointer;
            color: #9ca3af;
            font-size: 0.9rem;
            padding: 2px 6px;
            border-radius: 20px;
            transition: var(--transition);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .tab .close-tab:hover {
            background: var(--danger);
            color: #fff;
        }

        .preview-area {
            flex: 1;
            display: flex;
            flex-direction: column;
            margin: 14px 18px 18px 18px;
            background: var(--bg-panel);
            border-radius: var(--radius-lg);
            box-shadow: var(--shadow-card);
            overflow: hidden;
            border: 1px solid var(--border-color);
            min-height: 0;
        }

        .preview-toolbar {
            padding: 12px 20px;
            background: #111827;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 10px;
        }

        .toolbar-left {
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 0.95rem;
            font-weight: 500;
            color: var(--text-primary);
        }

        .toolbar-left i {
            color: var(--accent-blue);
        }

        .action-btns {
            display: flex;
            gap: 8px;
            align-items: center;
            flex-wrap: wrap;
        }

        .btn-outline {
            background: #1e293b;
            border: 1px solid var(--border-color);
            padding: 7px 16px;
            border-radius: 24px;
            cursor: pointer;
            font-size: 0.82rem;
            font-weight: 500;
            color: var(--text-secondary);
            display: flex;
            align-items: center;
            gap: 6px;
            transition: var(--transition);
        }

        .btn-outline:hover {
            background: #263244;
            border-color: var(--accent-blue);
            color: #fff;
        }

        .btn-outline.active {
            background: rgba(59, 130, 246, 0.2);
            border-color: var(--accent-blue);
            color: #fff;
        }

        .table-container {
            flex: 1;
            overflow: auto;
            background: #0a0f1f;
            scrollbar-width: thin;
        }

        .table-container::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }

        .table-container::-webkit-scrollbar-thumb {
            background: #2d3a5e;
            border-radius: 4px;
        }

        .table-container::-webkit-scrollbar-track {
            background: transparent;
        }

        table {
            border-collapse: collapse;
            width: 100%;
            font-size: 0.82rem;
        }

        th {
            background: #1a2332;
            position: sticky;
            top: 0;
            z-index: 5;
            padding: 11px 14px;
            text-align: left;
            font-weight: 600;
            color: #60a5fa;
            border-bottom: 2px solid var(--border-color);
            white-space: nowrap;
            font-size: 0.8rem;
            letter-spacing: 0.3px;
        }

        td {
            padding: 9px 14px;
            border-bottom: 1px solid rgba(45, 58, 94, 0.4);
            max-width: 280px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            color: #d1d5db;
        }

        tr:hover td {
            background: rgba(59, 130, 246, 0.06);
        }

        .empty-message {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100%;
            color: #6b7a90;
            font-size: 1.1rem;
            gap: 15px;
        }

        .empty-message i {
            font-size: 3.5rem;
            color: #2d3a5e;
            text-shadow: 0 0 20px rgba(59, 130, 246, 0.2);
        }

        .describe-panel {
            padding: 18px 25px;
            background: #111827;
            border-top: 1px solid var(--border-color);
            overflow: auto;
            max-height: 45%;
            display: none;
            flex-shrink: 0;
        }

        .describe-panel.active {
            display: block;
        }

        .describe-title {
            font-weight: 600;
            font-size: 0.9rem;
            color: var(--accent-blue);
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .describe-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.78rem;
        }

        .describe-table th,
        .describe-table td {
            padding: 7px 12px;
            border: 1px solid rgba(45, 58, 94, 0.5);
            white-space: nowrap;
            color: #d1d5db;
        }

        .describe-table th {
            background: #1a2332;
            font-weight: 600;
            color: #60a5fa;
        }

        .shape-info {
            font-size: 0.8rem;
            color: var(--text-muted);
            margin-bottom: 10px;
        }

        .export-menu {
            position: relative;
            display: inline-block;
        }

        .export-options {
            display: none;
            position: absolute;
            right: 0;
            top: 110%;
            background: #1a2332;
            border: 1px solid var(--border-blue);
            border-radius: var(--radius-sm);
            box-shadow: 0 12px 32px rgba(0, 0, 0, 0.6);
            z-index: 50;
            min-width: 160px;
            overflow: hidden;
        }

        .export-options.show {
            display: block;
        }

        .export-option {
            padding: 10px 18px;
            cursor: pointer;
            font-size: 0.82rem;
            display: flex;
            align-items: center;
            gap: 8px;
            color: var(--text-secondary);
            transition: var(--transition);
        }

        .export-option:hover {
            background: rgba(59, 130, 246, 0.15);
            color: #fff;
        }

        /* ========== 模态框 ========== */
        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.75);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            backdrop-filter: blur(6px);
        }

        .modal-dialog {
            background: #0f172f;
            border-radius: var(--radius-xl);
            padding: 25px;
            width: 550px;
            max-width: 92vw;
            max-height: 85vh;
            overflow-y: auto;
            border: 1px solid var(--border-blue);
            box-shadow: 0 24px 48px rgba(0, 0, 0, 0.6);
        }

        .modal-dialog h3 {
            margin-bottom: 20px;
            color: #fff;
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 1.1rem;
        }

        .modal-dialog h3 i {
            color: var(--accent-blue);
        }

        .field-checkbox-group {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-bottom: 20px;
            max-height: 200px;
            overflow-y: auto;
            padding: 5px;
        }

        .field-checkbox-label {
            display: flex;
            align-items: center;
            gap: 6px;
            background: #1a2332;
            padding: 8px 14px;
            border-radius: var(--radius-sm);
            cursor: pointer;
            font-size: 0.85rem;
            color: var(--text-secondary);
            transition: var(--transition);
            border: 1px solid transparent;
        }

        .field-checkbox-label:hover {
            background: rgba(59, 130, 246, 0.15);
            border-color: rgba(59, 130, 246, 0.3);
            color: #fff;
        }

        .field-checkbox-label input[type="checkbox"],
        .field-checkbox-label input[type="radio"] {
            accent-color: var(--accent-blue);
            cursor: pointer;
        }

        .modal-btns {
            display: flex;
            justify-content: flex-end;
            gap: 10px;
            margin-top: 20px;
        }

        .modal-btns button {
            padding: 9px 22px;
            border-radius: 24px;
            border: none;
            cursor: pointer;
            font-weight: 500;
            font-size: 0.85rem;
            transition: var(--transition);
        }

        .btn-primary {
            background: var(--accent-blue);
            color: #fff;
        }

        .btn-primary:hover {
            background: var(--accent-hover);
            box-shadow: 0 4px 16px rgba(59, 130, 246, 0.4);
        }

        .btn-secondary {
            background: #1e293b;
            color: var(--text-secondary);
            border: 1px solid var(--border-color) !important;
        }

        .btn-secondary:hover {
            background: #263244;
            color: #fff;
        }

        .join-config-row {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 8px;
            flex-wrap: wrap;
        }

        .join-config-row select {
            padding: 8px 12px;
            background: #1a2332;
            border: 1px solid var(--border-color);
            border-radius: var(--radius-sm);
            font-size: 0.85rem;
            color: var(--text-primary);
            cursor: pointer;
        }

        .join-config-row select:focus {
            outline: none;
            border-color: var(--accent-blue);
        }

        .join-config-row button {
            background: rgba(239, 68, 68, 0.2);
            border: none;
            color: var(--danger);
            cursor: pointer;
            font-size: 1rem;
            border-radius: 50%;
            width: 28px;
            height: 28px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: var(--transition);
        }

        .join-config-row button:hover {
            background: var(--danger);
            color: #fff;
        }

        .add-join-btn {
            background: none;
            border: none;
            color: var(--accent-blue);
            cursor: pointer;
            font-size: 0.85rem;
            display: flex;
            align-items: center;
            gap: 5px;
            padding: 6px 0;
        }

        .add-join-btn:hover {
            color: #60a5fa;
        }

        .filter-input-group {
            margin-bottom: 15px;
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            align-items: center;
        }

        .filter-input-group label {
            font-size: 0.85rem;
            color: var(--text-secondary);
        }

        .filter-input-group input,
        .filter-input-group select {
            padding: 8px 12px;
            background: #1a2332;
            border: 1px solid var(--border-color);
            border-radius: var(--radius-sm);
            font-size: 0.85rem;
            color: var(--text-primary);
        }

        .filter-input-group input:focus,
        .filter-input-group select:focus {
            outline: none;
            border-color: var(--accent-blue);
        }

        .replace-input-group {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            align-items: center;
            margin-bottom: 15px;
        }

        .replace-input-group input[type="text"] {
            flex: 2;
            padding: 8px 12px;
            background: #1a2332;
            border: 1px solid var(--border-color);
            border-radius: var(--radius-sm);
            font-size: 0.85rem;
            color: var(--text-primary);
        }

        .replace-input-group label {
            display: flex;
            align-items: center;
            gap: 5px;
            font-size: 0.8rem;
            color: var(--text-secondary);
            cursor: pointer;
        }

        /* ========== 自定义模态框 ========== */
        .custom-modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.75);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 2000;
            backdrop-filter: blur(6px);
        }

        .custom-modal {
            background: #0f172f;
            border-radius: var(--radius-xl);
            padding: 25px;
            width: 400px;
            max-width: 90vw;
            border: 1px solid var(--border-blue);
            box-shadow: 0 24px 48px rgba(0, 0, 0, 0.6);
            animation: modalIn 0.2s ease;
        }

        @keyframes modalIn {
            from {
                opacity: 0;
                transform: scale(0.92) translateY(10px);
            }

            to {
                opacity: 1;
                transform: scale(1) translateY(0);
            }
        }

        .custom-modal h4 {
            margin-bottom: 15px;
            color: #fff;
            font-size: 1rem;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .custom-modal h4 i {
            color: var(--accent-blue);
        }

        .custom-modal .custom-message {
            margin-bottom: 20px;
            color: var(--text-secondary);
            font-size: 0.9rem;
            line-height: 1.6;
        }

        .custom-modal input[type="text"] {
            width: 100%;
            padding: 10px 14px;
            background: #1a2332;
            border: 1px solid var(--border-color);
            border-radius: var(--radius-sm);
            font-size: 0.9rem;
            color: var(--text-primary);
            margin-bottom: 20px;
        }

        .custom-modal input[type="text"]:focus {
            outline: none;
            border-color: var(--accent-blue);
        }

        .custom-modal .custom-btns {
            display: flex;
            justify-content: flex-end;
            gap: 10px;
        }

        .custom-modal .custom-btns button {
            padding: 8px 20px;
            border-radius: 20px;
            border: none;
            cursor: pointer;
            font-weight: 500;
            font-size: 0.85rem;
            transition: var(--transition);
        }

        .custom-modal .btn-cancel {
            background: #1e293b;
            color: var(--text-secondary);
            border: 1px solid var(--border-color) !important;
        }

        .custom-modal .btn-cancel:hover {
            background: #263244;
            color: #fff;
        }

        .custom-modal .btn-ok {
            background: var(--accent-blue);
            color: #fff;
        }

        .custom-modal .btn-ok:hover {
            background: var(--accent-hover);
        }

        /* 滚动条全局优化 */
        ::-webkit-scrollbar {
            width: 6px;

    <script>
        (function () {
            // ========== 自定义模态框 ==========
            function showModal({ type = 'alert', title = '提示', message = '', defaultValue = '',
                placeholder = '' }) {
                return new Promise((resolve) => {
                    const overlay = document.createElement('div');
                    overlay.className = 'custom-modal-overlay';
                    const modal = document.createElement('div');
                    modal.className = 'custom-modal';
                    let html = `<h4><i class="fas fa-info-circle"></i> ${title}</h4>`;
                    html += `<div class="custom-message">${message}</div>`;
                    if (type === 'prompt') {
                        html +=
                            `<input type="text" class="custom-input" value="${defaultValue}" placeholder="${placeholder}" />`;
                    }
                    html += `<div class="custom-btns">`;
                    if (type === 'confirm' || type === 'prompt') html +=
                        `<button class="btn-cancel">取消</button>`;
                    html += `<button class="btn-ok">确定</button></div>`;
                    modal.innerHTML = html;
                    overlay.appendChild(modal);
                    document.body.appendChild(overlay);
                    const input = modal.querySelector('.custom-input');
                    const okBtn = modal.querySelector('.btn-ok');
                    const cancelBtn = modal.querySelector('.btn-cancel');

                    function close() { document.body.removeChild(overlay); }
                    okBtn.addEventListener('click', () => {
                        if (type === 'prompt') resolve(input.value);
                        else if (type === 'confirm') resolve(true);
                        else resolve(undefined);
                        close();
                    });
                    if (cancelBtn) {
                        cancelBtn.addEventListener('click', () => {
                            if (type === 'confirm') resolve(false);
                            else if (type === 'prompt') resolve(null);
                            else resolve(undefined);
                            close();
                        });
                    }
                    overlay.addEventListener('click', (e) => {
                        if (e.target === overlay && type === 'alert') {
                            resolve(undefined);
                            close();
                        }
                    });
                    document.addEventListener('keydown', function escHandler(e) {
                        if (e.key === 'Escape') {
                            if (type === 'confirm') resolve(false);
                            else if (type === 'prompt') resolve(null);
                            else resolve(undefined);
                            close();
                            document.removeEventListener('keydown', escHandler);
                        }
                    });
                    if (input) setTimeout(() => input.focus(), 50);
                });
            }
            async function alertModal(message, title = '提示') {
                await showModal({ type: 'alert', title, message });
            }
            async function confirmModal(message, title = '确认') {
                return await showModal({ type: 'confirm', title, message });
            }
            async function promptModal(message, defaultValue = '', title = '输入') {
                return await showModal({ type: 'prompt', title, message, defaultValue });
            }

            // ========== Danfo.js 辅助函数 ==========
            function dfToArray(df) {
                if (!df || df.shape[0] === 0) return [];
                const columns = df.columns;
                const values = df.values;
                return values.map(row => {
                    const obj = {};
                    columns.forEach((col, i) => { obj[col] = row[i]; });
                    return obj;
                });
            }

            function arrayToDf(arr) {
                if (!arr || arr.length === 0) return new dfd.DataFrame([], { columns: [] });
                return new dfd.DataFrame(arr);
            }

            function inferColumnTypeFromDf(df, col) {
                if (!df || df.shape[0] === 0) return 'object';
                const sample = df[col].values.slice(0, 100).filter(v => v !== null && v !== undefined && v !==
                    '');
                if (sample.length === 0) return 'object';
                let allInt = true,
                    allNumeric = true;
                for (let val of sample) {
                    const num = Number(val);
                    if (isNaN(num) || val === '' || val === null) {
                        allNumeric = false;
                        allInt = false;
                        break;
                    }
                    if (!Number.isInteger(num)) allInt = false;
                }
                if (allNumeric) return allInt ? 'int64' : 'float64';
                return 'object';
            }

            function computeDescribeWithDf(df) {
                if (!df || df.shape[0] === 0) return null;
                const columns = df.columns;
                const colTypes = {};
                columns.forEach(c => { colTypes[c] = inferColumnTypeFromDf(df, c); });
                const describeRows = {};
                ['count', 'unique', 'top', 'freq', 'mean', 'std', 'min', '25%', '50%', '75%', 'max'].forEach(idx =>
                    describeRows[idx] = {});
                columns.forEach(col => {
                    const values = df[col].values;
                    const nonNull = values.filter(v => v !== null && v !== undefined && v !== '');
                    describeRows['count'][col] = nonNull.length;
                    if (colTypes[col] === 'int64' || colTypes[col] === 'float64') {
                        const nums = nonNull.map(Number).filter(v => !isNaN(v));
                        if (nums.length) {
                            nums.sort((a, b) => a - b);
                            const sum = nums.reduce((a, b) => a + b, 0);
                            const mean = sum / nums.length;
                            const variance = nums.reduce((acc, v) => acc + (v - mean) ** 2, 0) / (nums.length -
                                1 || 1);
                            describeRows['mean'][col] = round(mean, 3);
                            describeRows['std'][col] = round(Math.sqrt(variance), 3);
                            describeRows['min'][col] = colTypes[col] === 'int64' ? Math.round(nums[0]) : nums[0];
                            describeRows['25%'][col] = percentile(nums, 25);
                            describeRows['50%'][col] = percentile(nums, 50);
                            describeRows['75%'][col] = percentile(nums, 75);
                            describeRows['max'][col] = colTypes[col] === 'int64' ? Math.round(nums[nums.length -
                                1]) : nums[nums.length - 1];
                        } else {
                            ['mean', 'std', 'min', '25%', '50%', '75%', 'max'].forEach(r => describeRows[r][
                                col
                            ] = 'NaN');
                        }
                        const uniqueVals = new Set(nonNull.map(String));
                        describeRows['unique'][col] = uniqueVals.size;
                        const freqMap = {};
                        nonNull.forEach(v => freqMap[v] = (freqMap[v] || 0) + 1);
                        const topEntry = Object.entries(freqMap).sort((a, b) => b[1] - a[1])[0];
                        describeRows['top'][col] = topEntry ? topEntry[0] : 'NaN';
                        describeRows['freq'][col] = topEntry ? topEntry[1] : 0;
                    } else {
                        const uniqueVals = new Set(nonNull.map(String));
                        describeRows['unique'][col] = uniqueVals.size;
                        const freqMap = {};
                        nonNull.forEach(v => {
                            const k = String(v);
                            freqMap[k] = (freqMap[k] || 0) + 1;
                        });
                        const sorted = Object.entries(freqMap).sort((a, b) => b[1] - a[1]);
                        describeRows['top'][col] = sorted.length ? sorted[0][0] : 'NaN';
                        describeRows['freq'][col] = sorted.length ? sorted[0][1] : 0;
                        ['mean', 'std', 'min', '25%', '50%', '75%', 'max'].forEach(r => describeRows[r][col] =
                            'NaN');
                    }
                });
                return { columns, colTypes, describeRows, shape: [df.shape[0], df.shape[1]] };
            }

            function percentile(sortedArr, p) {
                if (!sortedArr.length) return 'NaN';
                const i = (sortedArr.length - 1) * p / 100;
                const l = Math.floor(i),
                    u = Math.ceil(i);
                return l === u ? sortedArr[l] : round((sortedArr[l] + sortedArr[u]) / 2, 3);
            }

            function round(num, d) {
                if (typeof num !== 'number' || isNaN(num)) return num;
                return Math.round(num * 10 ** d) / 10 ** d;
            }

            // ========== 自定义 K-Means 函数 ==========
            function simpleKMeans(data, k, maxIter = 100) {
                const n = data.length;
                if (k >= n) throw new Error('k must be smaller than number of points');
                const dim = data[0].length;
                // 随机初始化质心
                let centroids = [];
                const indices = Array.from({ length: n }, (_, i) => i);
                for (let i = 0; i < k; i++) {
                    const randIdx = Math.floor(Math.random() * indices.length);
                    centroids.push(data[indices[randIdx]].slice());
                    indices.splice(randIdx, 1);
                }
                let labels = new Array(n).fill(0);
                for (let iter = 0; iter < maxIter; iter++) {
                    // 分配样本到最近的质心
                    for (let i = 0; i < n; i++) {
                        let minDist = Infinity,
                            best = 0;
                        for (let j = 0; j < k; j++) {
                            let dist = 0;
                            for (let d = 0; d < dim; d++) {
                                dist += Math.pow(data[i][d] - centroids[j][d], 2);
                            }
                            if (dist < minDist) {
                                minDist = dist;
                                best = j;
                            }
                        }
                        labels[i] = best;
                    }
                    // 更新质心
                    const newCentroids = Array.from({ length: k }, () => new Array(dim).fill(0));
                    const counts = new Array(k).fill(0);
                    for (let i = 0; i < n; i++) {
                        const c = labels[i];
                        counts[c]++;
                        for (let d = 0; d < dim; d++) newCentroids[c][d] += data[i][d];
                    }
                    for (let j = 0; j < k; j++) {
                        if (counts[j] > 0) {
                            for (let d = 0; d < dim; d++) newCentroids[j][d] /= counts[j];
                        } else {
                            newCentroids[j] = centroids[j]; // 空簇保持原质心
                        }
                    }
                    // 检查收敛
                    let changed = false;
                    for (let j = 0; j < k; j++) {
                        for (let d = 0; d < dim; d++) {
                            if (Math.abs(newCentroids[j][d] - centroids[j][d]) > 1e-6) {
                                changed = true;
                                break;
                            }
                        }
                        if (changed) break;
                    }
                    centroids = newCentroids;
                    if (!changed) break;
                }
                // 计算 SSE
                let sse = 0;
                for (let i = 0; i < n; i++) {
                    const c = labels[i];
                    for (let d = 0; d < dim; d++) {
                        sse += Math.pow(data[i][d] - centroids[c][d], 2);
                    }
                }
                return { labels, centroids, sse };
            }

            // ========== 分组统计（修改后） ==========
            function openGroupBy() {
                const tab = tabs.find(t => t.id === activeTabId);
                if (!tab) { alertModal('请先选择数据标签'); return; }
                const columns = tab.df.columns;
                if (columns.length === 0) { alertModal('数据为空'); return; }

                const overlay = document.createElement('div');
                overlay.className = 'modal-overlay';
                const dialog = document.createElement('div');
                dialog.className = 'modal-dialog';
                dialog.innerHTML = `
                    <h3><i class="fas fa-object-group"></i> 分组统计</h3>
                    <div style="margin-bottom:10px;color:#cbd5e6;font-size:0.85rem;"><strong>选择分组字段（可多选）：</strong></div>
                    <div class="field-checkbox-group" id="groupFieldsContainer">
                        ${columns.map(c => `<label class="field-checkbox-label"><input type="checkbox" class="group-field" value="${c}"> ${c}</label>`).join('')}
                    </div>
                    <div style="margin-bottom:10px;color:#cbd5e6;font-size:0.85rem;"><strong>统计方式（每行选择字段和聚合方式）：</strong></div>
                    <div id="statsConfigContainer"></div>
                    <button class="add-join-btn" id="addStatRow"><i class="fas fa-plus-circle"></i> 添加统计方式</button>
                    <div class="modal-btns">
                        <button class="btn-secondary" id="cancelGroupBy">取消</button>
                        <button class="btn-primary" id="confirmGroupBy">执行统计</button>
                    </div>
                `;
                overlay.appendChild(dialog);
                document.body.appendChild(overlay);

                const statsContainer = dialog.querySelector('#statsConfigContainer');

                function addStatRow() {
                    const row = document.createElement('div');
                    row.className = 'join-config-row';
                    row.innerHTML = `
                        <select class="stat-field-select">
                            ${columns.map(c => `<option value="${c}">${c}</option>`).join('')}
                        </select>
                        <span style="color:#60a5fa;">→</span>
                        <select class="stat-agg-select">
                            <option value="count">非空值数量</option>
                            <option value="max">最大值</option>
                            <option value="min">最小值</option>
                            <option value="mean">平均值</option>
                            <option value="sum">总值</option>
                        </select>
                        <button class="remove-stat-row"><i class="fas fa-times"></i></button>
                    `;
                    row.querySelector('.remove-stat-row').addEventListener('click', () => row.remove());
                    statsContainer.appendChild(row);
                }

                addStatRow();

                document.getElementById('addStatRow').addEventListener('click', addStatRow);

                document.getElementById('cancelGroupBy').onclick = () => document.body.removeChild(overlay);
                document.getElementById('confirmGroupBy').onclick = () => {
                    const groupFields = [...dialog.querySelectorAll('.group-field:checked')].map(cb => cb.value);
                    if (groupFields.length === 0) { alertModal('请至少选择一个分组字段'); return; }

                    const statRows = statsContainer.querySelectorAll('.join-config-row');
                    if (statRows.length === 0) { alertModal('请至少配置一个统计方式'); return; }

                    const statsConfig = [];
                    statRows.forEach(row => {
                        const field = row.querySelector('.stat-field-select').value;
                        const agg = row.querySelector('.stat-agg-select').value;
                        statsConfig.push({ field, agg });
                    });

                    document.body.removeChild(overlay);
                    const result = performGroupBy(tab, groupFields, statsConfig);
                    addTab(tab.name + '_分组统计', result);
                };
            }

            function performGroupBy(tab, groupFields, statsConfig) {
                const data = dfToArray(tab.df);
                const groups = new Map();
                data.forEach(row => {
                    const key = groupFields.map(f => row[f]).join('|||');
                    if (!groups.has(key)) groups.set(key, []);
                    groups.get(key).push(row);
                });

                const result = [];
                groups.forEach((rows, key) => {
                    const newRow = {};
                    const firstRow = rows[0];
                    groupFields.forEach(f => newRow[f] = firstRow[f]);
                    const usedNames = new Set(Object.keys(newRow));
                    statsConfig.forEach(cfg => {
                        const field = cfg.field;
                        const agg = cfg.agg;
                        const values = rows.map(r => r[field]).filter(v => v !== null && v !== undefined && v !== '');
                        const numericValues = values.map(v => Number(v)).filter(v => !isNaN(v));
                        let val;
                        let suffix;
                        switch (agg) {
                            case 'count':
                                val = values.length;
                                suffix = '计数';
                                break;
                            case 'max':
                                val = numericValues.length ? Math.max(...numericValues) : null;
                                suffix = '最大值';
                                break;
                            case 'min':
                                val = numericValues.length ? Math.min(...numericValues) : null;
                                suffix = '最小值';
                                break;
                            case 'mean':
                                val = numericValues.length ? round(numericValues.reduce((a, b) => a + b, 0) / numericValues.length, 3) : null;
                                suffix = '平均值';
                                break;
                            case 'sum':
                                val = numericValues.length ? round(numericValues.reduce((a, b) => a + b, 0), 3) : null;
                                suffix = '总值';
                                break;
                            default:
                                val = null;
                                suffix = '未知';
                        }
                        let colName = `${field}_${suffix}`;
                        let counter = 2;
                        while (usedNames.has(colName)) {
                            colName = `${field}_${suffix}_${counter}`;
                            counter++;
                        }
                        usedNames.add(colName);
                        newRow[colName] = val;
                    });
                    result.push(newRow);
                });
                return result;
            }

                    if (selectedFields.length < 2) { alertModal('请至少选择两个数值字段'); return; }
                    const method = methodSelect.value;
                    let nComponents, threshold;
                    if (method === 'variance') {
                        threshold = parseFloat(dialog.querySelector('#pcaVariance').value);
                        if (isNaN(threshold) || threshold <= 0 || threshold > 1) {
                            alertModal('请输入有效的累计贡献率(0~1)'); return;
                        }
                        nComponents = selectedFields.length;
                    } else {
                        nComponents = parseInt(dialog.querySelector('#pcaCount').value);
                        if (isNaN(nComponents) || nComponents < 1 || nComponents > selectedFields.length) {
                            alertModal(`主成分数量应在1~${selectedFields.length}之间`);

                    }
                    document.body.removeChild(overlay);

            function performPCA(tab, selectedFields, method, nComponents, threshold) {
                const data = dfToArray(tab.df);
                const validData = data.map((row, idx) => ({ ...row, __originalIndex: idx }))
                    .filter(row => selectedFields.every(f => row[f] !== null && row[f] !== undefined && row[f] !==
                        '' && !isNaN(Number(row[f]))));
                const usedRows = validData.length;
                if (usedRows === 0) { alertModal('所选字段没有有效数值数据'); return; }

                const numericMatrix = validData.map(row => selectedFields.map(f => Number(row[f])));
                const means = selectedFields.map((_, i) => numericMatrix.reduce((sum, row) => sum + row[i], 0) /
                    usedRows);
                const stds = selectedFields.map((_, i) => {
                    const variance = numericMatrix.reduce((sum, row) => sum + (row[i] - means[i]) ** 2, 0) / (
                        usedRows - 1 || 1);
                    return Math.sqrt(variance) || 1;
                });
                const standardizedMatrix = numericMatrix.map(row => row.map((val, i) => (val - means[i]) / stds[
                    i]));

                const pca = new ML.PCA(standardizedMatrix);
                const explainedVariance = pca.getExplainedVariance();

                let nComp;
                if (method === 'variance') {
                    let cumSum = 0;
                    nComp = 0;
                    for (let i = 0; i < explainedVariance.length; i++) {
                        cumSum += explainedVariance[i];
                        nComp++;
                        if (cumSum >= threshold) break;
                    }
                    if (nComp === 0) nComp = 1;
                } else {
                    nComp = Math.min(nComponents, explainedVariance.length);
                }

                const fullProjections = pca.predict(standardizedMatrix);
                const projections = fullProjections.to2DArray().map(row => row.slice(0, nComp));

                const newData = data.map((row, rowIndex) => {
                    const newRow = { ...row };
                    const validIdx = validData.findIndex(v => v.__originalIndex === rowIndex);
                    if (validIdx !== -1) {
                        const proj = projections[validIdx] || new Array(nComp).fill(null);
                        for (let i = 0; i < nComp; i++) {
                            const variancePct = (explainedVariance[i] * 100).toFixed(2);
                            newRow[`主成分${i + 1}_贡献率${variancePct}%`] = proj[i];
                        }
                    } else {
                        for (let i = 0; i < nComp; i++) {
                            const variancePct = (explainedVariance[i] * 100).toFixed(2);
                            newRow[`主成分${i + 1}_贡献率${variancePct}%`] = null;
                        }
                    }
                    return newRow;
                });

                addTab(tab.name + '_PCA', newData);
            }

            // ========== K-Means 聚类 ==========

                function getSelectedFields() {

                }

                function getValidData(selectedFields) {
                    const data = dfToArray(tab.df);
                    const validData = [];
                    const validIndices = [];
                    data.forEach((row, idx) => {
                        if (selectedFields.every(f => row[f] !== null && row[f] !== undefined && row[f] !==
                            '' && !isNaN(Number(row[f])))) {
                            validData.push(selectedFields.map(f => Number(row[f])));
                            validIndices.push(idx);
                        }
                    });
                    return { validData, validIndices };

                document.getElementById('cancelKMeans').onclick = () => document.body.removeChild(overlay);

                document.getElementById('computeSSE').onclick = async () => {
                    const selectedFields = getSelectedFields();
                    if (selectedFields.length === 0) { alertModal('请至少选择一个字段'); return; }
                    const minK = parseInt(document.getElementById('minK').value);
                    const maxK = parseInt(document.getElementById('maxK').value);
                    if (isNaN(minK) || isNaN(maxK) || minK < 1 || maxK < minK || maxK > 20) {
                        alertModal('请输入有效的 k 范围 (1-20)');
                        return;
                    }

                    const { validData } = getValidData(selectedFields);
                    if (validData.length < 2) {
                        alertModal('有效数据行数太少（少于2行），无法计算 SSE。');
                        return;
                    }
                    if (minK >= validData.length) {
                        alertModal(`最小 k (${minK}) 必须小于有效数据行数 (${validData.length})。请减少 k 或提供更多数据。`);
                        return;
                    }

                    sseResults = [];
                    for (let k = minK; k <= maxK; k++) {
                        if (k >= validData.length) break;
                        try {
                            const result = simpleKMeans(validData, k);
                            sseResults.push({ k, sse: result.sse });
                        } catch (e) {
                            console.warn(`k=${k} 计算失败:`, e);
                        }
                    }

                    if (sseResults.length === 0) {
                        alertModal('没有计算出任何 SSE 值，请检查数据量或 k 范围。');
                        return;
                    }

                    if (chart) chart.dispose();
                    chart = echarts.init(document.getElementById('sseChart'));
                    const option = {
                        backgroundColor: 'transparent',
                        title: { text: 'SSE vs K', left: 'center', textStyle: { color: '#cbd5e6', fontSize: 14 } },
                        tooltip: { trigger: 'axis' },
                        xAxis: { type: 'category', data: sseResults.map(d => d.k), axisLabel: { color: '#cbd5e6' } },
                        yAxis: { type: 'value', axisLabel: { color: '#cbd5e6' } },
                        series: [{
                            data: sseResults.map(d => d.sse),

                document.getElementById('confirmKMeans').onclick = () => {
                    const selectedFields = getSelectedFields();
                    if (selectedFields.length === 0) { alertModal('请至少选择一个字段'); return; }
                    const k = parseInt(document.getElementById('targetK').value);
                    if (isNaN(k) || k < 1 || k > 20) { alertModal('请输入有效的聚类个数(1-20)'); return; }

                    const { validData, validIndices } = getValidData(selectedFields);
                    if (validData.length < 2) {
                        alertModal('有效数据行数太少，无法进行聚类。');
                        return;
                    }
                    if (k >= validData.length) {
                        alertModal(`聚类个数 k (${k}) 必须小于有效数据行数 (${validData.length})。`);
                        return;
                    }

                    try {
                        const result = simpleKMeans(validData, k);
                        const labels = result.labels;

                        const data = dfToArray(tab.df);
                        const newData = data.map((row, idx) => {
                            const newRow = { ...row };
                            const pos = validIndices.indexOf(idx);
                            newRow['聚类标签'] = pos !== -1 ? labels[pos] : null;
                            return newRow;
                        });

                        addTab(tab.name + '_KMeans', newData);
                        document.body.removeChild(overlay);
                    } catch (e) {
                        alertModal('聚类失败：' + e.message);
                    }
                };
            }

                const arr = dfToArray(tab.df);
                const newData = arr.map(row => {
                    const nr = { ...row };
                    fields.forEach(f => {
                        if (nr[f] === null || nr[f] === undefined || nr[f] === '') {
                            if (fillMethod === 'mean' || fillMethod === 'median') {
                                const colData = arr.map(r => r[f]).filter(v => v !== null && v !==
                                    undefined && v !== '').map(Number);
                                if (colData.length) {
                                    colData.sort((a, b) => a - b);
                                    nr[f] = fillMethod === 'mean' ? round(colData.reduce((a, b) => a +
                                        b, 0) / colData.length, 3) : percentile(colData, 50);
                                } else nr[f] = fillValue || '';
                            } else nr[f] = fillValue || '';
                        }
                    });
                    return nr;
                });
                addTab(tab.name + '填补缺失值', newData);
            }

                    if (!seen.has(key)) {
                        seen.add(key);
                        newData.push(row);
                    }

            function performMergeWithDf(leftDf, rightDf, joinKeys, joinType) {
                const leftArr = dfToArray(leftDf);
                const rightArr = dfToArray(rightDf);

                function keyOf(row, keys) { return keys.map(k => row[k]).join('|||'); }
                const leftMap = new Map();
                leftArr.forEach(row => {
                    const key = keyOf(row, joinKeys.map(k => k.left));
                    if (!leftMap.has(key)) leftMap.set(key, []);
                    leftMap.get(key).push(row);
                });
                const rightMap = new Map();
                rightArr.forEach(row => {
                    const key = keyOf(row, joinKeys.map(k => k.right));
                    if (!rightMap.has(key)) rightMap.set(key, []);
                    rightMap.get(key).push(row);
                });
                let result = [];
                const allLeftKeys = new Set(leftMap.keys());
                const allRightKeys = new Set(rightMap.keys());
                if (joinType === 'inner') {
                    allLeftKeys.forEach(key => {
                        if (rightMap.has(key)) {
                            leftMap.get(key).forEach(lRow => {
                                rightMap.get(key).forEach(rRow => result.push({
                                    ...lRow,
                                    ...rRow
                                }));
                            });
                        }
                    });
                } else if (joinType === 'left') {
                    allLeftKeys.forEach(key => {
                        const lRows = leftMap.get(key) || [];
                        const rRows = rightMap.get(key) || [null];
                        lRows.forEach(lRow => rRows.forEach(rRow => result.push({
                            ...lRow, ...(rRow ||
                                {})
                        })));
                    });
                } else if (joinType === 'right') {
                    allRightKeys.forEach(key => {
                        const rRows = rightMap.get(key) || [];
                        const lRows = leftMap.get(key) || [null];
                        rRows.forEach(rRow => lRows.forEach(lRow => result.push({
                            ...(lRow || {}),
                            ...rRow
                        })));
                    });
                } else if (joinType === 'full') {
                    const allKeys = new Set([...allLeftKeys, ...allRightKeys]);
                    allKeys.forEach(key => {
                        const lRows = leftMap.get(key) || [null];
                        const rRows = rightMap.get(key) || [null];
                        lRows.forEach(lRow => rRows.forEach(rRow => result.push({
                            ...(lRow || {}),
                            ...(rRow || {})
                        })));
                    });
                }
                return result;
            }

            function performConcatWithMapping(topData, bottomData, mappings) {
                const topCols = topData.length ? Object.keys(topData[0]) : [];
                const bottomCols = bottomData.length ? Object.keys(bottomData[0]) : [];
                const mappedTopFields = new Set(mappings.map(m => m.top));
                const mappedBottomFields = new Set(mappings.map(m => m.bottom));
                const topOnlyCols = topCols.filter(c => !mappedTopFields.has(c));
                const bottomOnlyCols = bottomCols.filter(c => !mappedBottomFields.has(c));
                const topOnlySet = new Set(topOnlyCols);
                const bottomOnlyFinal = bottomOnlyCols.map(c => topOnlySet.has(c) ? c + '_下表' : c);
                const finalCols = [];
                mappings.forEach(m => finalCols.push(m.top));
                topOnlyCols.forEach(c => finalCols.push(c));
                bottomOnlyFinal.forEach(c => finalCols.push(c));
                const used = new Set();
                const uniqueCols = finalCols.map(col => {
                    let name = col,
                        i = 2;
                    while (used.has(name)) { name = col + '_' + i++; }
                    used.add(name);
                    return name;
                });
                const result = [];
                topData.forEach(row => {
                    const newRow = {};
                    mappings.forEach((m, idx) => { newRow[uniqueCols[idx]] = row[m.top]; });
                    topOnlyCols.forEach((col, idx) => {
                        newRow[uniqueCols[mappings.length + idx]] = row[
                            col];
                    });
                    bottomOnlyFinal.forEach((col, idx) => {
                        newRow[uniqueCols[mappings.length + topOnlyCols.length + idx]] = null;
                    });
                    result.push(newRow);
                });
                bottomData.forEach(row => {
                    const newRow = {};
                    mappings.forEach((m, idx) => { newRow[uniqueCols[idx]] = row[m.bottom]; });
                    topOnlyCols.forEach((col, idx) => { newRow[uniqueCols[mappings.length + idx]] = null; });
                    bottomOnlyFinal.forEach((col, idx) => {
                        const originalCol = bottomOnlyCols[idx];
                        newRow[uniqueCols[mappings.length + topOnlyCols.length + idx]] = row[
                            originalCol];
                    });
                    result.push(newRow);
                });
                return result;
            }
