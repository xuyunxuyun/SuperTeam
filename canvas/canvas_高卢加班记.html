<body>
<div class="calendar-app">
    <div class="toolbar">

                <button class="tech-btn" id="prevYearBtn">⏮ 前一年</button>

                <button class="tech-btn" id="nextMonthBtn">下月 ▶</button>
                <button class="tech-btn" id="nextYearBtn">后一年 ⏭</button>
                <button class="tech-btn" id="restoreTodayBtn">📍 回到今日</button>
                <input type="file" id="importFileInput" accept=".json" style="display: none;">
            </div>
            <div class="year-month-core" id="yearMonthDisplay">2026年06月</div>
            <div class="right-group">
                <div class="date-picker-jump">
                    <span>📅 跳转</span>
                    <input type="date" id="datePickerJump" value="2026-06-01">
                    <button class="tech-btn" id="confirmJumpBtn" style="padding: 3px 10px;">Go</button>
                    <button class="tech-btn" id="importMergeBtn" style="padding: 3px 10px;"><i class="fas fa-upload"></i> 导入合并</button>
                </div>
                <div class="theme-switch" id="themeToggle">
                    <span class="switch-icon" data-theme="light">☀️</span>
                    <span class="switch-icon" data-theme="dark">🌙</span>
                </div>
            </div>
        </div>
    </div>
    <div class="weekdays">
        <span>周一</span><span>周二</span><span>周三</span><span>周四</span><span>周五</span><span>周六</span><span>周日</span>
    </div>
    <div class="calendar-wrapper" id="calendarWrapper">
        <div class="calendar-grid" id="calendarGrid"></div>
    </div>

<!-- 自定义右键菜单 -->
<div id="contextMenu" class="context-menu">
    <div class="context-menu-item" id="ctxExportJson">
        <i class="fas fa-file-code"></i> 导出本月JSON数据
    </div>
    <div class="context-menu-divider"></div>
    <div class="context-menu-item" id="ctxExportPng">
        <i class="fas fa-camera"></i> 保存窗口为PNG
    </div>

<script>
    (function(){
        // 数据结构
        let todosDB = {};
        let labelsDB = {};
        
        let currentYear, currentMonth;
        let selectedDate = null;
        let currentView = 'month';
        
        const calendarGrid = document.getElementById('calendarGrid');
        const yearMonthSpan = document.getElementById('yearMonthDisplay');
        const calendarWrapper = document.getElementById('calendarWrapper');
        const datePickerJump = document.getElementById('datePickerJump');
        const importFileInput = document.getElementById('importFileInput');
        const contextMenu = document.getElementById('contextMenu');

        // 辅助函数
        function getTodayObject() { const d=new Date(); return { year:d.getFullYear(), month:d.getMonth(), day:d.getDate() }; }
        function formatDateKey(y,m,d){ return `${y}-${String(m+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`; }
        function generateId() { return Date.now() + Math.random() * 10000 + Math.floor(Math.random() * 10000); }

        // 加载/保存
        function loadTodos(){
            const s=localStorage.getItem('calendar_todos_app');
            if(s) try{todosDB=JSON.parse(s);}catch(e){todosDB={};}
            if(!todosDB) todosDB={};
            const sl=localStorage.getItem('calendar_labels_app');
            if(sl) try{labelsDB=JSON.parse(sl);}catch(e){labelsDB={};}
            if(!labelsDB) labelsDB={};
        }
        function persistTodos(){ localStorage.setItem('calendar_todos_app',JSON.stringify(todosDB)); }
        function persistLabels(){ localStorage.setItem('calendar_labels_app',JSON.stringify(labelsDB)); }
        
        function persistViewState(){
            localStorage.setItem('calendar_view_state',JSON.stringify({ year:currentYear, month:currentMonth, selectedDate, theme:document.body.classList.contains('dark')?'dark':'light' }));
        }
        function loadViewState(){
            const today = getTodayObject();
            let initialYear = today.year;
            let initialMonth = today.month;
            let initialSelectedDate = { year: today.year, month: today.month, day: today.day };
            let initialTheme = 'light';

            const s=localStorage.getItem('calendar_view_state');
            if(s){
                try{
                    const data=JSON.parse(s);
                    if(typeof data.year==='number' && typeof data.month==='number'){ 
                        initialYear = data.year; 
                        initialMonth = data.month; 
                    }
                    if(data.selectedDate) initialSelectedDate = data.selectedDate;
                    if(data.theme==='dark') initialTheme = 'dark';
                }catch(e){}
            }
            
            currentYear = initialYear;
            currentMonth = initialMonth;
            selectedDate = initialSelectedDate;
            
            if(currentMonth<0){ currentMonth=0; currentYear--; }
            if(currentMonth>11){ currentMonth=11; currentYear++; }
            
            if(initialTheme === 'dark'){ document.body.classList.add('dark'); updateThemeActive('dark');}
            else{ document.body.classList.remove('dark'); updateThemeActive('light');}
            
            datePickerJump.value = formatDateKey(selectedDate.year, selectedDate.month, selectedDate.day);
        }
        function updateThemeActive(theme){
            const icons=document.querySelectorAll('.switch-icon');
            icons.forEach(icon=>{
                if((theme==='dark' && icon.innerText==='🌙')||(theme==='light' && icon.innerText==='☀️')) icon.classList.add('active');
                else icon.classList.remove('active');
            });
        }
        function toggleTheme(){
            if(document.body.classList.contains('dark')){ document.body.classList.remove('dark'); updateThemeActive('light'); }
            else{ document.body.classList.add('dark'); updateThemeActive('dark'); }
            persistViewState();
        }
        function getTodoStats(y,m,d){ 
            const arr=todosDB[formatDateKey(y,m,d)]||[]; 
            const total=arr.length; 
            const completed=arr.filter(t=>t.done===true).length; 
            return {total,completed}; 
        }

        // 渲染月视图 (6行居中)
        function renderMonthView(){
            const firstDay = new Date(currentYear, currentMonth, 1);
            let startWeekday = firstDay.getDay();
            let adjustedStart = (startWeekday + 6) % 7;
            const daysInMonth = new Date(currentYear, currentMonth+1, 0).getDate();
            const prevMonthDays = new Date(currentYear, currentMonth, 0).getDate();
            const todayObj = getTodayObject();
            
            let totalNeeded = adjustedStart + daysInMonth;
            let rows = Math.ceil(totalNeeded / 7);
            let totalCells = rows * 7;
            if(totalCells < 42) totalCells = 42;
            let extraTopRows = 0;
            if(rows <= 4 && totalCells === 42){
                let targetRows = 6;
                let emptyRows = targetRows - rows;
                extraTopRows = Math.floor(emptyRows / 2);
            }
            
            let cells = [];
            for(let i=0; i<extraTopRows*7; i++){
                let refDate = new Date(currentYear, currentMonth, 1);
                refDate.setDate(refDate.getDate() - (extraTopRows*7 - i));
                let yy = refDate.getFullYear(), mm = refDate.getMonth(), dd = refDate.getDate();
                cells.push({ year: yy, month: mm, day: dd, isCurrent: false });
            }
            for(let i = adjustedStart - 1; i >= 0; i--) {
                let dayNum = prevMonthDays - i;
                let pYear = currentYear, pMonth = currentMonth-1;
                if(pMonth < 0) { pMonth = 11; pYear--; }
                cells.push({ year: pYear, month: pMonth, day: dayNum, isCurrent: false });
            }
            for(let d=1; d<=daysInMonth; d++) cells.push({ year: currentYear, month: currentMonth, day: d, isCurrent: true });
            let currentLen = cells.length;
            let needMore = totalCells - currentLen;
            for(let n=1; n<=needMore; n++){
                let nYear = currentYear, nMonth = currentMonth+1;
                if(nMonth > 11) { nMonth = 0; nYear++; }
                cells.push({ year: nYear, month: nMonth, day: n, isCurrent: false });
            }
            
            calendarGrid.innerHTML = '';
            cells.forEach((cell, idx) => {
                const cellDiv = document.createElement('div');
                cellDiv.className = 'day-cell';
                if(!cell.isCurrent) cellDiv.classList.add('other-month');
                const colIndex = idx % 7;
                if(colIndex === 5 || colIndex === 6) cellDiv.classList.add('weekend');
                const isToday = (cell.year === todayObj.year && cell.month === todayObj.month && cell.day === todayObj.day);
                if(isToday) cellDiv.classList.add('today');
                const isSelected = selectedDate && (cell.year === selectedDate.year && cell.month === selectedDate.month && cell.day === selectedDate.day);
                if(isSelected && !isToday) cellDiv.style.boxShadow = 'inset 0 0 0 2px #3b82f6';
                const daySpan = document.createElement('div');
                daySpan.className = 'day-number';
                daySpan.innerText = cell.day;
                cellDiv.appendChild(daySpan);
                const key = formatDateKey(cell.year, cell.month, cell.day);
                const labelInfo = labelsDB[key];
                if(labelInfo && labelInfo.text && labelInfo.text.trim() !== "") {
                    const labelSpan = document.createElement('div');
                    labelSpan.className = 'date-label';
                    labelSpan.innerText = labelInfo.text;
                    labelSpan.style.backgroundColor = labelInfo.color || '#e2e8f0';
                    const bgColor = labelInfo.color || '#e2e8f0';
                    const r = parseInt(bgColor.slice(1,3), 16);
                    const g = parseInt(bgColor.slice(3,5), 16);
                    const b = parseInt(bgColor.slice(5,7), 16);
                    const brightness = (r * 299 + g * 587 + b * 114) / 1000;
                    labelSpan.style.color = brightness > 128 ? '#1f2937' : 'white';
                    cellDiv.appendChild(labelSpan);
                }
                const stats = getTodoStats(cell.year, cell.month, cell.day);
                if(stats.total > 0){
                    const summary = document.createElement('div');
                    summary.className = 'todo-summary';
                    summary.innerHTML = `<span>📋 ${stats.total}</span> <span>✅ ${stats.completed}</span>`;
                    cellDiv.appendChild(summary);
                }
                cellDiv.addEventListener('click', (e) => {
                    e.stopPropagation();
                    contextMenu.style.display = 'none';
                    selectedDate = { year: cell.year, month: cell.month, day: cell.day };
                    renderMonthView();
                    persistViewState();
                });
                cellDiv.addEventListener('dblclick', (e) => {
                    e.stopPropagation();
                    openDayView(cell.year, cell.month, cell.day);
                });
                calendarGrid.appendChild(cellDiv);
            });
            yearMonthSpan.innerText = `${currentYear}年${String(currentMonth+1).padStart(2,'0')}月`;
        }

        // 日视图
        function openDayView(year,month,day){
            const key=formatDateKey(year,month,day);
            if(!todosDB[key]) todosDB[key]=[];
            if(!labelsDB[key]) labelsDB[key]={ text:"", color:"#94a3b8" };
            const overlay=document.createElement('div'); overlay.className='day-view-overlay';
            const card=document.createElement('div'); card.className='day-view-card';
            const header=document.createElement('div'); header.className='day-view-header';
            header.innerHTML=`<h2>📅 ${year}年${month+1}月${day}日 · 待办 & 标签</h2><div></div>`;
            const labelEditor=document.createElement('div'); labelEditor.className='label-editor';
            labelEditor.innerHTML=`
                <div class="label-input-group">
                    <span>🏷️ 标签：</span>
                    <input type="text" id="dateLabelInput" placeholder="例如: 纪念日 / 会议" maxlength="20">
                    <div class="color-preview" id="colorPreview" style="background-color: ${labelsDB[key].color || '#94a3b8'}"></div>
                    <input type="color" id="customColorPicker" value="${labelsDB[key].color || '#94a3b8'}">
                </div>
                <div class="color-palette" id="colorPalette">
                    ${['#3b82f6','#ef4444','#10b981','#f59e0b','#8b5cf6','#ec489a','#06b6d4','#94a3b8'].map(c=>`<div class="color-option" style="background-color:${c};" data-color="${c}"></div>`).join('')}
                </div>
            `;
            const todoContainer=document.createElement('div'); todoContainer.className='todo-list'; todoContainer.id='todoListContainer';
            const addSection=document.createElement('div'); addSection.className='add-todo';
            addSection.innerHTML=`<input type="text" id="newTodoInput" placeholder="✏️ 新的待办..." autocomplete="off"><button class="tech-btn" id="addTodoBtn">➕ 添加</button>`;
            const backDiv=document.createElement('div'); backDiv.style.display='flex'; backDiv.style.justifyContent='flex-end'; backDiv.style.marginTop='16px';
            const backBtn=document.createElement('button'); backBtn.innerText='← 返回月视图'; backBtn.className='back-btn';
            backDiv.appendChild(backBtn);
            card.appendChild(header); card.appendChild(labelEditor); card.appendChild(todoContainer); card.appendChild(addSection); card.appendChild(backDiv);
            overlay.appendChild(card); document.body.appendChild(overlay);

            const labelInput=document.getElementById('dateLabelInput');
            const colorPreview=document.getElementById('colorPreview');
            const customColorPicker=document.getElementById('customColorPicker');
            labelInput.value=labelsDB[key].text||'';
            let currentColor=labelsDB[key].color||'#94a3b8';
            const updateLabelAndColor = () => {
                const newText=labelInput.value.trim();
                labelsDB[key]={ text:newText, color:currentColor };
                if(newText==="") delete labelsDB[key];
                persistLabels(); 
                if(currentView==='month') renderMonthView();
            };
            labelInput.addEventListener('change', updateLabelAndColor);
            document.querySelectorAll('.color-option').forEach(opt=>{
                opt.addEventListener('click',()=>{
                    currentColor=opt.getAttribute('data-color');
                    colorPreview.style.backgroundColor=currentColor;
                    customColorPicker.value=currentColor;
                    updateLabelAndColor();
                });
            });
            customColorPicker.addEventListener('change',(e)=>{
                currentColor=e.target.value;
                colorPreview.style.backgroundColor=currentColor;
                updateLabelAndColor();
            });
            const renderTodoList=()=>{
                const container=document.getElementById('todoListContainer');
                if(!container) return;
                const items=todosDB[key]||[];
                container.innerHTML='';
                if(items.length===0){ container.innerHTML='<div class="empty-todo-placeholder">✨ 暂无待办，添加一条任务吧~</div>'; return; }
                items.forEach(todo=>{
                    const itemDiv=document.createElement('div'); itemDiv.className='todo-item';
                    const check=document.createElement('input'); check.type='checkbox'; check.className='todo-check'; check.checked=todo.done;
                    check.addEventListener('change',(e)=>{ todo.done=e.target.checked; persistTodos(); renderTodoList(); if(currentView==='month') renderMonthView(); });
                    const textInput=document.createElement('input'); textInput.type='text'; textInput.value=todo.text; textInput.className=`todo-text ${todo.done?'completed':''}`;
                    textInput.addEventListener('change',(e)=>{ let nv=e.target.value.trim(); if(nv) todo.text=nv; else todo.text='未命名'; persistTodos(); renderTodoList(); if(currentView==='month') renderMonthView(); });
                    textInput.addEventListener('keypress',(e)=>{ if(e.key==='Enter') textInput.blur(); });
                    const delBtn=document.createElement('button'); delBtn.innerHTML='🗑️'; delBtn.className='delete-todo';
                    delBtn.addEventListener('click',()=>{ if(confirm(`确定删除待办「${todo.text}」吗？`)){ const idx=items.findIndex(t=>t.id===todo.id); if(idx!==-1) items.splice(idx,1); if(items.length===0 && todosDB[key]) delete todosDB[key]; persistTodos(); renderTodoList(); if(currentView==='month') renderMonthView(); } });
                    itemDiv.appendChild(check); itemDiv.appendChild(textInput); itemDiv.appendChild(delBtn); container.appendChild(itemDiv);
                });
            };
            const addBtn=document.getElementById('addTodoBtn'); const newInput=document.getElementById('newTodoInput');
            const addHandler=()=>{ const tv=newInput.value.trim(); if(!tv){ alert('请输入待办内容'); return; } const nid=generateId(); const nt={ id:nid, text:tv, done:false }; if(!todosDB[key]) todosDB[key]=[]; todosDB[key].push(nt); persistTodos(); newInput.value=''; renderTodoList(); if(currentView==='month') renderMonthView(); };
            addBtn.addEventListener('click',addHandler); newInput.addEventListener('keypress',(e)=>{ if(e.key==='Enter') addHandler(); });
            const closeOverlay=()=>{ overlay.remove(); renderMonthView(); persistViewState(); currentView='month'; };
            backBtn.addEventListener('click',closeOverlay);
            renderTodoList(); currentView='day';
        }

        // 导出当前月份JSON (无提示)
        function exportCurrentMonth(){
            const year = currentYear;
            const month = currentMonth;
            const exportData = { year, month, data: {} };
            for(let day=1; day<=new Date(year, month+1, 0).getDate(); day++){
                const key = formatDateKey(year, month, day);
                const item = {};
                if(todosDB[key] && todosDB[key].length) {
                    item.todos = todosDB[key].map(todo => ({ id: todo.id, text: todo.text, done: todo.done === true }));
                }
                if(labelsDB[key] && labelsDB[key].text && labelsDB[key].text.trim()) {
                    item.label = { text: labelsDB[key].text, color: labelsDB[key].color };
                }
                if(Object.keys(item).length) exportData.data[key] = item;
            }
            const jsonStr = JSON.stringify(exportData, null, 2);
            const blob = new Blob([jsonStr], {type: 'application/json'});
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `calendar_${year}_${String(month+1).padStart(2,'0')}.json`;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
        }

        // 导出整个窗口为PNG (无提示)
        async function exportWindowAsPng(){
            const appElement = document.querySelector('.calendar-app');
            if(!appElement) return;
            try {
                const originalOverflow = document.body.style.overflow;
                document.body.style.overflow = 'hidden';
                const canvas = await html2canvas(appElement, {
                    backgroundColor: document.body.classList.contains('dark') ? '#0a0f1c' : '#f0f4fc',
                    scale: 2,
                    useCORS: true,
                    logging: false
                });
                document.body.style.overflow = originalOverflow;
                const link = document.createElement('a');
                const timestamp = new Date().toISOString().slice(0,19).replace(/:/g, '-');
                link.download = `calendar_${currentYear}_${String(currentMonth+1).padStart(2,'0')}_${timestamp}.png`;
                link.href = canvas.toDataURL();
                link.click();
            } catch(err) {
                console.error(err);
            }
        }

        // 导入合并
        function importAndMerge(file){
            const reader = new FileReader();
            reader.onload = (e) => {
                try{
                    const imported = JSON.parse(e.target.result);
                    if(typeof imported.year !== 'number' || typeof imported.month !== 'number' || !imported.data){
                        throw new Error('格式错误：缺少 year/month/data');
                    }
                    let addedTodos = 0, addedLabels = 0;
                    for(const [dateKey, value] of Object.entries(imported.data)){
                        if(value.todos && Array.isArray(value.todos)){
                            if(!todosDB[dateKey]) todosDB[dateKey] = [];
                            for(const todo of value.todos){
                                if(todo.id && todo.text !== undefined && typeof todo.text === 'string'){
                                    let isDone = false;
                                    if(typeof todo.done === 'boolean') isDone = todo.done;
                                    else if(typeof todo.completed === 'boolean') isDone = todo.completed;
                                    const exists = todosDB[dateKey].some(t => t.id === todo.id);
                                    if(!exists){
                                        todosDB[dateKey].push({ id: todo.id, text: todo.text, done: isDone });
                                        addedTodos++;
                                    }
                                }
                            }
                        }
                        if(value.label && value.label.text && typeof value.label.text === 'string' && value.label.text.trim()){
                            if(!labelsDB[dateKey]) labelsDB[dateKey] = {};
                            labelsDB[dateKey] = { text: value.label.text.trim(), color: (value.label.color && typeof value.label.color === 'string') ? value.label.color : '#94a3b8' };
                            addedLabels++;
                        }
                    }
                    persistTodos(); persistLabels(); renderMonthView();
                }catch(err){ alert('导入失败：' + err.message); }
            };
            reader.readAsText(file);
        }

        function changeMonth(delta){ let nm=currentMonth+delta, ny=currentYear; if(nm<0){ nm=11; ny--; } if(nm>11){ nm=0; ny++; } currentYear=ny; currentMonth=nm; renderMonthView(); persistViewState(); }
        function changeYear(delta){ currentYear+=delta; if(currentYear<1) currentYear=1; renderMonthView(); persistViewState(); }
        function restoreToToday(){ const t=getTodayObject(); currentYear=t.year; currentMonth=t.month; selectedDate={ year:t.year, month:t.month, day:t.day }; datePickerJump.value = formatDateKey(t.year, t.month, t.day); renderMonthView(); persistViewState(); }
        function jumpToDate(){
            const dateStr = datePickerJump.value;
            if(!dateStr) return;
            const parts = dateStr.split('-');
            if(parts.length === 3){
                const year = parseInt(parts[0]), month = parseInt(parts[1]) - 1, day = parseInt(parts[2]);
                const testDate = new Date(year, month, day);
                if(testDate.getFullYear() === year && testDate.getMonth() === month && testDate.getDate() === day){
                    currentYear = year; currentMonth = month; selectedDate = { year, month, day };
                    renderMonthView(); persistViewState();
                } else alert('无效日期');
            }
        }
        function initWheelScroll(){ if(calendarWrapper) calendarWrapper.addEventListener('wheel',(e)=>{ e.preventDefault(); e.deltaY>0?changeMonth(1):changeMonth(-1); },{ passive:false }); }
        
        // 自定义右键菜单 - 左键点击或点击日期格都可关闭菜单
        function initContextMenu(){
            document.addEventListener('contextmenu', (e) => {
                e.preventDefault();
                contextMenu.style.display = 'none';
                contextMenu.style.display = 'block';
                contextMenu.style.left = e.clientX + 'px';
                contextMenu.style.top = e.clientY + 'px';
            });
            
            const closeMenu = () => {
                contextMenu.style.display = 'none';
            };
            document.addEventListener('click', closeMenu);
            
            document.getElementById('ctxExportJson').addEventListener('click', (e) => {
                e.stopPropagation();
                exportCurrentMonth();
                contextMenu.style.display = 'none';
            });
            document.getElementById('ctxExportPng').addEventListener('click', (e) => {
                e.stopPropagation();
                exportWindowAsPng();
                contextMenu.style.display = 'none';
            });
            
            contextMenu.addEventListener('click', (e) => {
                e.stopPropagation();
            });
        }

        function bindControls(){
            document.getElementById('prevYearBtn').onclick=()=>changeYear(-1);
            document.getElementById('nextYearBtn').onclick=()=>changeYear(1);
            document.getElementById('prevMonthBtn').onclick=()=>changeMonth(-1);
            document.getElementById('nextMonthBtn').onclick=()=>changeMonth(1);
            document.getElementById('restoreTodayBtn').onclick=restoreToToday;
            document.getElementById('themeToggle').addEventListener('click',toggleTheme);
            document.getElementById('confirmJumpBtn').addEventListener('click',jumpToDate);
            document.getElementById('importMergeBtn').addEventListener('click',()=> importFileInput.click());
            importFileInput.addEventListener('change',(e)=>{ if(e.target.files.length) importAndMerge(e.target.files[0]); importFileInput.value=''; });
        }
        
        function init(){ loadTodos(); loadViewState(); bindControls(); initWheelScroll(); renderMonthView(); initContextMenu(); }
        init();
    })();
</script>
</body>
</html>
