<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>告别屁屁疼</title>
<style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
        --bg-deep: #0a0f1c;
        --bg-panel: #0f1422;
        --bg-card: #111827;
        --bg-elevated: #1a1f2e;
        --border-subtle: #2a3452;
        --border-glow: rgba(76, 154, 255, 0.4);
        --primary-blue: #4c9aff;
        --primary-blue-dark: #3b82f6;
        --primary-glow: rgba(76, 154, 255, 0.3);
        --text-primary: #e0e0e0;
        --text-secondary: #9aa9c1;
        --text-muted: #6b7a8f;
        --accent-success: #48bb78;
        --accent-warning: #f39c12;
        --accent-danger: #f56565;
        --shadow-card: 0 8px 24px rgba(0, 0, 0, 0.4);
    }

    html, body {
        width: 100%;
        height: 100%;
        overflow: hidden;
        font-family: 'Segoe UI', 'Inter', system-ui, -apple-system, sans-serif;
        background: var(--bg-deep);
        color: var(--text-primary);
        user-select: none;
    }

    .app {
        display: flex;
        flex-direction: column;
        height: 100vh;
        padding: 10px 14px;
        gap: 8px;
    }

    .app-header {
        flex-shrink: 0;
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 4px 6px;
    }
    .app-header h1 {
        font-size: 1.05rem;
        font-weight: 600;
        display: flex;
        align-items: center;
        gap: 10px;
        background: linear-gradient(135deg, #e0f2fe, #60a5fa);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
        letter-spacing: 0.3px;
    }
    .app-header h1 small {
        font-size: 0.72rem;
        font-weight: 400;
        color: var(--text-muted);
        -webkit-text-fill-color: var(--text-muted);
        margin-left: 6px;
    }

    /* ========== 控制栏：左右两组，右侧页码组 flex:1 占满剩余宽度 ========== */
    .control-bar {
        flex-shrink: 0;
        background: var(--bg-panel);
        border: 1px solid var(--border-subtle);
        border-radius: 14px;
        padding: 8px 14px;
        display: flex;
        align-items: center;
        gap: 18px;
        box-shadow: var(--shadow-card);
    }
    .control-bar .field-group {
        display: flex;
        align-items: center;
        gap: 8px;
        flex-wrap: nowrap;
    }
    .control-bar .field-group.file-group {
        flex-shrink: 0;
    }
    .control-bar .field-group.page-group {
        flex: 1 1 auto;
        min-width: 0; /* 允许压缩 */
    }
    .control-bar label {
        font-size: 0.78rem;
        color: var(--text-secondary);
        white-space: nowrap;
    }

    .file-btn {
        background: linear-gradient(135deg, var(--primary-blue), var(--primary-blue-dark));
        color: white;
        padding: 5px 14px;
        border-radius: 30px;
        font-size: 0.78rem;
        font-weight: 500;
        cursor: pointer;
        display: inline-flex;
        align-items: center;
        gap: 6px;
        transition: 0.15s;
        border: none;
        position: relative;
        overflow: hidden;
        white-space: nowrap;
    }
    .file-btn:hover {
        transform: translateY(-1px);
        box-shadow: 0 4px 14px var(--primary-glow);
    }
    .file-btn input[type="file"] {
        position: absolute;
        inset: 0;
        opacity: 0;
        cursor: pointer;
    }
    .file-name {
        font-size: 0.75rem;
        color: var(--text-muted);
        max-width: 200px;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
    }

    /* ========== 滑块容器：占据 page-group 的剩余宽度 ========== */
    .slider-wrap {
        flex: 1 1 auto;
        min-width: 80px;
        display: flex;
        flex-direction: column;
        gap: 2px;
        position: relative;
    }

    .page-slider {
        width: 100%;
        height: 4px;
        -webkit-appearance: none;
        appearance: none;
        background: var(--border-subtle);
        border-radius: 4px;
        outline: none;
        cursor: pointer;
    }
    .page-slider::-webkit-slider-thumb {
        -webkit-appearance: none;
        width: 14px;
        height: 14px;
        border-radius: 50%;
        background: var(--primary-blue);
        cursor: pointer;
        box-shadow: 0 0 8px var(--primary-glow);
        transition: transform 0.1s;
    }
    .page-slider::-webkit-slider-thumb:hover {
        transform: scale(1.15);
    }
    .page-slider::-moz-range-thumb {
        width: 14px;
        height: 14px;
        border: none;
        border-radius: 50%;
        background: var(--primary-blue);
        cursor: pointer;
    }

    /* 滑块刻度 */
    .slider-ticks {
        position: relative;
        height: 12px;
        margin-top: 2px;
        width: 100%;
    }
    .slider-tick {
        position: absolute;
        top: 0;
        transform: translateX(-50%);
        display: flex;
        flex-direction: column;
        align-items: center;
        pointer-events: none;
    }
    .slider-tick::before {
        content: '';
        width: 1px;
        height: 4px;
        background: var(--border-subtle);
        margin-bottom: 1px;
    }
    .slider-tick-label {
        font-size: 0.6rem;
        color: var(--text-muted);
        font-variant-numeric: tabular-nums;
        white-space: nowrap;
    }
    .slider-tick.tick-active::before {
        background: var(--primary-blue);
        height: 6px;
    }
    .slider-tick.tick-active .slider-tick-label {
        color: var(--primary-blue);
        font-weight: 600;
    }

    .page-num-input {
        width: 62px;
        padding: 4px 6px;
        background: var(--bg-elevated);
        border: 1px solid var(--border-subtle);
        border-radius: 8px;
        color: var(--text-primary);
        font-size: 0.78rem;
        outline: none;
        text-align: center;
        flex-shrink: 0;
    }
    .page-num-input:focus {
        border-color: var(--primary-blue);
        box-shadow: 0 0 0 2px var(--primary-glow);
    }
    .page-badge {
        background: rgba(76, 154, 255, 0.12);
        color: var(--primary-blue);
        padding: 3px 12px;
        border-radius: 20px;
        font-size: 0.75rem;
        font-weight: 500;
        white-space: nowrap;
        flex-shrink: 0;
    }
    .file-stats {
        font-size: 0.72rem;
        color: var(--text-muted);
        white-space: nowrap;
        flex-shrink: 0;
    }

    .main-panel {
        flex: 1 1 0;
        min-height: 0;
        display: flex;
        gap: 10px;
    }

    .text-col {
        flex: 1 1 0;
        min-width: 0;
        display: flex;
        flex-direction: column;
        background: var(--bg-panel);
        border: 1px solid var(--border-subtle);
        border-radius: 14px;
        overflow: hidden;
        box-shadow: var(--shadow-card);
    }

    .col-header {
        flex-shrink: 0;
        padding: 7px 12px;
        background: rgba(26, 31, 46, 0.7);
        border-bottom: 1px solid var(--border-subtle);
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
        flex-wrap: wrap;
    }
    .col-title {
        font-size: 0.78rem;
        font-weight: 600;
        color: var(--primary-blue);
        display: flex;
        align-items: center;
        gap: 6px;
        white-space: nowrap;
    }
    .col-actions {
        display: flex;
        gap: 5px;
        flex-wrap: wrap;
    }

    .btn-sm {
        background: var(--bg-elevated);
        border: 1px solid var(--border-subtle);
        color: var(--text-secondary);
        padding: 3px 10px;
        border-radius: 20px;
        font-size: 0.72rem;
        cursor: pointer;
        transition: 0.15s;
        white-space: nowrap;
        display: inline-flex;
        align-items: center;
        gap: 4px;
    }
    .btn-sm:hover {
        background: rgba(76, 154, 255, 0.15);
        border-color: var(--primary-blue);
        color: var(--text-primary);
    }
    .btn-sm.primary {
        background: linear-gradient(135deg, var(--primary-blue), var(--primary-blue-dark));
        border-color: transparent;
        color: white;
    }
    .btn-sm.primary:hover {
        box-shadow: 0 4px 12px var(--primary-glow);
        transform: translateY(-1px);
    }

    textarea {
        flex: 1 1 0;
        min-height: 0;
        width: 100%;
        border: none;
        background: var(--bg-card);
        color: var(--text-primary);
        padding: 10px 12px;
        font-family: 'Consolas', 'Monaco', 'Fira Code', monospace;
        font-size: 0.76rem;
        line-height: 1.5;
        resize: none;
        outline: none;
        overflow: auto;
    }
    textarea::-webkit-scrollbar { width: 6px; height: 6px; }
    textarea::-webkit-scrollbar-track { background: transparent; }
    textarea::-webkit-scrollbar-thumb { background: var(--border-subtle); border-radius: 4px; }
    textarea::-webkit-scrollbar-thumb:hover { background: var(--primary-blue); }

    .log-section {
        flex-shrink: 0;
        background: var(--bg-panel);
        border: 1px solid var(--border-subtle);
        border-radius: 14px;
        overflow: hidden;
        transition: all 0.25s ease;
    }
    .log-header {
        padding: 7px 14px;
        background: rgba(26, 31, 46, 0.7);
        display: flex;
        align-items: center;
        justify-content: space-between;
        cursor: pointer;
        user-select: none;
    }
    .log-header:hover {
        background: rgba(76, 154, 255, 0.08);
    }
    .log-title {
        font-size: 0.78rem;
        font-weight: 600;
        color: var(--primary-blue);
        display: flex;
        align-items: center;
        gap: 6px;
    }
    .log-chevron {
        font-size: 0.7rem;
        color: var(--text-muted);
        transition: transform 0.25s;
        margin-left: 6px;
    }
    .log-header.open .log-chevron {
        transform: rotate(90deg);
        color: var(--primary-blue);
    }
    .log-body {
        max-height: 0;
        overflow: hidden;
        transition: max-height 0.3s ease;
    }
    .log-body.open {
        max-height: 150px;
    }
    .log-inner {
        padding: 8px 14px;
        font-family: 'Consolas', 'Monaco', monospace;
        font-size: 0.72rem;
        line-height: 1.5;
        color: #cbd5e6;
        height: 142px;
        overflow-y: auto;
        background: var(--bg-card);
        white-space: pre-wrap;
        word-break: break-word;
    }
    .log-inner::-webkit-scrollbar { width: 6px; }
    .log-inner::-webkit-scrollbar-track { background: transparent; }
    .log-inner::-webkit-scrollbar-thumb { background: var(--border-subtle); border-radius: 4px; }
    .log-line { border-bottom: 1px solid rgba(42, 52, 82, 0.4); padding: 2px 0; }
    .log-line.error { color: #f87171; }
    .log-line.warn { color: #fbbf24; }
    .log-line.success { color: #4ade80; }

    /* ========== 小屏适配 ========== */
    @media (max-width: 900px) {
        .control-bar {
            flex-wrap: wrap;
            gap: 10px 14px;
        }
        .control-bar .field-group.page-group {
            flex-basis: 100%;
        }
        .file-stats { display: none; }
    }
    @media (max-width: 860px) {
        .main-panel { flex-direction: column; }
    }
</style>
</head>
<body>
<div class="app">

    <div class="app-header">
        <h1>📄 告别屁屁疼 <small>纯前端 · PPT 单页 XML 复刻 · 浏览器内下载新 PPTX</small></h1>
    </div>

    <!-- 控制栏：左侧文件组固定宽度，右侧页码组 flex:1 占满剩余空间 -->
    <div class="control-bar">
        <div class="field-group file-group">
            <label>模板：</label>
            <label class="file-btn" for="fileInput">📂 上传 PPTX
                <input type="file" id="fileInput" accept=".pptx">
            </label>
            <span class="file-name" id="fileNameDisplay">未选择文件</span>
        </div>

        <div class="field-group page-group">
            <label>页码：</label>
            <div class="slider-wrap">
                <input type="range" class="page-slider" id="pageSlider" min="1" max="2" value="1" step="1">
                <div class="slider-ticks" id="sliderTicks"></div>
            </div>
            <input type="number" class="page-num-input" id="pageNumber" min="1" max="2" value="1" step="1">
            <span class="page-badge" id="pageLabel">第 1 页 / 共 ? 页</span>
        </div>

        <span class="file-stats" id="fileStats"></span>
    </div>

    <div class="main-panel">
        <div class="text-col">
            <div class="col-header">
                <span class="col-title">📝 提示词（复制给 DeepSeek）</span>
                <div class="col-actions">
                    <button class="btn-sm" id="genPromptBtn">生成提示词</button>
                    <button class="btn-sm" id="copyPromptBtn">复制</button>
                    <button class="btn-sm" id="clearPromptBtn">清空</button>
                </div>
            </div>
            <textarea id="promptArea" placeholder="点击「生成提示词」后在此显示..."></textarea>
        </div>

        <div class="text-col">
            <div class="col-header">
                <span class="col-title">💻 粘贴 DeepSeek 生成的 JS 代码（源码框内）</span>
                <div class="col-actions">
                    <button class="btn-sm" id="pasteCodeBtn">粘贴</button>
                    <button class="btn-sm primary" id="runCodeBtn">▶ 运行代码</button>
                    <button class="btn-sm" id="clearCodeBtn">清空</button>
                </div>
            </div>
            <textarea id="codeArea" placeholder="在此粘贴纯 JavaScript 代码片段（不要 HTML、不要 ``` 包裹）..."></textarea>
        </div>
    </div>

    <div class="log-section">
        <div class="log-header" id="logHeader">
            <span class="log-title">
                📋 运行日志
                <span class="log-chevron" id="logChevron">▶</span>
            </span>
            <button class="btn-sm" id="clearLogBtn">清空日志</button>
        </div>
        <div class="log-body" id="logBody">
            <div class="log-inner" id="logArea">
                <div class="log-line">等待操作...</div>
            </div>
        </div>
    </div>

</div>

<script>
(function() {
    const NS = {
        a: 'http://schemas.openxmlformats.org/drawingml/2006/main',
        p: 'http://schemas.openxmlformats.org/presentationml/2006/main',
        r: 'http://schemas.openxmlformats.org/officeDocument/2006/relationships',
        rel: 'http://schemas.openxmlformats.org/package/2006/relationships'
    };

    let currentFileBuffer = null;
    let currentFileName = '';
    let totalPages = 0;
    let pageNumbers = [];
    let isUpdating = false;

    const fileInput = document.getElementById('fileInput');
    const fileNameDisplay = document.getElementById('fileNameDisplay');
    const fileStats = document.getElementById('fileStats');
    const pageSlider = document.getElementById('pageSlider');
    const pageNumber = document.getElementById('pageNumber');
    const pageLabel = document.getElementById('pageLabel');
    const sliderTicks = document.getElementById('sliderTicks');
    const promptArea = document.getElementById('promptArea');
    const codeArea = document.getElementById('codeArea');
    const logArea = document.getElementById('logArea');
    const logHeader = document.getElementById('logHeader');
    const logBody = document.getElementById('logBody');

    function log(msg, level) {
        const div = document.createElement('div');
        div.className = 'log-line' + (level ? ' ' + level : '');
        div.textContent = msg;
        logArea.appendChild(div);
        logArea.scrollTop = logArea.scrollHeight;
    }
    function clearLog() {
        logArea.innerHTML = '';
        log('日志已清空');
    }

    logHeader.addEventListener('click', (e) => {
        if (e.target.closest('#clearLogBtn')) return;
        logHeader.classList.toggle('open');
        logBody.classList.toggle('open');
    });
    document.getElementById('clearLogBtn').addEventListener('click', (e) => {
        e.stopPropagation();
        clearLog();
    });

    // ========== 页码刻度：动态生成 ==========
    // 根据当前 totalPages 生成 5 个均匀分布的刻度（或 totalPages+1 个，若页数 ≤ 10）
    function renderSliderTicks() {
        if (!sliderTicks) return;
        sliderTicks.innerHTML = '';

        const min = parseInt(pageSlider.min) || 1;
        const max = parseInt(pageSlider.max) || 1;
        if (max <= min) return;

        // 决定刻度数量：页数少则每页一个，页数多则均匀 5 个
        const span = max - min + 1;
        let tickValues = [];
        if (span <= 12) {
            // 每页一个刻度
            for (let v = min; v <= max; v++) tickValues.push(v);
        } else {
            // 均匀 5 个：min, 1/4, 1/2, 3/4, max
            const q = (max - min) / 4;
            tickValues = [
                min,
                Math.round(min + q),
                Math.round(min + q * 2),
                Math.round(min + q * 3),
                max
            ];
            // 去重
            tickValues = [...new Set(tickValues)];
        }

        tickValues.forEach(v => {
            const pct = ((v - min) / (max - min)) * 100;
            const tick = document.createElement('div');
            tick.className = 'slider-tick';
            tick.dataset.value = v;
            tick.style.left = pct + '%';
            // 判断是否"当前值"——当前值就在这个刻度附近就激活
            const current = parseInt(pageSlider.value);
            if (current === v) tick.classList.add('tick-active');
            tick.innerHTML = `<span class="slider-tick-label">${v}</span>`;
            sliderTicks.appendChild(tick);
        });
    }

    // 更新刻度激活态（滑动时调用，不重建 DOM，性能好）
    function updateTickActive() {
        if (!sliderTicks) return;
        const current = parseInt(pageSlider.value);
        const ticks = sliderTicks.querySelectorAll('.slider-tick');
        ticks.forEach(t => {
            const v = parseInt(t.dataset.value);
            t.classList.toggle('tick-active', v === current);
        });
    }

    function applyPage(v) {
        if (isUpdating) return;
        isUpdating = true;
        try {
            if (totalPages > 0) v = Math.max(1, Math.min(v, totalPages));
            else v = Math.max(1, v);
            pageNumber.value = v;
            pageSlider.value = v;
            pageLabel.textContent = totalPages > 0
                ? `第 ${v} 页 / 共 ${totalPages} 页`
                : `第 ${v} 页 / 共 ? 页`;
            updateTickActive();
        } finally {
            isUpdating = false;
        }
    }
    pageSlider.addEventListener('input', (e) => applyPage(parseInt(e.target.value)));
    pageNumber.addEventListener('change', () => {
        const v = parseInt(pageNumber.value);
        if (isNaN(v)) { applyPage(parseInt(pageNumber.value) || 1); return; }
        applyPage(v);
    });
    pageNumber.addEventListener('blur', () => applyPage(parseInt(pageNumber.value) || 1));

    // 窗口尺寸变化时，刻度自动重排（百分比 left 天然自适应，无需重算；
    // 但如果想做得更精细，可在这里重排。这里只重建一次，靠 CSS 百分比即可）
    window.addEventListener('resize', () => {
        // 百分比定位在 CSS 中已自适应，无需重建。仅保证激活态正确。
        updateTickActive();
    });

    fileInput.addEventListener('change', async (e) => {
        const file = e.target.files[0];
        if (!file) return;
        fileNameDisplay.textContent = file.name;
        currentFileName = file.name;

        try {
            const buf = await file.arrayBuffer();
            currentFileBuffer = buf;
            const zip = await JSZip.loadAsync(buf);
            const slideFiles = zip.file(/^ppt\/slides\/slide\d+\.xml$/);
            const nums = slideFiles.map(f => {
                const m = f.name.match(/slide(\d+)\.xml$/);
                return m ? parseInt(m[1]) : null;
            }).filter(n => n !== null).sort((a, b) => a - b);
            const maxNum = nums.length ? Math.max(...nums) : 0;
            totalPages = maxNum;
            pageNumbers = nums;

            if (maxNum > 0) {
                pageSlider.min = 1; pageSlider.max = maxNum;
                pageNumber.min = 1; pageNumber.max = maxNum;
                applyPage(Math.min(1, maxNum));
                renderSliderTicks();
                log(`模板共 ${maxNum} 页（实际编号：${nums.join(', ')}）`, 'success');
                if (nums.length && nums[nums.length - 1] !== maxNum) {
                    log(`⚠️ slide 编号不连续，页码对应文件名 slideN.xml`, 'warn');
                }
            } else {
                pageSlider.min = 1; pageSlider.max = 2;
                pageNumber.min = 1; pageNumber.max = 2;
                applyPage(1);
                renderSliderTicks();
                log('⚠️ 模板中未找到任何 slide', 'warn');
            }
            fileStats.textContent = `${(file.size / 1024).toFixed(1)} KB · 共 ${totalPages} 页`;
            log(`已加载模板: ${file.name}`, 'success');
        } catch (err) {
            log(`❌ 解析文件失败: ${err.message}`, 'error');
            currentFileBuffer = null;
            totalPages = 0;
            fileStats.textContent = '';
        }
    });

    async function readSrcSlide(zip, page) {
        const srcSlidePath = `ppt/slides/slide${page}.xml`;
        const srcRelsPath = `ppt/slides/_rels/slide${page}.xml.rels`;

        const slideFile = zip.file(srcSlidePath);
        if (!slideFile) {
            const slideFiles = zip.file(/^ppt\/slides\/slide\d+\.xml$/);
            const nums = slideFiles.map(f => {
                const m = f.name.match(/slide(\d+)\.xml$/);
                return m ? m[1] : '';
            }).filter(Boolean).sort((a, b) => parseInt(a) - parseInt(b));
            throw new Error(`模板中不存在 ${srcSlidePath}。\n模板实际包含的 slide 编号：${nums.length ? nums.join(', ') : '（无）'}`);
        }

        const slideArrayBuffer = await slideFile.async('arraybuffer');
        const slideXmlStr = new TextDecoder('utf-8').decode(slideArrayBuffer);

        let relsXmlStr = null;
        const relsFile = zip.file(srcRelsPath);
        if (relsFile) {
            const relsBuf = await relsFile.async('arraybuffer');
            relsXmlStr = new TextDecoder('utf-8').decode(relsBuf);
        }

        const parser = new DOMParser();
        const slideDoc = parser.parseFromString(slideXmlStr, 'application/xml');
        const parseError = slideDoc.querySelector('parsererror');
        if (parseError) throw new Error(`源页 XML 解析失败: ${parseError.textContent}`);

        return { slideArrayBuffer, slideXmlStr, relsXmlStr, slideDoc };
    }

    function collectShapes(slideDoc) {
        const shapes = [];
        const spTree = slideDoc.getElementsByTagNameNS(NS.p, 'spTree')[0];
        if (!spTree) return shapes;

        for (const child of Array.from(spTree.children)) {
            const tag = child.localName;
            if (!['sp', 'pic', 'graphicFrame', 'grpSp'].includes(tag)) continue;

            const cNvPr = child.getElementsByTagNameNS(NS.p, 'cNvPr')[0];
            const name = cNvPr ? cNvPr.getAttribute('name') || '' : '';
            const id = cNvPr ? cNvPr.getAttribute('id') || '' : '';

            let x = '', y = '', cx = '', cy = '';
            const xfrm = child.getElementsByTagNameNS(NS.a, 'xfrm')[0];
            if (xfrm) {
                const off = xfrm.getElementsByTagNameNS(NS.a, 'off')[0];
                const ext = xfrm.getElementsByTagNameNS(NS.a, 'ext')[0];
                if (off) { x = off.getAttribute('x') || ''; y = off.getAttribute('y') || ''; }
                if (ext) { cx = ext.getAttribute('cx') || ''; cy = ext.getAttribute('cy') || ''; }
            }

            const texts = [];
            for (const t of child.getElementsByTagNameNS(NS.a, 't')) {
                if (t.textContent && t.textContent.trim()) texts.push(t.textContent);
            }
            shapes.push({ kind: tag, name, id, x, y, cx, cy, texts });
        }
        return shapes;
    }

    function collectATTexts(slideDoc) {
        const texts = [];
        for (const t of slideDoc.getElementsByTagNameNS(NS.a, 't')) {
            if (t.textContent && t.textContent.trim()) texts.push(t.textContent);
        }
        return texts;
    }

    async function collectDiagrams(zip, slideRelsXml) {
        const diagrams = [];
        if (!slideRelsXml) return diagrams;
        try {
            const parser = new DOMParser();
            const relsDoc = parser.parseFromString(slideRelsXml, 'application/xml');
            const rels = relsDoc.getElementsByTagNameNS(NS.rel, 'Relationship');
            const drawingPaths = [];

            for (const rel of rels) {
                const target = rel.getAttribute('Target') || '';
                const type = rel.getAttribute('Type') || '';
                if (target.includes('diagrams/drawing') || type.endsWith('/diagramDrawing')) {
                    let dPath = target;
                    if (!dPath.startsWith('ppt/')) dPath = 'ppt/slides/' + dPath;
                    dPath = dPath.replace(/\/\.\//g, '/').replace(/[^/]+\/\.\.\//g, '');
                    drawingPaths.push(dPath);
                }
            }

            for (const drPath of drawingPaths) {
                const drFile = zip.file(drPath);
                if (!drFile) continue;
                const drBuf = await drFile.async('arraybuffer');
                const drStr = new TextDecoder('utf-8').decode(drBuf);
                diagrams.push({ path: drPath, content: drStr });

                const drDir = drPath.substring(0, drPath.lastIndexOf('/'));
                const drBase = drPath.substring(drPath.lastIndexOf('/') + 1);
                const drRelsPath = `${drDir}/_rels/${drBase}.rels`;
                const drRelsFile = zip.file(drRelsPath);
                if (drRelsFile) {
                    try {
                        const drRelsBuf = await drRelsFile.async('arraybuffer');
                        const drRelsStr = new TextDecoder('utf-8').decode(drRelsBuf);
                        const drRelsDoc = parser.parseFromString(drRelsStr, 'application/xml');
                        for (const r of drRelsDoc.getElementsByTagNameNS(NS.rel, 'Relationship')) {
                            const t = r.getAttribute('Target') || '';
                            const ty = r.getAttribute('Type') || '';
                            if (t.includes('diagrams/data') || ty.endsWith('/diagramData')) {
                                let dataPath = t;
                                if (!dataPath.startsWith('ppt/')) {
                                    dataPath = drDir + '/' + dataPath;
                                    dataPath = dataPath.replace(/\/\.\//g, '/').replace(/[^/]+\/\.\.\//g, '');
                                }
                                const dataFile = zip.file(dataPath);
                                if (dataFile) {
                                    const dataBuf = await dataFile.async('arraybuffer');
                                    const dataStr = new TextDecoder('utf-8').decode(dataBuf);
                                    diagrams.push({ path: dataPath, content: dataStr });
                                }
                            }
                        }
                    } catch (e) { /* ignore */ }
                }
            }
        } catch (e) { console.warn('collectDiagrams error', e); }
        return diagrams;
    }

            log(`✅ 已生成提示词：slide${srcNum}.xml（第 ${page} 页），${shapes.length} 个形状，${aTTexts.length} 个 <a:t>，${diagramBlocks.length} 个 diagram XML，共 ${prompt.length} 字符`, 'success');
        } catch (err) {
            alert(`生成提示词失败: ${err.message}`);
            log(`❌ 生成提示词失败: ${err.message}`, 'error');
        }
    }

    function copyPrompt() {
        const content = promptArea.value.trim();
        if (!content) { log('⚠️ 没有可复制的提示词', 'warn'); return; }
        navigator.clipboard.writeText(content).then(() => {
            log(`✅ 提示词已复制到剪贴板（${content.length} 字符）`, 'success');
        }).catch(() => {
            promptArea.select();
            document.execCommand('copy');
            log('✅ 提示词已复制（fallback）', 'success');
        });
    }

    async function pasteCode() {
        try {
            const text = await navigator.clipboard.readText();
            if (!text.trim()) { alert('剪贴板内容为空'); return; }
            codeArea.value = text;
            log(`已从剪贴板粘贴代码，共 ${text.length} 字符`);
        } catch (err) {
            alert('无法读取剪贴板，请手动粘贴');
            log('❌ 读取剪贴板失败', 'error');
        }
    }

    function clearPrompt() { promptArea.value = ''; }
    function clearCode() { codeArea.value = ''; }

    async function runCode() {
        if (!currentFileBuffer) { alert('请先上传 PPTX 模板'); return; }
        let code = codeArea.value.trim();
        if (!code) { alert('请先粘贴 JavaScript 代码'); return; }

        code = code.replace(/^```(?:javascript|js)?\s*\n?/i, '').replace(/\n?```\s*$/i, '').trim();

        const page = parseInt(pageNumber.value);
        if (isNaN(page)) { alert('页码无效'); return; }

        log('='.repeat(60));
        log(`模板：${currentFileName}`);
        log(`源页：slide${page}.xml（第 ${page} 页）`);
        log('开始执行代码...');

        let srcSlideXml, srcRelsXml, srcNum;
        try {
            const zip = await JSZip.loadAsync(currentFileBuffer);
            const result = await readSrcSlide(zip, page);
            srcSlideXml = result.slideXmlStr;
            srcRelsXml = result.relsXmlStr;
            srcNum = page;
        } catch (err) {
            alert(`读取源页失败：${err.message}`);
            log(`❌ 读取源页失败：${err.message}`, 'error');
            return;
        }

        const defaultName = (currentFileName.replace(/\.pptx$/i, '') || 'output') + '_新页.pptx';
        const outputName = prompt('保存生成的文件名（.pptx）', defaultName);
        if (!outputName) { log('用户取消保存'); return; }
        const finalName = outputName.endsWith('.pptx') ? outputName : outputName + '.pptx';

        const templateZip = await JSZip.loadAsync(currentFileBuffer);

        const downloadPptx = (blob, filename) => {
            if (!(blob instanceof Blob)) {
                throw new Error('downloadPptx 的第一个参数必须是 Blob，实际收到: ' + Object.prototype.toString.call(blob));
            }
            const a = document.createElement('a');
            a.href = URL.createObjectURL(blob);
            a.download = filename || 'output.pptx';
            document.body.appendChild(a);
            a.click();
            setTimeout(() => {
                document.body.removeChild(a);
                URL.revokeObjectURL(a.href);
            }, 100);
            log(`✅ 已触发下载：${a.download}`, 'success');
        };

        const safeFetch = function(url, ...args) {
            const s = String(url);
            if (s.startsWith('file:') || s.includes(':\\') || s.startsWith('/') || s.endsWith('.pptx')) {
                throw new Error(
                    '❌ 禁止用 fetch 读取本地文件（CORS 会拦截 file:// 请求）。\n' +
                    '请使用已注入的 templateZip / templateArrayBuffer / SRC_SLIDE_XML。\n' +
                    '被拦截的 URL: ' + s
                );
            }
            return window.fetch(url, ...args);
        };

        const P_NS  = 'http://schemas.openxmlformats.org/presentationml/2006/main';
        const A_NS  = 'http://schemas.openxmlformats.org/drawingml/2006/main';
        const R_NS  = 'http://schemas.openxmlformats.org/officeDocument/2006/relationships';
        const REL_NS= 'http://schemas.openxmlformats.org/package/2006/relationships';
        const CT_NS = 'http://schemas.openxmlformats.org/package/2006/content-types';

        function parseXml(xmlStr) {
            const parser = new DOMParser();
            const doc = parser.parseFromString(xmlStr, 'application/xml');
            const err = doc.querySelector('parsererror');
            if (err) throw new Error('XML 解析失败: ' + err.textContent);
            return doc;
        }

        function serializeXml(doc) {
            return new XMLSerializer().serializeToString(doc);
        }

        function findSpByName(root, name) {
            for (const tag of ['sp', 'pic', 'graphicFrame', 'grpSp']) {
                const nodes = root.getElementsByTagNameNS(P_NS, tag);
                for (const n of nodes) {
                    const cNvPr = n.getElementsByTagNameNS(P_NS, 'cNvPr')[0];
                    if (cNvPr && cNvPr.getAttribute('name') === name) return n;
                }
            }
            return null;
        }

        function findSpById(root, id) {
            for (const tag of ['sp', 'pic', 'graphicFrame', 'grpSp']) {
                const nodes = root.getElementsByTagNameNS(P_NS, tag);
                for (const n of nodes) {
                    const cNvPr = n.getElementsByTagNameNS(P_NS, 'cNvPr')[0];
                    if (cNvPr && String(cNvPr.getAttribute('id')) === String(id)) return n;
                }
            }
            return null;
        }

        function replaceInSp(sp, oldText, newText) {
            let cnt = 0;
            const tNodes = sp.getElementsByTagNameNS(A_NS, 't');
            for (const t of tNodes) {
                if (t.textContent === oldText) { t.textContent = newText; cnt++; }
            }
            if (cnt === 0) console.log('[warn] 形状内未找到: ' + JSON.stringify(oldText));
            return cnt;
        }

        const sandbox = {
            SRC_SLIDE_XML: srcSlideXml,
            SRC_RELS_XML: srcRelsXml,
            SRC_SLIDE_NUM: srcNum,
            TEMPLATE_PATH: currentFileName,
            OUTPUT_PATH: finalName,
            JSZip: JSZip,
            templateZip: templateZip,
            templateArrayBuffer: currentFileBuffer.slice(0),
            downloadPptx: downloadPptx,
            fetch: safeFetch,

            P_NS: P_NS,
            A_NS: A_NS,
            R_NS: R_NS,
            REL_NS: REL_NS,
            CT_NS: CT_NS,

            parseXml: parseXml,
            serializeXml: serializeXml,
            findSpByName: findSpByName,
            findSpById: findSpById,
            replaceInSp: replaceInSp,

            console: {
                log: (...args) => log('[console] ' + args.map(a => {
                    if (typeof a === 'object') { try { return JSON.stringify(a); } catch (e) { return String(a); } }
                    return String(a);
                }).join(' ')),
                warn: (...args) => log('[warn] ' + args.join(' '), 'warn'),
                error: (...args) => log('[error] ' + args.join(' '), 'error')
            },
            alert: (msg) => log('[alert] ' + msg)
        };

        const origTemplate = sandbox.TEMPLATE_PATH;
        const origOutput = sandbox.OUTPUT_PATH;

        try {
            const asyncWrapper = new Function('sandbox', `
                with (sandbox) {
                    return (async () => {
                        ${code}
                    })();
                }
            `);
            await asyncWrapper(sandbox);

            if (sandbox.OUTPUT_PATH !== origOutput) {
                log(`⚠️ 注意：OUTPUT_PATH 被代码修改为 ${sandbox.OUTPUT_PATH}`, 'warn');
            }
            if (sandbox.TEMPLATE_PATH !== origTemplate) {
                log(`⚠️ 注意：TEMPLATE_PATH 被代码修改为 ${sandbox.TEMPLATE_PATH}`, 'warn');
            }
            log('✅ 代码执行完成', 'success');
        } catch (err) {
            log(`❌ 执行出错：${err.message}`, 'error');
            if (err.stack) log(err.stack, 'error');
            alert(`执行出错：${err.message}`);
        }
    }

    document.getElementById('genPromptBtn').addEventListener('click', generatePrompt);
    document.getElementById('copyPromptBtn').addEventListener('click', copyPrompt);
    document.getElementById('clearPromptBtn').addEventListener('click', clearPrompt);
    document.getElementById('pasteCodeBtn').addEventListener('click', pasteCode);
    document.getElementById('runCodeBtn').addEventListener('click', runCode);
    document.getElementById('clearCodeBtn').addEventListener('click', clearCode);

    applyPage(1);
    renderSliderTicks();
})();
</script>

<script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script>
</body>
