    <meta charset="UTF-8">

    <title>余音绕仙梁</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        /* 深色科技感主题变量 */
        :root {
            --bg-deep: #0a0f1c;
            --bg-panel: #0f1422;
            --bg-card: #111827;
            --bg-elevated: #1a1f2e;
            --border-subtle: #2a3452;
            --border-glow: rgba(76, 154, 255, 0.4);
            --primary-blue: #4c9aff;
            --primary-blue-dark: #3b82f6;
            --primary-glow: rgba(76, 154, 255, 0.3);
            --primary-purple: #7c3aed;
            --primary-pink: #e11d48;
            --text-primary: #e0e0e0;
            --text-secondary: #9aa9c1;
            --text-muted: #6b7a8f;
            --accent-success: #48bb78;
            --accent-warning: #f39c12;
            --accent-danger: #f56565;
            --shadow-card: 0 8px 24px rgba(0, 0, 0, 0.4);
            --shadow-glow: 0 0 12px rgba(76, 154, 255, 0.2);
        }

        body {
            font-family: 'Segoe UI', 'Inter', system-ui, -apple-system, sans-serif;
            background: var(--bg-deep);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
        }

        /* 主卡片 - 宽屏优化，充分利用页面宽度 */
        .card {
            background: var(--bg-card);
            border-radius: 32px;
            padding: 32px 40px;
            width: 100%;
            max-width: 1400px;      /* 更大宽度，充分利用宽屏显示器 */
            margin: 0 auto;
            border: 1px solid var(--border-subtle);
            box-shadow: var(--shadow-card);
            transition: all 0.2s ease;
        }

        /* 大屏幕进一步增加内边距舒适度 */
        @media (min-width: 1600px) {
            .card {
                padding: 40px 56px;
                max-width: 1600px;
            }
        }

        /* 中小屏幕适当缩小内边距，避免过度紧凑 */
        @media (max-width: 768px) {
            .card {
                padding: 24px 20px;
            }
        }

        .card:hover {
            border-color: var(--border-glow);
        }

        h2 {
            margin: 0 0 8px 0;
            color: var(--text-primary);
            display: flex;
            align-items: center;
            gap: 12px;
            flex-wrap: wrap;
            font-size: 1.8rem;
            font-weight: 700;
            letter-spacing: -0.3px;
        }

        .subtitle {
            color: var(--text-secondary);
            font-size: 14px;
            margin-bottom: 28px;
            border-bottom: 1px solid var(--border-subtle);
            padding-bottom: 14px;
        }

        textarea {
            width: 100%;
            padding: 16px 18px;
            font-size: 15px;
            line-height: 1.5;
            border: 1px solid var(--border-subtle);
            border-radius: 20px;
            font-family: inherit;
            resize: vertical;
            transition: 0.2s;
            background: var(--bg-elevated);
            color: var(--text-primary);
        }

        textarea:focus {
            outline: none;
            border-color: var(--primary-blue);
            box-shadow: 0 0 0 3px rgba(76, 154, 255, 0.2);
        }

        textarea::placeholder {
            color: var(--text-muted);
        }

        /* 语音区域 + 速度滑块整合行: 选择器和滑块控件同行且充分利用宽度 */
        .voice-row {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 16px;
            margin: 20px 0 8px 0;
        }

        .voice-select-wrapper {
            flex: 2;
            min-width: 200px;
        }

        /* 速度滑块区域 - 替代原来的独立speed-control，直接放在语音行右侧 */
        .speed-inline {
            flex: 3;
            display: flex;
            align-items: center;
            gap: 14px;
            background: var(--bg-elevated);
            padding: 8px 18px;
            border-radius: 60px;
            border: 1px solid var(--border-subtle);
            transition: all 0.2s;
        }

        .speed-inline label {
            font-weight: 600;
            color: var(--text-secondary);
            font-size: 13px;
            white-space: nowrap;
        }

        .speed-inline input {
            flex: 1;
            min-width: 120px;
            height: 5px;
            border-radius: 5px;
            background: var(--border-subtle);
            -webkit-appearance: none;
        }

        .speed-inline input::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 16px;
            height: 16px;
            border-radius: 50%;
            background: var(--primary-blue);
            cursor: pointer;
            transition: 0.1s;
        }

        .speed-inline input::-webkit-slider-thumb:hover {
            transform: scale(1.2);
            background: var(--primary-blue-dark);
        }

        .speed-value {
            background: linear-gradient(135deg, var(--primary-blue), var(--primary-blue-dark));
            color: white;
            padding: 4px 16px;
            border-radius: 40px;
            font-size: 12px;
            font-weight: bold;
            white-space: nowrap;
        }

        select {
            width: 100%;
            padding: 10px 16px;
            font-size: 14px;
            border: 1px solid var(--border-subtle);
            border-radius: 60px;
            background: var(--bg-elevated);
            color: var(--text-primary);
            cursor: pointer;
            font-weight: 500;
            transition: 0.2s;
        }

        select:focus {
            outline: none;
            border-color: var(--primary-blue);
            box-shadow: 0 0 0 2px rgba(76, 154, 255, 0.2);
        }

        /* 模式切换按钮组 - 均衡分布 */
        .mode-buttons {
            display: flex;
            gap: 18px;
            margin: 28px 0 24px;
        }

        .mode-btn {
            flex: 1;
            padding: 14px 12px;
            font-size: 15px;
            font-weight: 600;
            border: 1px solid var(--border-subtle);
            border-radius: 60px;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            background: var(--bg-elevated);
            color: var(--text-secondary);
        }

        .mode-btn:hover {
            border-color: var(--primary-blue);
            color: var(--primary-blue);
            transform: translateY(-1px);
        }

        .mode-btn.download.active {
            background: linear-gradient(135deg, var(--primary-blue), var(--primary-blue-dark));
            color: white;
            border-color: transparent;
            box-shadow: 0 6px 14px rgba(76, 154, 255, 0.3);
        }

        .mode-btn.loop.active {
            background: linear-gradient(135deg, var(--primary-pink), #f43f5e);
            color: white;
            border-color: transparent;
            box-shadow: 0 6px 14px rgba(225, 29, 72, 0.3);
        }

        /* 双按钮区域: 开始与停止 - 并排布局充分利用宽度 */
        .action-buttons {
            display: flex;
            gap: 20px;
            margin: 8px 0 12px;
        }

        .control-btn {
            flex: 1;
            padding: 14px 12px;
            font-size: 16px;
            font-weight: 600;
            border: none;
            border-radius: 60px;
            cursor: pointer;
            transition: 0.2s;
            background: linear-gradient(135deg, var(--primary-blue), var(--primary-blue-dark));
            color: white;
        }

        .control-btn.stop {
            background: linear-gradient(135deg, #dc2626, #b91c1c);
        }

        .control-btn.stop:hover {
            transform: scale(0.98);
            filter: brightness(0.96);
        }

        .control-btn:hover {
            transform: translateY(-2px);
            filter: brightness(1.04);
        }

        /* 状态 + 提示区域：右侧提示占满整行（改为单行布局，状态在上，提示独占一行） */
        .info-stack {
            margin-top: 28px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .status {
            padding: 14px 20px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 500;
            transition: 0.2s;
            word-break: break-word;
        }

        .status.info {
            background: rgba(59, 130, 246, 0.12);
            color: var(--primary-blue);
            border-left: 4px solid var(--primary-blue);
        }

        .status.success {
            background: rgba(72, 187, 120, 0.12);
            color: var(--accent-success);
            border-left: 4px solid var(--accent-success);
        }

        .status.warning {
            background: rgba(243, 156, 18, 0.12);
            color: var(--accent-warning);
            border-left: 4px solid var(--accent-warning);
        }

        .status.error {
            background: rgba(245, 101, 101, 0.12);
            color: var(--accent-danger);
            border-left: 4px solid var(--accent-danger);
        }

        .tip-box {
            width: 100%;
            padding: 16px 22px;
            border-radius: 20px;
            font-size: 13px;
            line-height: 1.55;
            transition: 0.2s;
            color: var(--text-secondary);
            background: rgba(76, 154, 255, 0.06);
            border-left: 4px solid var(--primary-blue);
        }

        .tip-box.download-mode {
            background: rgba(76, 154, 255, 0.08);
            border-left: 4px solid var(--primary-blue);
        }

        .tip-box.loop-mode {
            background: rgba(225, 29, 72, 0.08);
            border-left: 4px solid var(--primary-pink);
        }

        .tip-box strong {
            color: var(--text-primary);
        }

        .loop-indicator {
            animation: gentlePulse 1.2s infinite;
            font-weight: 600;
            color: var(--primary-pink);
        }

        @keyframes gentlePulse {
            0% { opacity: 0.7; text-shadow: 0 0 0px var(--primary-pink); }
            100% { opacity: 1; text-shadow: 0 0 4px var(--primary-pink); }
        }

        /* 滚动条 */
        ::-webkit-scrollbar {
            width: 6px;
        }
        ::-webkit-scrollbar-track {
            background: var(--bg-panel);
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb {
            background: var(--border-subtle);
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: var(--primary-blue);
        }

        /* 响应式适配：平板和手机让语音行垂直排列，速度滑块保持完整 */
        @media (max-width: 860px) {
            .voice-row {
                flex-direction: column;
                align-items: stretch;
            }
            .speed-inline {
                justify-content: space-between;
            }
        }
    </style>
    <!-- 动态加载 lamejs (MP3转换) -->
    <script src="https://cdn.jsdelivr.net/npm/lamejs@1.2.0/lame.all.js"></script>

<body>
<div class="card" id="mainCard">
    <h2>
        🎧 余音绕仙梁
        <span id="loopIndicator" style="font-size: 14px;"></span>
    </h2>
    <div class="subtitle">系统真实语音 · 动态识别 · 语速可调 · 下载/循环双模式 · 宽屏沉浸体验</div>

    <textarea id="text" rows="4" placeholder="输入要朗读的文字...">余音袅袅，不绝如缕。这是系统真实语音的合成效果，无论下载MP3还是循环聆听，皆随心而动。</textarea>

    <!-- 语音选择区 + 速度滑块整合在同一行，移除了原有独立的 voice-quality-note 和 speed-control -->
    <div class="voice-row">
        <div class="voice-select-wrapper">
            <select id="voiceSelect"></select>
        </div>
        <div class="speed-inline">
            <label>⚡ 语速</label>
            <input type="range" id="speedSlider" min="0.5" max="2.0" step="0.05" value="1.0">
            <span class="speed-value" id="speedValue">1.0x</span>
        </div>
    </div>

    <div class="mode-buttons">
        <button class="mode-btn download" id="downloadModeBtn">
            <span>📥</span> 下载 MP3 模式
        </button>
        <button class="mode-btn loop" id="loopModeBtn">
            <span>🔁</span> 循环播放模式
        </button>
    </div>

    <!-- 开始停止并排布局 -->
    <div class="action-buttons">
        <button class="control-btn" id="actionBtn">▶️ 开始生成/播放</button>
        <button class="control-btn stop" id="stopBtn">⏹️ 停止所有</button>
    </div>

    <!-- 状态及提示区域：状态栏折叠消息，提示框独占整行（右侧提示占满） -->
    <div class="info-stack">
        <div id="status" class="status info">💡 先选择语音模式，然后点击开始</div>
        <div class="tip-box" id="tipBox">
            <strong>📌 新特性：</strong><br>
            • 🧠 语音列表完全基于您系统真实安装的语音引擎，不会失效。<br>
            • 🎙️ 每个选项对应不同音色/语言，可随意切换测试。<br>
            • 🔁 循环模式：自动无限重播，适合背景音或反复磨耳朵。<br>
            • 📥 下载模式：需麦克风权限，朗读后自动生成MP3文件保存。<br>
            • 🚀 语速0.5x~2.0x，实时生效。
        </div>
    </div>
</div>

<script>
    (function() {
        // ---------- DOM 元素 ----------
        const textarea = document.getElementById('text');
        const voiceSelect = document.getElementById('voiceSelect');
        const downloadModeBtn = document.getElementById('downloadModeBtn');
        const loopModeBtn = document.getElementById('loopModeBtn');
        const actionBtn = document.getElementById('actionBtn');
        const stopBtn = document.getElementById('stopBtn');
        const statusDiv = document.getElementById('status');
        const tipBox = document.getElementById('tipBox');
        const loopIndicatorSpan = document.getElementById('loopIndicator');
        const speedSlider = document.getElementById('speedSlider');
        const speedValueSpan = document.getElementById('speedValue');

        // ---------- 全局变量 ----------
        let currentMode = 'download';          // 'download' 或 'loop'
        let mediaRecorder = null;
        let audioChunks = [];
        let currentUtterance = null;           // 当前 speechSynthesis 实例
        let availableVoices = [];               // 存储最新语音列表 (SpeechSynthesisVoice[])
        let isLoopingActive = false;            // 循环标志
        let loopTimeoutId = null;
        let isCancelling = false;
        let mediaStreamTrack = null;
        
        // 当前语速
        let currentSpeed = 1.0;
        
        // ----- 辅助函数 -----
        function setStatus(message, type = 'info') {
            statusDiv.innerHTML = message;
            statusDiv.className = `status ${type}`;
        }
        
        // 动态更新界面模式样式 (移除了原来voice-quality-note 相关)
        function updateModeVisuals() {
            if (currentMode === 'download') {
                downloadModeBtn.classList.add('active');
                loopModeBtn.classList.remove('active');
                actionBtn.innerHTML = '📥 开始生成 MP3 文件';
                tipBox.className = 'tip-box download-mode';
                tipBox.innerHTML = `
                    <strong>📥 下载 MP3 模式指引：</strong><br>
                    • 🎧 请确保【已断开耳机】或外放声音，便于录音采集<br>
                    • 🎙️ 系统会朗读文字并自动通过麦克风录音<br>
                    • 💾 朗读完毕后自动转换为 MP3 并下载到设备<br>
                    • ⚠️ 需要允许麦克风权限，请按浏览器提示授权<br>
                    • 🌟 录制时保持环境安静效果更佳
                `;
            } else {
                loopModeBtn.classList.add('active');
                downloadModeBtn.classList.remove('active');
                actionBtn.innerHTML = '🔁 开始循环播放 (无限)';
                tipBox.className = 'tip-box loop-mode';
                tipBox.innerHTML = `
                    <strong>🔁 循环播放模式说明：</strong><br>
                    • ▶️ 点击开始，语音将无限循环播放<br>
                    • ⏹️ 点击停止按钮即可完全结束循环<br>
                    • 🎚️ 播放期间也可以实时调整语速 (滑块)<br>
                    • 📢 无需麦克风，直接调用系统语音引擎<br>
                    • 💡 适合背景音、语言学习反复跟读
                `;
            }
        }
        
        // 停止所有音频 (增强版，彻底终结所有语音和循环)
        function hardStopAll() {
            isCancelling = true;
            
            if (isLoopingActive) {
                isLoopingActive = false;
                if (loopTimeoutId) {
                    clearTimeout(loopTimeoutId);
                    loopTimeoutId = null;
                }
                loopIndicatorSpan.innerHTML = '';
            }
            
            if (currentUtterance) {
                try {
                    window.speechSynthesis.cancel();
                } catch(e) { /* ignore */ }
                currentUtterance = null;
            }
            
            if (mediaRecorder && mediaRecorder.state === 'recording') {
                try {
                    mediaRecorder.stop();
                } catch(e) {}
            }
            
            if (mediaStreamTrack) {
                try {
                    mediaStreamTrack.getTracks().forEach(track => track.stop());
                } catch(e) {}
                mediaStreamTrack = null;
            }
            
            setTimeout(() => {
                isCancelling = false;
            }, 80);
            setStatus('⏹️ 已停止所有播放/录音', 'info');
        }
        
        // 获取当前选中的语音对象
        function getSelectedVoiceObject() {
            const selectedVoiceName = voiceSelect.value;
            if (!selectedVoiceName || !availableVoices.length) return null;
            return availableVoices.find(voice => voice.name === selectedVoiceName) || null;
        }
        
        // 核心语音朗读函数 (返回Promise)
        function speakTextPromise(text, voiceObj) {
            return new Promise((resolve, reject) => {
                if (!window.speechSynthesis) {
                    reject(new Error("浏览器不支持语音合成"));
                    return;
                }
                if (currentUtterance) {
                    window.speechSynthesis.cancel();
                }
                const utterance = new SpeechSynthesisUtterance(text);
                if (voiceObj) {
                    utterance.voice = voiceObj;
                }
                utterance.rate = currentSpeed;
                utterance.pitch = 1.0;
                utterance.volume = 1;
                
                utterance.onend = () => {
                    currentUtterance = null;
                    if (!isCancelling) resolve();
                    else resolve(); // 确保promise完成
                };
                utterance.onerror = (event) => {
                    currentUtterance = null;
                    console.warn("语音错误:", event);
                    if (!isCancelling) reject(new Error(`语音出错: ${event.error || 'unknown'}`));
                    else resolve();
                };
                
                currentUtterance = utterance;
                window.speechSynthesis.speak(utterance);
            });
        }
        
        // 动态刷新语音列表 (去重 + 优先中文) - 移除了原来voice-quality-note更新逻辑，只填充下拉列表
        function refreshVoiceList() {
            let voices = window.speechSynthesis.getVoices();
            if (!voices || voices.length === 0) {
                setTimeout(refreshVoiceList, 120);
                return;
            }
            
            const uniqueMap = new Map();
            voices.forEach(voice => {
                const key = `${voice.name}|${voice.lang}`;
                if (!uniqueMap.has(key)) {
                    uniqueMap.set(key, voice);
                }
            });
            let uniqueVoices = Array.from(uniqueMap.values());
            
            const chineseVoices = uniqueVoices.filter(v => v.lang.toLowerCase().includes('zh') || v.lang.toLowerCase().includes('cn'));
            const otherVoices = uniqueVoices.filter(v => !v.lang.toLowerCase().includes('zh') && !v.lang.toLowerCase().includes('cn'));
            const sortedVoices = [...chineseVoices, ...otherVoices];
            
            if (sortedVoices.length === 0) {
                setStatus('⚠️ 未检测到任何系统语音，请检查浏览器或操作系统设置', 'warning');
                voiceSelect.innerHTML = '<option disabled>无可用语音</option>';
                availableVoices = [];
                return;
            }
            
            availableVoices = sortedVoices;
            const previousSelected = voiceSelect.value;
            voiceSelect.innerHTML = '';
            for (let i = 0; i < availableVoices.length; i++) {
                const voice = availableVoices[i];
                const option = document.createElement('option');
                option.value = voice.name;
                const isLocal = voice.localService ? '本地' : '网络';
                option.textContent = `${voice.name} (${voice.lang}) ${isLocal}`;
                voiceSelect.appendChild(option);
            }
            
            let reselectIndex = -1;
            if (previousSelected && availableVoices.some(v => v.name === previousSelected)) {
                reselectIndex = availableVoices.findIndex(v => v.name === previousSelected);
            } else {
                const firstChineseIndex = availableVoices.findIndex(v => v.lang.toLowerCase().includes('zh'));
                reselectIndex = firstChineseIndex !== -1 ? firstChineseIndex : 0;
            }
            if (reselectIndex >= 0) {
                voiceSelect.selectedIndex = reselectIndex;
            }
            
            // 不再显示“已加载xx语音 · 当前: xxx”的细节提示，保持简洁
            setStatus(`🎤 已加载 ${availableVoices.length} 个语音，请在列表中选择音色`, 'success');
        }
        
        if (window.speechSynthesis) {
            window.speechSynthesis.onvoiceschanged = () => {
                refreshVoiceList();
            };
            setTimeout(() => {
                if (window.speechSynthesis.getVoices().length === 0) {
                    let attempts = 0;
                    const interval = setInterval(() => {
                        if (window.speechSynthesis.getVoices().length > 0 || attempts > 20) {
                            clearInterval(interval);
                            refreshVoiceList();
                        }
                        attempts++;
                    }, 100);
                } else {
                    refreshVoiceList();
                }
            }, 50);
        } else {
            setStatus('❌ 浏览器不支持 Web Speech API', 'error');
        }
        
        // 语音切换时的简短状态反馈，不显示繁杂信息
        voiceSelect.addEventListener('change', () => {
            const voiceObj = getSelectedVoiceObject();
            if (voiceObj) {
                setStatus(`已切换语音: ${voiceObj.name}`, 'info');
            } else {
                setStatus(`语音选择无效，请重试`, 'warning');
            }
        });
        
        speedSlider.addEventListener('input', (e) => {
            currentSpeed = parseFloat(e.target.value);
            speedValueSpan.innerText = currentSpeed.toFixed(2) + 'x';
        });
        
        // 循环模式启动
        async function startLoopMode() {
            const text = textarea.value.trim();
            if (!text) {
                setStatus('❌ 请输入文字内容', 'error');
                return;
            }
            hardStopAll();
            await new Promise(r => setTimeout(r, 150));
            isCancelling = false;
            isLoopingActive = true;
            loopIndicatorSpan.innerHTML = '<span class="loop-indicator">🔁 循环播放中 (无限) 🔊</span>';
            setStatus(`🔁 循环模式运行中 | 当前语速 ${currentSpeed.toFixed(2)}x，点「停止」结束`, 'success');
            
            const voiceObj = getSelectedVoiceObject();
            if (!voiceObj) {
                setStatus('⚠️ 没有可用语音，请稍后或重新选择语音', 'warning');
                isLoopingActive = false;
                loopIndicatorSpan.innerHTML = '';
                return;
            }
            
            const playCycle = async () => {
                if (!isLoopingActive || isCancelling) return;
                try {
                    await speakTextPromise(text, voiceObj);
                    if (isLoopingActive && !isCancelling) {
                        loopTimeoutId = setTimeout(() => {
                            playCycle();
                        }, 240);
                    }
                } catch (err) {
                    console.error('循环播放出错:', err);
                    if (isLoopingActive && !isCancelling) {
                        setStatus(`❌ 语音异常: ${err.message}，已停止循环`, 'error');
                        isLoopingActive = false;
                        loopIndicatorSpan.innerHTML = '';
                    }
                }
            };
            playCycle();
        }
        
        // WebM 转 MP3 (沿用高质量转换)
        async function convertWebmToMp3(webmBlob) {
            return new Promise(async (resolve, reject) => {
                const reader = new FileReader();
                reader.onload = async function(ev) {
                    const arrayBuffer = ev.target.result;
                    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                    try {
                        const audioBuffer = await audioCtx.decodeAudioData(arrayBuffer);
                        const channelData = audioBuffer.getChannelData(0);
                        const sampleRate = audioBuffer.sampleRate;
                        const pcmData = new Int16Array(channelData.length);
                        for (let i = 0; i < channelData.length; i++) {
                            const s = Math.max(-1, Math.min(1, channelData[i]));
                            pcmData[i] = s < 0 ? s * 0x8000 : s * 0x7FFF;
                        }
                        const mp3Encoder = new lamejs.Mp3Encoder(1, sampleRate, 128);
                        const mp3Chunks = [];
                        const blockSize = 1152;
                        for (let i = 0; i < pcmData.length; i += blockSize) {
                            const end = Math.min(i + blockSize, pcmData.length);
                            const chunk = pcmData.subarray(i, end);
                            const mp3Buf = mp3Encoder.encodeBuffer(chunk);
                            if (mp3Buf.length > 0) mp3Chunks.push(mp3Buf);
                        }
                        const finalBuf = mp3Encoder.flush();
                        if (finalBuf.length > 0) mp3Chunks.push(finalBuf);
                        const mp3Blob = new Blob(mp3Chunks, { type: 'audio/mp3' });
                        resolve(mp3Blob);
                    } catch (err) {
                        reject(err);
                    } finally {
                        await audioCtx.close();
                    }
                };
                reader.onerror = reject;
                reader.readAsArrayBuffer(webmBlob);
            });
        }
        
        // 下载 MP3 模式
        async function startDownloadMode() {
            const text = textarea.value.trim();
            if (!text) {
                setStatus('❌ 请输入文字', 'error');
                return;
            }
            const userConfirm = confirm(
                '🎙️ 下载MP3前准备：\n\n' +
                '1. 请断开耳机，确保系统声音外放（便于麦克风捕捉）\n' +
                '2. 选择安静环境，减少杂音录入\n' +
                '3. 需要麦克风权限用于内录系统声音\n' +
                '4. 点击确定后自动朗读文字并录制，结束后下载 MP3\n\n' +
                '是否继续？'
            );
            if (!userConfirm) {
                setStatus('已取消下载生成', 'info');
                return;
            }
            
            hardStopAll();
            await new Promise(r => setTimeout(r, 100));
            isCancelling = false;
            audioChunks = [];
            setStatus('🎤 正在请求麦克风权限 (用于录制系统输出音频)...', 'info');
            
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                mediaStreamTrack = stream;
                let mimeType = 'audio/webm';
                if (MediaRecorder.isTypeSupported('audio/webm')) mimeType = 'audio/webm';
                else if (MediaRecorder.isTypeSupported('audio/mp4')) mimeType = 'audio/mp4';
                
                mediaRecorder = new MediaRecorder(stream, { mimeType });
                mediaRecorder.ondataavailable = (event) => {
                    if (event.data && event.data.size > 0) audioChunks.push(event.data);
                };
                
                mediaRecorder.onstop = async () => {
                    if (audioChunks.length === 0) {
                        setStatus('⚠️ 未录制到音频数据，请检查麦克风', 'warning');
                        if (mediaStreamTrack) {
                            mediaStreamTrack.getTracks().forEach(t => t.stop());
                            mediaStreamTrack = null;
                        }
                        return;
                    }
                    setStatus('🔄 正在编码 MP3，请稍等...', 'info');
                    const webmBlob = new Blob(audioChunks, { type: 'audio/webm' });
                    try {
                        if (typeof lamejs === 'undefined') {
                            throw new Error('lamejs库未加载，请检查网络');
                        }
                        const mp3Blob = await convertWebmToMp3(webmBlob);
                        const url = URL.createObjectURL(mp3Blob);
                        const a = document.createElement('a');
                        a.href = url;
                        a.download = `余音绕仙梁_${Date.now()}.mp3`;
                        document.body.appendChild(a);
                        a.click();
                        document.body.removeChild(a);
                        URL.revokeObjectURL(url);
                        setStatus('✅ MP3 下载完成！已保存到下载文件夹', 'success');
                    } catch (convErr) {
                        console.error("MP3转换失败，保底webm下载", convErr);
                        const fallbackUrl = URL.createObjectURL(webmBlob);
                        const fallbackA = document.createElement('a');
                        fallbackA.href = fallbackUrl;
                        fallbackA.download = `tts_backup_${Date.now()}.webm`;
                        fallbackA.click();
                        URL.revokeObjectURL(fallbackUrl);
                        setStatus('⚠️ MP3转换失败，已保存为WebM格式，可用播放器播放', 'warning');
                    } finally {
                        if (mediaStreamTrack) {
                            mediaStreamTrack.getTracks().forEach(t => t.stop());
                            mediaStreamTrack = null;
                        }
                    }
                };
                
                mediaRecorder.start(200);
                setStatus(`🗣️ 朗读开始 (语速 ${currentSpeed.toFixed(2)}x)，请保持环境安静...`, 'info');
                
                const voiceObj = getSelectedVoiceObject();
                if (!voiceObj) {
                    setStatus('❌ 没有可用语音，无法朗读', 'error');
                    if (mediaRecorder && mediaRecorder.state === 'recording') mediaRecorder.stop();
                    return;
                }
                await speakTextPromise(text, voiceObj);
                
                setStatus('📼 朗读结束，正在封装音频...', 'info');
                setTimeout(() => {
                    if (mediaRecorder && mediaRecorder.state === 'recording') {
                        mediaRecorder.stop();
                    } else if (mediaStreamTrack) {
                        mediaStreamTrack.getTracks().forEach(t => t.stop());
                        mediaStreamTrack = null;
                    }
                }, 500);
            } catch (err) {
                console.error("麦克风错误:", err);
                let errMsg = '❌ 无法获取麦克风权限或录音失败。';
                if (err.name === 'NotAllowedError') errMsg = '❌ 麦克风权限被拒绝。请点击地址栏锁图标允许麦克风后刷新重试。';
                else if (err.name === 'NotFoundError') errMsg = '❌ 未检测到麦克风设备，请检查硬件连接。';
                setStatus(errMsg, 'error');
                if (mediaStreamTrack) {
                    mediaStreamTrack.getTracks().forEach(t => t.stop());
                    mediaStreamTrack = null;
                }
            }
        }
        
        function onMainAction() {
            if (currentMode === 'download') {
                startDownloadMode();
            } else {
                startLoopMode();
            }
        }
        
        function setMode(mode) {
            if (mode === currentMode) return;
            hardStopAll();
            currentMode = mode;
            updateModeVisuals();
            // 移除原有“已切换到下载MP3模式”的冗余提示，直接显示简洁内容
            setStatus(`✨ 已切换至 ${mode === 'download' ? '下载MP3' : '循环播放'} 模式`, 'info');
        }
        
        downloadModeBtn.onclick = () => setMode('download');
        loopModeBtn.onclick = () => setMode('loop');
        actionBtn.onclick = onMainAction;
        stopBtn.onclick = hardStopAll;
        
        currentMode = 'download';
        updateModeVisuals();
        setStatus('🎉 语音列表已加载，选择音色后点击开始', 'success');
        
        setInterval(() => {
            if (window.speechSynthesis && window.speechSynthesis.getVoices().length !== availableVoices.length) {
                refreshVoiceList();
            }
        }, 10000);
    })();
</script>
