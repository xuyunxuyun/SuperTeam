                            edge.color = color;
                            render(tab); saveAllToLocal();
                            showTip('连线颜色已更新');
                        }
                    } else {
                        showTip('请先选中一条连线');
                    }
                });

                document.getElementById('applyFillColor').addEventListener('click', () => {
                    const color = document.getElementById('fillColorPicker').value;
                    const tab = getActiveTab();
                    if (tab && tab.selectedNodeId) {
                        const node = getNodeById(tab, tab.selectedNodeId);
                        if (node) { node.fillColor = color; render(tab); saveAllToLocal(); showTip('填充色已应用'); }
                    } else showTip('请先选中一个节点');
                });

                document.getElementById('applyBorderColor').addEventListener('click', () => {
                    const color = document.getElementById('borderColorPicker').value;
                    const tab = getActiveTab();
                    if (tab && tab.selectedNodeId) {
                        const node = getNodeById(tab, tab.selectedNodeId);
                        if (node) { node.borderColor = color; render(tab); saveAllToLocal(); showTip('边框色已应用'); }
                    } else showTip('请先选中一个节点');
                });

                document.getElementById('applyEdgeColor').addEventListener('click', () => {
                    const color = document.getElementById('edgeColorPicker').value;
                    const tab = getActiveTab();
                    if (tab && tab.selectedEdgeId) {
                        const edge = getEdgeById(tab, tab.selectedEdgeId);
                        if (edge) { edge.color = color; render(tab); saveAllToLocal(); showTip('连线颜色已应用'); }
                    } else showTip('请先选中一条连线');
                });
            }

            function initContextMenu() {
                const menu = document.getElementById('contextMenu');
                const ctxExportJson = document.getElementById('ctxExportJson');
                const ctxExportPng = document.getElementById('ctxExportPng');
                const ctxReplaceRect = document.getElementById('ctxReplaceRect');
                const ctxReplaceCircle = document.getElementById('ctxReplaceCircle');
                const ctxReplaceDiamond = document.getElementById('ctxReplaceDiamond');
                const ctxReplaceStraight = document.getElementById('ctxReplaceStraight');
                const ctxReplacePolyline = document.getElementById('ctxReplacePolyline');
                const ctxQuickFill = document.getElementById('ctxQuickFill');
                const ctxQuickBorder = document.getElementById('ctxQuickBorder');
                const ctxQuickEdgeColor = document.getElementById('ctxQuickEdgeColor');

                let rightClickedTab = null;
                let rightClickedNodeId = null;
                let rightClickedEdgeId = null;

                document.addEventListener('contextmenu', (e) => {
                    e.preventDefault();
                    const tab = getActiveTab();
                    if (!tab) return;

                    const canvas = tab.canvas;
                    const rect = canvas.getBoundingClientRect();
                    const scaleX = canvas.width / rect.width;
                    const scaleY = canvas.height / rect.height;
                    const sx = (e.clientX - rect.left) * scaleX;
                    const sy = (e.clientY - rect.top) * scaleY;
                    const cp = screenToCanvas(tab, sx, sy);

                    const clickedNode = getNodeAtPosition(tab, cp.x, cp.y);
                    const clickedEdge = !clickedNode ? getEdgeAtPosition(tab, cp.x, cp.y) : null;

                    rightClickedTab = tab;
                    rightClickedNodeId = clickedNode ? clickedNode.id : null;
                    rightClickedEdgeId = clickedEdge ? clickedEdge.id : null;

                    if (clickedNode) {
                        setSelection(tab, { nodeId: clickedNode.id });
                        render(tab);
                    } else if (clickedEdge) {
                        setSelection(tab, { edgeId: clickedEdge.id });
                        render(tab);
                    }

                    const nodeItems = [ctxReplaceRect, ctxReplaceCircle, ctxReplaceDiamond];
                    const edgeItems = [ctxReplaceStraight, ctxReplacePolyline];
                    const colorItems = [ctxQuickFill, ctxQuickBorder, ctxQuickEdgeColor];

                    if (clickedNode) {
                        nodeItems.forEach(item => item.style.display = 'flex');
                        edgeItems.forEach(item => item.style.display = 'none');
                        ctxQuickFill.style.display = 'flex';
                        ctxQuickBorder.style.display = 'flex';
                        ctxQuickEdgeColor.style.display = 'none';
                    } else if (clickedEdge) {
                        nodeItems.forEach(item => item.style.display = 'none');
                        edgeItems.forEach(item => item.style.display = 'flex');
                        ctxQuickFill.style.display = 'none';
                        ctxQuickBorder.style.display = 'none';
                        ctxQuickEdgeColor.style.display = 'flex';
                    } else {
                        nodeItems.forEach(item => item.style.display = 'none');
                        edgeItems.forEach(item => item.style.display = 'none');
                        colorItems.forEach(item => item.style.display = 'none');
                    }

                    menu.style.display = 'block';
                    menu.style.left = Math.min(e.clientX, window.innerWidth - 220) + 'px';
                    menu.style.top = Math.min(e.clientY, window.innerHeight - (clickedNode || clickedEdge ? 280 : 120)) + 'px';

                    const closeMenu = () => {
                        menu.style.display = 'none';
                        document.removeEventListener('click', closeMenu);
                    };
                    setTimeout(() => document.addEventListener('click', closeMenu), 10);
                });

                ctxQuickFill.addEventListener('click', () => {
                    document.getElementById('accordionMenuWrapper').classList.add('menu-visible');
                    showTip('请在左侧菜单中使用填充色选择器');
                    menu.style.display = 'none';
                });
                ctxQuickBorder.addEventListener('click', () => {
                    document.getElementById('accordionMenuWrapper').classList.add('menu-visible');
                    showTip('请在左侧菜单中使用边框色选择器');
                    menu.style.display = 'none';
                });
                ctxQuickEdgeColor.addEventListener('click', () => {
                    document.getElementById('accordionMenuWrapper').classList.add('menu-visible');
                    showTip('请在左侧菜单中使用连线颜色选择器');
                    menu.style.display = 'none';
                });

                ctxExportJson.addEventListener('click', () => {
                    const tab = getActiveTab();
                    if (tab) downloadJSON(exportTabJson(tab), `flowchart_${tab.name}_${Date.now()}.json`);
                    menu.style.display = 'none';
                });

                ctxExportPng.addEventListener('click', () => {
                    const tab = getActiveTab();
                    if (tab) exportTabImage(tab);
                    menu.style.display = 'none';
                });

                function replaceNodeType(newType) {
                    if (!rightClickedTab || !rightClickedNodeId) return;
                    const tab = rightClickedTab;
                    const node = getNodeById(tab, rightClickedNodeId);
                    if (!node) return;

                    const savedFill = node.fillColor;
                    const savedBorder = node.borderColor;

                    const center = getNodeCenter(node);
                    let width, height;
                    if (newType === 'circle') { width = 80; height = 80; }
                    else if (newType === 'diamond') { width = 130; height = 100; }
                    else { width = 150; height = 60; }

                    node.type = newType;
                    node.width = width;
                    node.height = height;
                    node.x = center.x - width / 2;
                    node.y = center.y - height / 2;

                    if (isValidColor(savedFill)) {
                        node.fillColor = savedFill;
                    } else {
                        node.fillColor = DEFAULT_NODE_COLORS[newType]?.fill || '#1e2a4a';
                    }
                    if (isValidColor(savedBorder)) {
                        node.borderColor = savedBorder;
                    } else {
                        node.borderColor = DEFAULT_NODE_COLORS[newType]?.border || '#3b82f6';
                    }

                    if (!node.text || node.text === '节点' || node.text === '开始/结束' || node.text === '分支') {
                        node.text = newType === 'circle' ? '开始/结束' : (newType === 'diamond' ? '分支' : '节点');
                    }

                    setSelection(tab, { nodeId: node.id });
                    render(tab); saveAllToLocal();
                    showTip(`已替换为${newType === 'circle' ? '圆形' : (newType === 'diamond' ? '菱形' : '矩形')}节点，颜色已保留`);
                    menu.style.display = 'none';
                }

                ctxReplaceRect.addEventListener('click', () => replaceNodeType('rect'));
                ctxReplaceCircle.addEventListener('click', () => replaceNodeType('circle'));
                ctxReplaceDiamond.addEventListener('click', () => replaceNodeType('diamond'));

                function replaceEdgeType(toPolyline) {
                    if (!rightClickedTab || !rightClickedEdgeId) return;
                    const tab = rightClickedTab;
                    const edge = getEdgeById(tab, rightClickedEdgeId);
                    if (!edge) return;

                    if (edge.polyline === toPolyline) {
                        showTip(`已经是${toPolyline ? '折线' : '直线'}连线`);
                        menu.style.display = 'none';
                        return;
                    }

                    edge.polyline = toPolyline;
                    if (toPolyline) {
                        if (!edge.bendPoints || edge.bendPoints.length !== 2) {
                            edge.bendPoints = getBendPoints(tab, edge);
                        }
                        edge.manualBend = false;
                    } else {
                        edge.bendPoints = null;
                        edge.manualBend = false;
                    }

                    setSelection(tab, { edgeId: edge.id });
                    render(tab); saveAllToLocal();
                    showTip(`已替换为${toPolyline ? '折线' : '直线'}连线`);
                    menu.style.display = 'none';
                }

                ctxReplaceStraight.addEventListener('click', () => replaceEdgeType(false));
                ctxReplacePolyline.addEventListener('click', () => replaceEdgeType(true));
            }

            function zoomByFactor(tab, factor) {
                if (!tab) return;
                const canvas = tab.canvas;
                const sx = canvas.width / 2;
                const sy = canvas.height / 2;
                const before = screenToCanvas(tab, sx, sy);
                const newScale = Math.min(MAX_SCALE, Math.max(MIN_SCALE, tab.scale * factor));
                if (newScale === tab.scale) return;
                tab.scale = newScale;
                tab.canvasOffsetX = sx - before.x * tab.scale;
                tab.canvasOffsetY = sy - before.y * tab.scale;
                render(tab);
                updateZoomIndicator(tab);
                saveAllToLocal();
            }

            function resetView(tab) {
                if (!tab) return;
                tab.scale = 1;
                tab.canvasOffsetX = 0;
                tab.canvasOffsetY = 0;
                render(tab);
                updateZoomIndicator(tab);
                saveAllToLocal();
            }

            function init() {
                initMenu(); initContextMenu(); initColorPanel();
                const loaded = loadFromLocal();
                if (!loaded || tabs.length === 0) {
                    const tab = createNewTab('默认画布');
                }
                document.getElementById('addTabBtn').addEventListener('click', () => createNewTab());
                document.getElementById('addRectBtn').addEventListener('click', () => { const tab = getActiveTab(); if (tab) addNode(tab, 'rect', 300 + Math.random() * 100, 200 + Math.random() * 100, '矩形节点'); });
                document.getElementById('addCircleBtn').addEventListener('click', () => { const tab = getActiveTab(); if (tab) addNode(tab, 'circle', 300 + Math.random() * 100, 200 + Math.random() * 100, '开始/结束'); });
                document.getElementById('addDiamondBtn').addEventListener('click', () => { const tab = getActiveTab(); if (tab) addNode(tab, 'diamond', 300 + Math.random() * 100, 200 + Math.random() * 100, '分支'); });
                document.getElementById('straightLineBtn').addEventListener('click', () => { const tab = getActiveTab(); if (tab) { tab.connectMode = tab.connectMode === 'straight' ? null : 'straight'; tab.connectSourceNodeId = null; updateMenuButtons(tab); render(tab); } });
                document.getElementById('polylineBtn').addEventListener('click', () => { const tab = getActiveTab(); if (tab) { tab.connectMode = tab.connectMode === 'polyline' ? null : 'polyline'; tab.connectSourceNodeId = null; updateMenuButtons(tab); render(tab); } });
                document.getElementById('zoomInBtn').addEventListener('click', () => { const tab = getActiveTab(); if (tab) zoomByFactor(tab, WHEEL_FACTOR); });
                document.getElementById('zoomOutBtn').addEventListener('click', () => { const tab = getActiveTab(); if (tab) zoomByFactor(tab, 1 / WHEEL_FACTOR); });
                document.getElementById('resetViewBtn').addEventListener('click', () => { const tab = getActiveTab(); if (tab) resetView(tab); });
                document.getElementById('deleteSelectedBtn').addEventListener('click', () => { const tab = getActiveTab(); if (tab) deleteSelected(tab); });
                document.getElementById('exportJsonBtn').addEventListener('click', () => { const tab = getActiveTab(); if (tab) downloadJSON(exportTabJson(tab), `flowchart_${tab.name}_${Date.now()}.json`); });
                document.getElementById('importJsonBtn').addEventListener('click', () => document.getElementById('fileInput').click());
                document.getElementById('fileInput').addEventListener('change', (e) => { const tab = getActiveTab(); const file = e.target.files[0]; if (file && tab) { const reader = new FileReader(); reader.onload = (ev) => importTabJson(tab, ev.target.result); reader.readAsText(file); } e.target.value = ''; });
                document.getElementById('clearBtn').addEventListener('click', () => { const tab = getActiveTab(); if (tab && confirm('确定清空当前画布？')) clearTab(tab); });
                window.addEventListener('resize', () => { tabs.forEach(t => { resizeCanvas(t); render(t); }); });
                window.addEventListener('keydown', (e) => { if ((e.key === 'Delete' || e.key === 'Backspace') && document.activeElement === document.body) { const tab = getActiveTab(); if (tab) deleteSelected(tab); } });
            }

            init();
        })();
    </script>
</body>
</html>
